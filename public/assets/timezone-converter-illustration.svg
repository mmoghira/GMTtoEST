<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">MST to EST converter interface illustration</title>
  <desc id="desc">A modern time zone converter interface with Mountain Time input, Eastern Time output, a swap control, and calendar planning elements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#041018"/>
      <stop offset="0.45" stop-color="#0e2a43"/>
      <stop offset="1" stop-color="#153f5c"/>
    </linearGradient>
    <linearGradient id="button" x1="0" x2="1">
      <stop offset="0" stop-color="#36c7b5"/>
      <stop offset="1" stop-color="#8fd7ff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1200" height="800" rx="32" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="118" y="118" width="964" height="564" rx="28" fill="#123f55" stroke="#4b7890"/>
    <rect x="168" y="188" width="392" height="144" rx="18" fill="#0b2536" stroke="#345f73"/>
    <rect x="640" y="188" width="392" height="144" rx="18" fill="#0b2536" stroke="#345f73"/>
    <rect x="168" y="388" width="864" height="130" rx="22" fill="#0b2536" stroke="#2dd4bf"/>
  </g>
  <text x="168" y="170" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="22" font-weight="800">MST to EST converter</text>
  <text x="198" y="240" fill="#fbbf24" font-family="Arial, sans-serif" font-size="22" font-weight="800">Mountain Time</text>
  <text x="198" y="292" fill="#ffffff" font-family="Arial, sans-serif" font-size="44" font-weight="900">9:00 AM MST</text>
  <text x="670" y="240" fill="#2dd4bf" font-family="Arial, sans-serif" font-size="22" font-weight="800">Eastern Time</text>
  <text x="670" y="292" fill="#ffffff" font-family="Arial, sans-serif" font-size="44" font-weight="900">11:00 AM EST</text>
  <circle cx="600" cy="260" r="44" fill="#062334" stroke="#8fd7ff" stroke-width="3"/>
  <path d="M582 249 H618 M606 237 L622 249 L606 261 M618 274 H582 M594 262 L578 274 L594 286" fill="none" stroke="#8fd7ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="198" y="450" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="20" font-weight="800">Selected date</text>
  <text x="198" y="492" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="900">DST-aware result</text>
  <rect x="760" y="424" width="230" height="58" rx="29" fill="url(#button)"/>
  <text x="875" y="462" fill="#062334" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="900">Convert</text>
  <g fill="#f59e0b">
    <circle cx="264" cy="610" r="18"/>
    <circle cx="340" cy="610" r="18"/>
    <circle cx="416" cy="610" r="18"/>
  </g>
  <g fill="#2dd4bf">
    <circle cx="784" cy="610" r="18"/>
    <circle cx="860" cy="610" r="18"/>
    <circle cx="936" cy="610" r="18"/>
  </g>
  <text x="600" y="628" text-anchor="middle" fill="#d7eef8" font-family="Arial, sans-serif" font-size="24" font-weight="700">Date picker, 12/24-hour input, live offsets, and copy-ready output</text>
</svg>
