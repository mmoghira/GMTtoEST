<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="diagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06151f"/>
      <stop offset="100%" stop-color="#0c354a"/>
    </linearGradient>
    <linearGradient id="fullGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36c7b5"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="halfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#diagBg)"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="180" height="24" rx="12" fill="rgba(54, 199, 181, 0.15)" stroke="#36c7b5" stroke-width="1.2"/>
    <text x="14" y="16" fill="#36c7b5" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" letter-spacing="1">VISUAL PROGRESSION</text>
    <text x="0" y="60" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800">How the Visual Timer Shrinks Over Time</text>
    <text x="0" y="84" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="14">A clear, proportional bar display making time passing visible at a glance.</text>
  </g>

  <!-- 3 Stages Container -->
  <g transform="translate(40, 115)">
    
    <!-- Stage 1: Full Duration (100%) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="720" height="84" rx="10" fill="#082030" stroke="#1e5f80" stroke-width="1.5"/>
      <text x="24" y="28" fill="#36c7b5" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800">1. START OF SESSION (15:00 REMAINING)</text>
      <text x="696" y="28" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700" text-anchor="end">100% FULL</text>
      <!-- Progress Bar Track -->
      <rect x="24" y="40" width="672" height="24" rx="12" fill="#06151f" stroke="#12455d" stroke-width="1"/>
      <rect x="26" y="42" width="668" height="20" rx="10" fill="url(#fullGrad)"/>
    </g>

    <!-- Stage 2: Halfway Mark (50%) -->
    <g transform="translate(0, 98)">
      <rect x="0" y="0" width="720" height="84" rx="10" fill="#082030" stroke="#1e5f80" stroke-width="1.5"/>
      <text x="24" y="28" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800">2. MIDPOINT (07:30 REMAINING)</text>
      <text x="696" y="28" fill="#fbbf24" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700" text-anchor="end">50% SHRUNK</text>
      <!-- Progress Bar Track -->
      <rect x="24" y="40" width="672" height="24" rx="12" fill="#06151f" stroke="#12455d" stroke-width="1"/>
      <rect x="26" y="42" width="336" height="20" rx="10" fill="url(#halfGrad)"/>
    </g>

    <!-- Stage 3: Final Minute (7% Remaining) -->
    <g transform="translate(0, 196)">
      <rect x="0" y="0" width="720" height="84" rx="10" fill="#082030" stroke="#ef4444" stroke-width="1.5"/>
      <text x="24" y="28" fill="#f87171" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800">3. FINAL STRETCH (01:00 REMAINING)</text>
      <text x="696" y="28" fill="#f87171" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700" text-anchor="end">NEAR COMPLETION</text>
      <!-- Progress Bar Track -->
      <rect x="24" y="40" width="672" height="24" rx="12" fill="#06151f" stroke="#12455d" stroke-width="1"/>
      <rect x="26" y="42" width="46" height="20" rx="10" fill="url(#warnGrad)"/>
    </g>
  </g>

  <!-- Explanatory Footer -->
  <text x="400" y="425" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    When the bar reaches zero, the timer clearly displays "Time's up" without automatic reloads.
  </text>
</svg>