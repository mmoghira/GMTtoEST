
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="45" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">Wall Street Trading Hours (NYSE &amp; NASDAQ)</text>
  
  <g transform="translate(80, 100)">
    <!-- Background grid -->
    <rect width="640" height="280" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Pre-Market Column -->
    <g transform="translate(20, 30)">
      <rect width="180" height="220" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="90" y="35" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="bold">Pre-Market</text>
      <text x="90" y="70" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#e2e8f0" font-weight="bold" text-anchor="middle">04:00 AM - 09:30 AM</text>
      <text x="90" y="110" font-family="'Manrope', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Early Institutional Trades</text>
    </g>

    <!-- Core Hours Column -->
    <g transform="translate(220, 20)">
      <rect width="200" height="240" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" filter="drop-shadow(0 0 10px #f59e0b)"/>
      <text x="100" y="40" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#f59e0b" text-anchor="middle" font-weight="bold">Core Trading Hours</text>
      <text x="100" y="80" font-family="'Space Grotesk', sans-serif" font-size="20" fill="#e2e8f0" font-weight="bold" text-anchor="middle">09:30 AM - 04:00 PM</text>
      <text x="100" y="120" font-family="'Manrope', sans-serif" font-size="12" fill="#10b981" text-anchor="middle" font-weight="bold">Standard Trading Window</text>
      <text x="100" y="150" font-family="'Manrope', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">NYSE Opening Bell: 9:30 AM</text>
      <text x="100" y="175" font-family="'Manrope', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">NYSE Closing Bell: 4:00 PM</text>
    </g>

    <!-- After Hours Column -->
    <g transform="translate(440, 30)">
      <rect width="180" height="220" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="90" y="35" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="bold">After-Hours</text>
      <text x="90" y="70" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#e2e8f0" font-weight="bold" text-anchor="middle">04:00 PM - 08:00 PM</text>
      <text x="90" y="110" font-family="'Manrope', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Post-Market Earnings Reports</text>
    </g>
  </g>
</svg>
