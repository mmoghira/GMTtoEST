<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="shBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061824" />
      <stop offset="100%" stop-color="#0e3a50" />
    </linearGradient>
    <linearGradient id="shCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0b3145" />
    </linearGradient>
    <filter id="shShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#shBgGrad)" />

  <!-- Header -->
  <g transform="translate(400, 45)" text-anchor="middle">
    <text x="0" y="0" font-family="'Space Grotesk', system-ui, sans-serif" font-size="24" font-weight="800" fill="#f4fbff">Same-Day vs. Overnight Work Shifts</text>
    <text x="0" y="26" font-family="'Manrope', system-ui, sans-serif" font-size="14" fill="#bdd2dc">Understanding why overnight shift calculations require incrementing the date</text>
  </g>

  <g transform="translate(50, 105)">
    <!-- Left Card: Day Shift -->
    <g transform="translate(0, 0)" filter="url(#shShadow)">
      <rect width="335" height="270" rx="14" fill="url(#shCard)" stroke="#36c7b5" stroke-width="2" />
      <rect x="0" y="0" width="335" height="42" rx="14" fill="#156073" />
      <rect x="0" y="28" width="335" height="14" fill="#156073" />
      <text x="167" y="27" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">DAY SHIFT (SAME DAY)</text>
      
      <g transform="translate(25, 65)">
        <text x="0" y="20" font-family="'Manrope', system-ui, sans-serif" font-size="13" fill="#bdd2dc">Start: 25 Oct, 09:00</text>
        <text x="0" y="44" font-family="'Manrope', system-ui, sans-serif" font-size="13" fill="#bdd2dc">End: &#160;25 Oct, 17:30</text>
        
        <rect x="0" y="65" width="285" height="65" rx="8" fill="#071b26" stroke="#256e91" stroke-width="1" />
        <text x="142" y="94" font-family="'Space Grotesk', system-ui, sans-serif" font-size="24" font-weight="800" fill="#36c7b5" text-anchor="middle">8h 30m Duration</text>
        <text x="142" y="118" font-family="'Manrope', system-ui, sans-serif" font-size="13" font-weight="600" fill="#8fd7ff" text-anchor="middle">8.50 Decimal Hours</text>
        
        <text x="0" y="160" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#bdd2dc">• Zero calendar date rollover</text>
        <text x="0" y="180" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#bdd2dc">• Standard daytime business hours</text>
      </g>
    </g>

    <!-- Right Card: Night Shift -->
    <g transform="translate(365, 0)" filter="url(#shShadow)">
      <rect width="335" height="270" rx="14" fill="url(#shCard)" stroke="#fbbf24" stroke-width="2" />
      <rect x="0" y="0" width="335" height="42" rx="14" fill="#6a5214" />
      <rect x="0" y="28" width="335" height="14" fill="#6a5214" />
      <text x="167" y="27" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="middle">OVERNIGHT SHIFT (NEXT DAY)</text>
      
      <g transform="translate(25, 65)">
        <text x="0" y="20" font-family="'Manrope', system-ui, sans-serif" font-size="13" fill="#bdd2dc">Start: 25 Oct, 22:00</text>
        <text x="0" y="44" font-family="'Manrope', system-ui, sans-serif" font-size="13" fill="#fbbf24">End: &#160;26 Oct, 06:00 (+1 Day)</text>
        
        <rect x="0" y="65" width="285" height="65" rx="8" fill="#071b26" stroke="#256e91" stroke-width="1" />
        <text x="142" y="94" font-family="'Space Grotesk', system-ui, sans-serif" font-size="24" font-weight="800" fill="#fbbf24" text-anchor="middle">8h 00m Duration</text>
        <text x="142" y="118" font-family="'Manrope', system-ui, sans-serif" font-size="13" font-weight="600" fill="#8fd7ff" text-anchor="middle">8.00 Decimal Hours</text>
        
        <text x="0" y="160" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#bdd2dc">• Crosses 00:00 midnight boundary</text>
        <text x="0" y="180" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#bdd2dc">• End date MUST be set to following day</text>
      </g>
    </g>
  </g>

  <!-- Footer note -->
  <g transform="translate(400, 420)" text-anchor="middle">
    <text font-family="'Manrope', system-ui, sans-serif" font-size="12" font-style="italic" fill="#8fd7ff">
      If the end date is not incremented past midnight, the tool correctly reports: "End must be after start."
    </text>
  </g>
</svg>