
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="40" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#f59e0b" text-anchor="middle">Australian Cities World Clock Dashboard</text>
  
  <!-- Clock 1: Perth -->
  <g transform="translate(60, 100)">
    <rect width="150" height="220" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="75" y="30" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Perth</text>
    <text x="75" y="50" font-family="'Manrope', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">AWST (UTC+8)</text>
    <circle cx="75" cy="115" r="45" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <!-- Hands representing 12:00 -->
    <line x1="75" y1="115" x2="75" y2="85" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="75" y1="115" x2="95" y2="115" stroke="#f59e0b" stroke-width="2"/>
    <text x="75" y="195" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold" fill="#f59e0b" text-anchor="middle">12:00 PM</text>
  </g>

  <!-- Clock 2: Adelaide -->
  <g transform="translate(240, 100)">
    <rect width="150" height="220" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="75" y="30" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Adelaide</text>
    <text x="75" y="50" font-family="'Manrope', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">ACST (UTC+9:30)</text>
    <circle cx="75" cy="115" r="45" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <!-- Hands representing 1:30 -->
    <line x1="75" y1="115" x2="96" y2="100" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="75" y1="115" x2="75" y2="150" stroke="#10b981" stroke-width="2"/>
    <text x="75" y="195" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold" fill="#10b981" text-anchor="middle">1:30 PM</text>
  </g>

  <!-- Clock 3: Sydney -->
  <g transform="translate(420, 100)">
    <rect width="150" height="220" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="75" y="30" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Sydney</text>
    <text x="75" y="50" font-family="'Manrope', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">AEST (UTC+10)</text>
    <circle cx="75" cy="115" r="45" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <!-- Hands representing 2:00 -->
    <line x1="75" y1="115" x2="97" y2="102" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="75" y1="115" x2="75" y2="80" stroke="#38bdf8" stroke-width="2"/>
    <text x="75" y="195" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold" fill="#38bdf8" text-anchor="middle">2:00 PM</text>
  </g>

  <!-- Clock 4: Lord Howe Island -->
  <g transform="translate(600, 100)">
    <rect width="150" height="220" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="75" y="30" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Lord Howe Island</text>
    <text x="75" y="50" font-family="'Manrope', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">LHST (UTC+10:30)</text>
    <circle cx="75" cy="115" r="45" fill="#0f172a" stroke="#ec4899" stroke-width="2"/>
    <!-- Hands representing 2:30 -->
    <line x1="75" y1="115" x2="105" y2="115" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="75" y1="115" x2="75" y2="150" stroke="#ec4899" stroke-width="2"/>
    <text x="75" y="195" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold" fill="#ec4899" text-anchor="middle">2:30 PM</text>
  </g>
</svg>
