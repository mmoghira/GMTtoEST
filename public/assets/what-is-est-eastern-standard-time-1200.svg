<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26" />
      <stop offset="100%" stop-color="#0f3c52" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36c7b5" />
      <stop offset="100%" stop-color="#8fd7ff" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0c354a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <path d="M-100 480 C 200 580, 500 320, 900 520 C 1100 600, 1200 480, 1300 520 L1300 630 L-100 630 Z" fill="url(#accentGrad)" opacity="0.12" />

  <!-- Header Branding -->
  <g transform="translate(80, 70)">
    <rect width="56" height="56" rx="12" fill="url(#accentGrad)" />
    <circle cx="28" cy="28" r="18" fill="none" stroke="#071b26" stroke-width="3.5" />
    <path d="M28 14 L28 28 L38 28" fill="none" stroke="#071b26" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="76" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="bold" fill="#f4fbff">GMT to EST Converter</text>
  </g>

  <!-- Title & Intro -->
  <g transform="translate(80, 200)">
    <rect width="200" height="34" rx="17" fill="#1b536e" />
    <text x="100" y="22" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="800" fill="#36c7b5" text-anchor="middle" letter-spacing="1.5">EDITORIAL GUIDE</text>
    
    <text x="0" y="95" font-family="'Space Grotesk', system-ui, sans-serif" font-size="58" font-weight="bold" fill="#f4fbff">What Is EST?</text>
    <text x="0" y="165" font-family="'Space Grotesk', system-ui, sans-serif" font-size="52" font-weight="bold" fill="url(#accentGrad)">Eastern Standard Time Explained</text>
    
    <text x="0" y="230" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="500" fill="#bdd2dc">
      Complete guide to UTC-5, EST vs EDT distinctions, U.S. &amp; Canadian boundaries,
    </text>
    <text x="0" y="265" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="500" fill="#8cb1c4">
      railroad history, Wall Street market schedules, and global time conversions.
    </text>
  </g>

  <!-- Right Side Visual Clock Badge -->
  <g transform="translate(850, 310)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="120" fill="url(#cardGrad)" stroke="#36c7b5" stroke-width="3.5" />
    <circle cx="0" cy="0" r="105" fill="none" stroke="#256e91" stroke-width="1.5" stroke-dasharray="4 8" />
    <text x="0" y="-30" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="bold" fill="#36c7b5" text-anchor="middle">EST</text>
    <text x="0" y="15" font-family="'Space Grotesk', system-ui, sans-serif" font-size="42" font-weight="bold" fill="#f4fbff" text-anchor="middle">UTC-5</text>
    <text x="0" y="50" font-family="'Manrope', system-ui, sans-serif" font-size="16" font-weight="600" fill="#8fd7ff" text-anchor="middle">75°W Meridian</text>
  </g>
</svg>
