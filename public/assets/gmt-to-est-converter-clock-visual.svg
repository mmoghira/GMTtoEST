<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
  <title id="title">GMT and Eastern Time clock comparison</title>
  <desc id="desc">Two generated analog clocks comparing Greenwich Mean Time with Eastern Time.</desc>
  <rect width="900" height="380" rx="0" fill="#f6f8fb"/>
  <g transform="translate(230 190)">
    <circle r="118" fill="#ffffff" stroke="#1f2937" stroke-width="10"/>
    <g stroke="#64748b" stroke-width="5">
      <path d="M0-100v24M100 0H76M0 100V76M-100 0h24"/>
    </g>
    <path d="M0 0L0-72" stroke="#111827" stroke-width="9" stroke-linecap="round"/>
    <path d="M0 0L56 0" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
    <circle r="9" fill="#111827"/>
    <text y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">GMT</text>
  </g>
  <g transform="translate(670 190)">
    <circle r="118" fill="#ffffff" stroke="#0f766e" stroke-width="10"/>
    <g stroke="#64748b" stroke-width="5">
      <path d="M0-100v24M100 0H76M0 100V76M-100 0h24"/>
    </g>
    <path d="M0 0L-38-62" stroke="#111827" stroke-width="9" stroke-linecap="round"/>
    <path d="M0 0L56 0" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
    <circle r="9" fill="#111827"/>
    <text y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">EST / EDT</text>
  </g>
  <path d="M400 184h100" stroke="#1d4ed8" stroke-width="10" stroke-linecap="round"/>
  <path d="M485 155l35 35-35 35" fill="none" stroke="#1d4ed8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
