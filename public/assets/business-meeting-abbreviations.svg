
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="40" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#10b981" text-anchor="middle">Global Team Meeting Coordinator Matrix</text>
  
  <g transform="translate(100, 90)">
    <!-- PDT Column -->
    <rect x="20" y="20" width="160" height="200" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
    <text x="100" y="55" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold" fill="#ef4444" text-anchor="middle">PDT (West US)</text>
    <text x="100" y="90" font-family="'Manrope', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Standard Offset: UTC-7</text>
    <rect x="40" y="110" width="120" height="40" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="100" y="135" font-family="monospace" font-size="12" fill="#ef4444" font-weight="bold" text-anchor="middle">09:00 AM</text>
    <text x="100" y="180" font-family="'Manrope', sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Day Start</text>
    
    <!-- EDT Column -->
    <rect x="210" y="20" width="160" height="200" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="290" y="55" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">EDT (East US)</text>
    <text x="290" y="90" font-family="'Manrope', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Standard Offset: UTC-4</text>
    <rect x="230" y="110" width="120" height="40" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="290" y="135" font-family="monospace" font-size="12" fill="#38bdf8" font-weight="bold" text-anchor="middle">12:00 PM</text>
    <text x="290" y="180" font-family="'Manrope', sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Noon Overlap</text>

    <!-- BST Column -->
    <rect x="400" y="20" width="160" height="200" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="480" y="55" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold" fill="#10b981" text-anchor="middle">BST (London)</text>
    <text x="480" y="90" font-family="'Manrope', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Standard Offset: UTC+1</text>
    <rect x="420" y="110" width="120" height="40" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="480" y="135" font-family="monospace" font-size="12" fill="#10b981" font-weight="bold" text-anchor="middle">05:00 PM</text>
    <text x="480" y="180" font-family="'Manrope', sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Late Afternoon</text>
  </g>
</svg>
