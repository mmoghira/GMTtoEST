<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26" />
      <stop offset="100%" stop-color="#0f3c52" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0c354a" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <g transform="translate(0, 70)" text-anchor="middle">
    <text x="600" y="40" font-family="'Space Grotesk', system-ui, sans-serif" font-size="40" font-weight="bold" fill="#f4fbff">GMT vs PKT Time Zone Comparison</text>
    <text x="600" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="22" fill="#bdd2dc">Side-by-Side Architectural &amp; Operational Feature Comparison</text>
  </g>

  <!-- Left Card: GMT -->
  <g transform="translate(130, 200)">
    <rect width="440" height="440" rx="16" fill="url(#cardGrad)" stroke="#36c7b5" stroke-width="3" />
    <rect x="30" y="30" width="140" height="32" rx="16" fill="#36c7b5" />
    <text x="100" y="52" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="bold" fill="#071b26" text-anchor="middle">REFERENCE BASELINE</text>
    
    <text x="30" y="110" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="bold" fill="#f4fbff">GMT (UTC+0)</text>
    <text x="30" y="145" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="600" fill="#8fd7ff">Greenwich Mean Time</text>
    
    <line x1="30" y1="175" x2="410" y2="175" stroke="#256e91" stroke-width="2" />
    
    <text x="30" y="215" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• <tspan font-weight="bold">Longitudinal Anchor:</tspan> 0° Prime Meridian</text>
    <text x="30" y="255" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• <tspan font-weight="bold">UTC Difference:</tspan> 0 hours (Baseline)</text>
    <text x="30" y="295" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• <tspan font-weight="bold">Relative Status:</tspan> 5 hours behind PKT</text>
    <text x="30" y="335" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• <tspan font-weight="bold">DST Behavior:</tspan> Static UTC+0 reference</text>
    <text x="30" y="375" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• <tspan font-weight="bold">Global Role:</tspan> Universal time reference point</text>
  </g>

  <!-- Right Card: PKT -->
  <g transform="translate(630, 200)">
    <rect width="440" height="440" rx="16" fill="url(#cardGrad)" stroke="#8fd7ff" stroke-width="3" />
    <rect x="30" y="30" width="160" height="32" rx="16" fill="#8fd7ff" />
    <text x="110" y="52" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="bold" fill="#071b26" text-anchor="middle">PAKISTAN STANDARD</text>
    
    <text x="30" y="110" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="bold" fill="#f4fbff">PKT (UTC+5)</text>
    <text x="30" y="145" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="600" fill="#8fd7ff">Pakistan Standard Time</text>
    
    <line x1="30" y1="175" x2="410" y2="175" stroke="#256e91" stroke-width="2" />
    
    <text x="30" y="215" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• <tspan font-weight="bold">Longitudinal Anchor:</tspan> 75° East Meridian</text>
    <text x="30" y="255" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• <tspan font-weight="bold">UTC Difference:</tspan> +5 hours ahead</text>
    <text x="30" y="295" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• <tspan font-weight="bold">Relative Status:</tspan> 5 hours ahead of GMT</text>
    <text x="30" y="335" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• <tspan font-weight="bold">DST Behavior:</tspan> Permanent year-round UTC+5</text>
    <text x="30" y="375" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• <tspan font-weight="bold">Global Role:</tspan> Regional standard for Pakistan</text>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(200, 680)">
    <rect width="800" height="55" rx="12" fill="#12455d" stroke="#2f6278" stroke-width="1.5" />
    <text x="400" y="35" font-family="'Manrope', system-ui, sans-serif" font-size="18" font-weight="bold" fill="#f4fbff" text-anchor="middle">
      Converting GMT to PKT requires adding 5 hours consistently throughout the year.
    </text>
  </g>
</svg>
