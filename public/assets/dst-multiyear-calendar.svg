<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="auto" style="display: block; margin: 0 auto;">
        <rect width="800" height="260" fill="#0f172a" rx="10" />
        <text x="400" y="30" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="16" fill="#8fd7ff" text-anchor="middle">5-Year Transition Window Progression (2026 - 2030)</text>
        
        <!-- Year Rows -->
        <g transform="translate(60, 60)" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#cbd5e1">
          <text x="0" y="20">2026:</text>
          <text x="0" y="55">2027:</text>
          <text x="0" y="90">2028 (Leap):</text>
          <text x="0" y="125">2029:</text>
          <text x="0" y="160">2030:</text>
        </g>

        <!-- US Bars -->
        <g transform="translate(180, 60)">
          <rect x="0" y="5" width="220" height="20" fill="#38bdf8" fill-opacity="0.6" rx="4" />
          <text x="110" y="19" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">US: Mar 8 - Nov 1</text>
          
          <rect x="0" y="40" width="220" height="20" fill="#38bdf8" fill-opacity="0.6" rx="4" />
          <text x="110" y="54" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">US: Mar 14 - Nov 7</text>

          <rect x="0" y="75" width="220" height="20" fill="#38bdf8" fill-opacity="0.6" rx="4" />
          <text x="110" y="89" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">US: Mar 12 - Nov 5</text>

          <rect x="0" y="110" width="220" height="20" fill="#38bdf8" fill-opacity="0.6" rx="4" />
          <text x="110" y="124" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">US: Mar 11 - Nov 4</text>

          <rect x="0" y="145" width="220" height="20" fill="#38bdf8" fill-opacity="0.6" rx="4" />
          <text x="110" y="159" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">US: Mar 10 - Nov 3</text>
        </g>

        <!-- EU Bars -->
        <g transform="translate(460, 60)">
          <rect x="0" y="5" width="240" height="20" fill="#36c7b5" fill-opacity="0.6" rx="4" />
          <text x="120" y="19" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">EU: Mar 29 - Oct 25</text>

          <rect x="0" y="40" width="240" height="20" fill="#36c7b5" fill-opacity="0.6" rx="4" />
          <text x="120" y="54" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">EU: Mar 28 - Oct 31</text>

          <rect x="0" y="75" width="240" height="20" fill="#36c7b5" fill-opacity="0.6" rx="4" />
          <text x="120" y="89" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">EU: Mar 26 - Oct 29</text>

          <rect x="0" y="110" width="240" height="20" fill="#36c7b5" fill-opacity="0.6" rx="4" />
          <text x="120" y="124" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">EU: Mar 25 - Oct 28</text>

          <rect x="0" y="145" width="240" height="20" fill="#36c7b5" fill-opacity="0.6" rx="4" />
          <text x="120" y="159" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">EU: Mar 31 - Oct 27</text>
