<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">World Cup 2026 EDT to GMT kickoff slots</title>
  <desc id="desc">A visual timezone chart showing common FIFA World Cup 2026 kickoff slots converted from EDT to GMT, BST, PKT, IST and AEST.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07141f"/>
      <stop offset="0.58" stop-color="#102233"/>
      <stop offset="1" stop-color="#f4efe4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#00111b" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="34" fill="url(#bg)"/>
  <g opacity="0.16" fill="none" stroke="#ffffff" stroke-width="2">
    <path d="M140 560c80-145 184-244 312-297 143-59 287-45 421-121 66-38 118-83 157-136"/>
    <path d="M118 176h944M118 292h944M118 408h944M118 524h944"/>
    <path d="M232 130v480M414 130v480M596 130v480M778 130v480M960 130v480"/>
  </g>
  <g transform="translate(82 78)">
    <text x="0" y="0" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800">World Cup 2026 kickoff times</text>
    <text x="0" y="42" fill="#c8d8e7" font-family="Arial, Helvetica, sans-serif" font-size="22">EDT to GMT, BST, PKT, IST and AEST planning chart</text>
  </g>
  <g transform="translate(82 164)" filter="url(#shadow)">
    <rect width="1036" height="420" rx="28" fill="#ffffff" opacity="0.96"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="34" y="58" fill="#0f172a" font-size="22" font-weight="800">Official Eastern Time slot</text>
      <text x="322" y="58" fill="#0f172a" font-size="22" font-weight="800">GMT</text>
      <text x="462" y="58" fill="#0f172a" font-size="22" font-weight="800">BST</text>
      <text x="612" y="58" fill="#0f172a" font-size="22" font-weight="800">PKT</text>
      <text x="762" y="58" fill="#0f172a" font-size="22" font-weight="800">IST</text>
      <text x="902" y="58" fill="#0f172a" font-size="22" font-weight="800">AEST</text>
      <rect x="34" y="84" width="968" height="3" fill="url(#accent)"/>
      <g font-size="26" font-weight="700" fill="#162033">
        <text x="34" y="138">12:00 PM EDT</text><text x="322" y="138">16:00</text><text x="462" y="138">17:00</text><text x="612" y="138">21:00</text><text x="762" y="138">21:30</text><text x="902" y="138">02:00 +1</text>
        <text x="34" y="218">3:00 PM EDT</text><text x="322" y="218">19:00</text><text x="462" y="218">20:00</text><text x="612" y="218">00:00 +1</text><text x="762" y="218">00:30 +1</text><text x="902" y="218">05:00 +1</text>
        <text x="34" y="298">6:00 PM EDT</text><text x="322" y="298">22:00</text><text x="462" y="298">23:00</text><text x="612" y="298">03:00 +1</text><text x="762" y="298">03:30 +1</text><text x="902" y="298">08:00 +1</text>
        <text x="34" y="378">9:00 PM EDT</text><text x="322" y="378">01:00 +1</text><text x="462" y="378">02:00 +1</text><text x="612" y="378">06:00 +1</text><text x="762" y="378">06:30 +1</text><text x="902" y="378">11:00 +1</text>
      </g>
      <g fill="#dbe5ee">
        <rect x="34" y="164" width="968" height="1"/><rect x="34" y="244" width="968" height="1"/><rect x="34" y="324" width="968" height="1"/>
      </g>
    </g>
  </g>
  <g transform="translate(82 634)" font-family="Arial, Helvetica, sans-serif">
    <circle cx="16" cy="-6" r="10" fill="#2dd4bf"/>
    <text x="36" y="0" fill="#eef6ff" font-size="22">+1 means the match starts on the next calendar day in that timezone.</text>
  </g>
</svg>
