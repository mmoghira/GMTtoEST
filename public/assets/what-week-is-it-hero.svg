<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06151f"/>
      <stop offset="50%" stop-color="#0c354a"/>
      <stop offset="100%" stop-color="#12455d"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(18, 69, 93, 0.95)"/>
      <stop offset="100%" stop-color="rgba(12, 53, 74, 0.95)"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#36c7b5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06151f" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#heroBg)"/>
  <circle cx="480" cy="270" r="420" fill="url(#sunGlow)"/>

  <!-- Background Grid Accent -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="60" y1="90" x2="900" y2="90"/>
    <line x1="60" y1="180" x2="900" y2="180"/>
    <line x1="60" y1="270" x2="900" y2="270"/>
    <line x1="60" y1="360" x2="900" y2="360"/>
    <line x1="60" y1="450" x2="900" y2="450"/>
  </g>

  <!-- Header Badge & Title -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="230" height="28" rx="14" fill="rgba(54, 199, 181, 0.15)" stroke="#36c7b5" stroke-width="1.5"/>
    <text x="16" y="19" fill="#36c7b5" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">ISO 8601 STANDARD WEEKS</text>
    
    <text x="0" y="66" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="32" font-weight="800">What Week Is It?</text>
    <text x="0" y="94" fill="#bdd2dc" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="16" font-weight="600">Monday-to-Sunday ISO Week Calendar &amp; Numbering</text>
  </g>

  <!-- Calendar Container Card -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="840" height="330" rx="16" fill="url(#cardBg)" stroke="#1e5f80" stroke-width="2"/>

    <!-- Table Header Bar -->
    <path d="M 0,16 Q 0,0 16,0 L 824,0 Q 840,0 840,16 L 840,46 L 0,46 Z" fill="#082030"/>
    <text x="35" y="30" fill="#36c7b5" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" letter-spacing="1">WEEK</text>
    <text x="140" y="30" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800">MON (1)</text>
    <text x="245" y="30" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800">TUE (2)</text>
    <text x="350" y="30" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800">WED (3)</text>
    <text x="455" y="30" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800">THU (4)*</text>
    <text x="560" y="30" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800">FRI (5)</text>
    <text x="665" y="30" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800">SAT (6)</text>
    <text x="760" y="30" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800">SUN (7)</text>

    <!-- Row 1: Week 38 (Prior Week) -->
    <g transform="translate(0, 46)">
      <rect x="0" y="0" width="840" height="56" fill="transparent"/>
      <rect x="24" y="14" width="60" height="28" rx="6" fill="rgba(255,255,255,0.06)"/>
      <text x="54" y="33" fill="#94a3b8" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700" text-anchor="middle">W38</text>
      
      <text x="158" y="34" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="16">14</text>
      <text x="263" y="34" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="16">15</text>
      <text x="368" y="34" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="16">16</text>
      <text x="473" y="34" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="16">17</text>
      <text x="578" y="34" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="16">18</text>
      <text x="683" y="34" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="16">19</text>
      <text x="778" y="34" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="16">20</text>
    </g>

    <!-- Row 2: Week 39 (HIGHLIGHTED ACTIVE WEEK) -->
    <g transform="translate(0, 102)">
      <rect x="6" y="2" width="828" height="74" rx="10" fill="rgba(54, 199, 181, 0.12)" stroke="#36c7b5" stroke-width="2"/>
      
      <!-- Week badge -->
      <rect x="22" y="18" width="64" height="42" rx="8" fill="#36c7b5"/>
      <text x="54" y="44" fill="#06151f" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="900" text-anchor="middle">W39</text>

      <!-- Mon 21 (Week Start) -->
      <g transform="translate(130, 10)">
        <rect x="0" y="0" width="68" height="58" rx="6" fill="#082030" stroke="#1e5f80" stroke-width="1"/>
        <text x="34" y="28" fill="#36c7b5" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800" text-anchor="middle">21</text>
        <text x="34" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">START</text>
      </g>

      <!-- Tue 22 (Selected Date) -->
      <g transform="translate(235, 10)">
        <rect x="0" y="0" width="68" height="58" rx="6" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
        <text x="34" y="28" fill="#06151f" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="900" text-anchor="middle">22</text>
        <text x="34" y="46" fill="#06151f" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">SELECTED</text>
      </g>

      <!-- Wed 23 -->
      <g transform="translate(340, 10)">
        <rect x="0" y="0" width="68" height="58" rx="6" fill="#082030" stroke="#1e5f80" stroke-width="1"/>
        <text x="34" y="36" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800" text-anchor="middle">23</text>
      </g>

      <!-- Thu 24 (Determining Thursday) -->
      <g transform="translate(445, 10)">
        <rect x="0" y="0" width="68" height="58" rx="6" fill="#082030" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="34" y="28" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800" text-anchor="middle">24</text>
        <text x="34" y="46" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">THU RULE</text>
      </g>

      <!-- Fri 25 -->
      <g transform="translate(550, 10)">
        <rect x="0" y="0" width="68" height="58" rx="6" fill="#082030" stroke="#1e5f80" stroke-width="1"/>
        <text x="34" y="36" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800" text-anchor="middle">25</text>
      </g>

      <!-- Sat 26 -->
      <g transform="translate(655, 10)">
        <rect x="0" y="0" width="68" height="58" rx="6" fill="#082030" stroke="#1e5f80" stroke-width="1"/>
        <text x="34" y="36" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800" text-anchor="middle">26</text>
      </g>

      <!-- Sun 27 (Week End) -->
      <g transform="translate(750, 10)">
        <rect x="0" y="0" width="68" height="58" rx="6" fill="#082030" stroke="#ef4444" stroke-width="1.5"/>
        <text x="34" y="28" fill="#f87171" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800" text-anchor="middle">27</text>
        <text x="34" y="46" fill="#f87171" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">END</text>
      </g>
    </g>

    <!-- Row 3: Week 40 (Next Week) -->
    <g transform="translate(0, 184)">
      <rect x="0" y="0" width="840" height="56" fill="transparent"/>
      <rect x="24" y="14" width="60" height="28" rx="6" fill="rgba(255,255,255,0.06)"/>
      <text x="54" y="33" fill="#94a3b8" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700" text-anchor="middle">W40</text>
      
      <text x="158" y="34" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="16">28</text>
      <text x="263" y="34" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="16">29</text>
      <text x="368" y="34" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="16">30</text>
      <text x="473" y="34" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="16">1</text>
      <text x="578" y="34" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="16">2</text>
      <text x="683" y="34" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="16">3</text>
      <text x="778" y="34" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="16">4</text>
    </g>

    <!-- Bottom Explanatory Strip -->
    <g transform="translate(24, 256)">
      <rect x="0" y="0" width="792" height="50" rx="8" fill="#082030"/>
      <circle cx="24" cy="25" r="7" fill="#36c7b5"/>
      <text x="42" y="29" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">ISO 8601 Rule:</text>
      <text x="140" y="29" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="13">Weeks strictly start on Monday and end on Sunday. The week containing the first Thursday is Week 1.</text>
    </g>
  </g>
</svg>