<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26" />
      <stop offset="100%" stop-color="#0f3c52" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0c354a" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <g transform="translate(0, 70)" text-anchor="middle">
    <text x="600" y="40" font-family="'Space Grotesk', system-ui, sans-serif" font-size="40" font-weight="bold" fill="#f4fbff">NST vs NDT Seasonal Comparison</text>
    <text x="600" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="22" fill="#bdd2dc">Newfoundland Standard Time (NST) vs Newfoundland Daylight Time (NDT)</text>
  </g>

  <!-- Left Card: NST -->
  <g transform="translate(130, 200)">
    <rect width="440" height="440" rx="16" fill="url(#cardGrad)" stroke="#36c7b5" stroke-width="3" />
    <rect x="30" y="30" width="150" height="32" rx="16" fill="#36c7b5" />
    <text x="105" y="52" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="bold" fill="#071b26" text-anchor="middle">WINTER STANDARD</text>
    
    <text x="30" y="110" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="bold" fill="#f4fbff">NST (UTC−3:30)</text>
    <text x="30" y="145" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="600" fill="#8fd7ff">Newfoundland Standard Time</text>
    
    <line x1="30" y1="175" x2="410" y2="175" stroke="#256e91" stroke-width="2" />
    
    <text x="30" y="215" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• <tspan font-weight="bold">UTC Offset:</tspan> UTC−3:30</text>
    <text x="30" y="255" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• <tspan font-weight="bold">GMT Difference:</tspan> 3h 30m behind GMT</text>
    <text x="30" y="295" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• <tspan font-weight="bold">Season:</tspan> November to March (Winter)</text>
    <text x="30" y="335" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• <tspan font-weight="bold">Example:</tspan> 12:00 GMT = 08:30 NST</text>
    <text x="30" y="375" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• <tspan font-weight="bold">Status:</tspan> Standard winter baseline</text>
  </g>

  <!-- Right Card: NDT -->
  <g transform="translate(630, 200)">
    <rect width="440" height="440" rx="16" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="3" />
    <rect x="30" y="30" width="160" height="32" rx="16" fill="#fbbf24" />
    <text x="110" y="52" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="bold" fill="#071b26" text-anchor="middle">SUMMER DAYLIGHT</text>
    
    <text x="30" y="110" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="bold" fill="#f4fbff">NDT (UTC−2:30)</text>
    <text x="30" y="145" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="600" fill="#fbbf24">Newfoundland Daylight Time</text>
    
    <line x1="30" y1="175" x2="410" y2="175" stroke="#256e91" stroke-width="2" />
    
    <text x="30" y="215" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• <tspan font-weight="bold">UTC Offset:</tspan> UTC−2:30</text>
    <text x="30" y="255" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• <tspan font-weight="bold">GMT Difference:</tspan> 2h 30m behind GMT</text>
    <text x="30" y="295" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• <tspan font-weight="bold">Season:</tspan> March to November (Summer)</text>
    <text x="30" y="335" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• <tspan font-weight="bold">Example:</tspan> 12:00 GMT = 09:30 NDT</text>
    <text x="30" y="375" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• <tspan font-weight="bold">Shift:</tspan> Clocks advance +1 hour (+60m)</text>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(200, 680)">
    <rect width="800" height="55" rx="12" fill="#12455d" stroke="#2f6278" stroke-width="1.5" />
    <text x="400" y="35" font-family="'Manrope', system-ui, sans-serif" font-size="18" font-weight="bold" fill="#f4fbff" text-anchor="middle">
      Standard Time is NST (UTC−3:30). Daylight Saving Time is NDT (UTC−2:30).
    </text>
  </g>
</svg>
