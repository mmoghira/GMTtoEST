<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26" />
      <stop offset="100%" stop-color="#0f3c52" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0c354a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36c7b5" />
      <stop offset="100%" stop-color="#8fd7ff" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <g transform="translate(0, 60)" text-anchor="middle">
    <text x="600" y="40" font-family="'Space Grotesk', system-ui, sans-serif" font-size="36" font-weight="bold" fill="#f4fbff">Eastern Time Offsets vs SAST (UTC+2)</text>
    <text x="600" y="75" font-family="'Manrope', system-ui, sans-serif" font-size="20" fill="#bdd2dc">Standard Time (EST) vs Daylight Saving Time (EDT) Comparison</text>
  </g>

  <!-- Left Card: EST -->
  <g transform="translate(150, 180)">
    <rect width="420" height="360" rx="16" fill="url(#cardGrad)" stroke="#36c7b5" stroke-width="3" />
    <rect x="30" y="30" width="120" height="32" rx="16" fill="#36c7b5" />
    <text x="90" y="52" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="bold" fill="#071b26" text-anchor="middle">STANDARD TIME</text>
    
    <text x="30" y="110" font-family="'Space Grotesk', system-ui, sans-serif" font-size="42" font-weight="bold" fill="#f4fbff">EST (UTC-5)</text>
    <text x="30" y="150" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="600" fill="#8fd7ff">Eastern Standard Time</text>
    
    <line x1="30" y1="180" x2="390" y2="180" stroke="#256e91" stroke-width="2" />
    
    <text x="30" y="220" font-family="'Manrope', system-ui, sans-serif" font-size="22" font-weight="bold" fill="#f4fbff">Difference from SAST:</text>
    <text x="30" y="260" font-family="'Space Grotesk', system-ui, sans-serif" font-size="36" font-weight="bold" fill="#36c7b5">-7 Hours</text>
    <text x="30" y="300" font-family="'Manrope', system-ui, sans-serif" font-size="16" fill="#bdd2dc">Observed: Mid-November to Mid-March</text>
    <text x="30" y="325" font-family="'Manrope', system-ui, sans-serif" font-size="16" fill="#bdd2dc">Example: 15:00 SAST = 08:00 EST</text>
  </g>

  <!-- Right Card: EDT -->
  <g transform="translate(630, 180)">
    <rect width="420" height="360" rx="16" fill="url(#cardGrad)" stroke="#8fd7ff" stroke-width="2" />
    <rect x="30" y="30" width="140" height="32" rx="16" fill="#fbbf24" />
    <text x="100" y="52" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="bold" fill="#071b26" text-anchor="middle">DAYLIGHT SAVING</text>
    
    <text x="30" y="110" font-family="'Space Grotesk', system-ui, sans-serif" font-size="42" font-weight="bold" fill="#f4fbff">EDT (UTC-4)</text>
    <text x="30" y="150" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="600" fill="#8fd7ff">Eastern Daylight Time</text>
    
    <line x1="30" y1="180" x2="390" y2="180" stroke="#256e91" stroke-width="2" />
    
    <text x="30" y="220" font-family="'Manrope', system-ui, sans-serif" font-size="22" font-weight="bold" fill="#f4fbff">Difference from SAST:</text>
    <text x="30" y="260" font-family="'Space Grotesk', system-ui, sans-serif" font-size="36" font-weight="bold" fill="#fbbf24">-6 Hours</text>
    <text x="30" y="300" font-family="'Manrope', system-ui, sans-serif" font-size="16" fill="#bdd2dc">Observed: Mid-March to Mid-November</text>
    <text x="30" y="325" font-family="'Manrope', system-ui, sans-serif" font-size="16" fill="#bdd2dc">Example: 15:00 SAST = 09:00 EDT</text>
  </g>
</svg>
