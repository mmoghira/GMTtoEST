<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Map bridge from South Korea to Eastern North America</title>
  <desc id="desc">A vector world map highlighting South Korea and the Eastern Time region with offset cards for KST, EST, and EDT.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b2234"/>
      <stop offset="0.55" stop-color="#113f54"/>
      <stop offset="1" stop-color="#0a302e"/>
    </linearGradient>
    <linearGradient id="path" x1="0" x2="1">
      <stop offset="0" stop-color="#36c7b5"/>
      <stop offset="1" stop-color="#f7bd5a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <g opacity="0.18" fill="#dff8ff">
    <path d="M170 240 C230 180 320 178 380 225 C430 264 424 318 370 342 C306 371 217 348 168 294 C148 272 149 255 170 240 Z"/>
    <path d="M438 212 C505 176 598 188 635 242 C671 294 645 346 578 366 C512 386 428 354 405 300 C390 264 404 231 438 212 Z"/>
    <path d="M705 254 C765 203 848 204 898 250 C944 293 932 360 873 394 C820 425 734 403 695 346 C673 312 677 279 705 254 Z"/>
