    <path d="M318 410 C389 380 487 394 523 454 C556 508 511 565 428 570 C356 574 289 530 285 474 C283 445 294 421 318 410 Z"/>
    <path d="M728 440 C796 407 890 418 930 472 C972 529 915 588 827 582 C758 578 707 532 708 485 C709 465 716 450 728 440 Z"/>
  </g>
  <g fill="none" stroke="#87d8e9" stroke-width="1" opacity="0.17">
    <path d="M80 180 H1120"/>
    <path d="M80 270 H1120"/>
    <path d="M80 360 H1120"/>
    <path d="M80 450 H1120"/>
    <path d="M80 540 H1120"/>
    <path d="M230 120 V610"/>
    <path d="M420 120 V610"/>
    <path d="M610 120 V610"/>
    <path d="M800 120 V610"/>
    <path d="M990 120 V610"/>
  </g>
  <path d="M915 318 C796 220 650 197 508 254 C394 300 314 376 229 414" fill="none" stroke="url(#path)" stroke-width="8" stroke-linecap="round"/>
  <path d="M915 318 C796 220 650 197 508 254 C394 300 314 376 229 414" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 16" stroke-linecap="round" opacity="0.78"/>
  <g transform="translate(862 264)">
    <circle cx="52" cy="52" r="44" fill="#36c7b5" opacity="0.28"/>
    <circle cx="52" cy="52" r="18" fill="#36c7b5"/>
    <text x="-8" y="124" fill="#ffffff" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="800">South Korea</text>
    <text x="13" y="154" fill="#8fd7ff" font-family="Manrope, Arial, sans-serif" font-size="18">Asia/Seoul</text>
  </g>
  <g transform="translate(164 360)">
    <circle cx="64" cy="54" r="48" fill="#f7bd5a" opacity="0.26"/>
    <circle cx="64" cy="54" r="19" fill="#f7bd5a"/>
    <text x="-26" y="128" fill="#ffffff" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="800">Eastern North America</text>
    <text x="4" y="158" fill="#ffd996" font-family="Manrope, Arial, sans-serif" font-size="18">America/New_York</text>
  </g>
  <g transform="translate(86 92)">
    <rect width="250" height="116" rx="8" fill="#07131f" opacity="0.86" stroke="#f7bd5a"/>
    <text x="22" y="35" fill="#ffd996" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800">Eastern Time</text>
    <text x="22" y="70" fill="#ffffff" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="700">UTC-5 / UTC-4</text>
    <text x="22" y="96" fill="#bdd2dc" font-family="Manrope, Arial, sans-serif" font-size="16">DST decides the active offset</text>
  </g>
  <g transform="translate(864 92)">
    <rect width="250" height="116" rx="8" fill="#07131f" opacity="0.86" stroke="#36c7b5"/>
    <text x="22" y="35" fill="#8ff5e6" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800">Korea Standard Time</text>
    <text x="22" y="70" fill="#ffffff" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="700">UTC+9</text>
    <text x="22" y="96" fill="#bdd2dc" font-family="Manrope, Arial, sans-serif" font-size="16">One national civil time</text>
  </g>
  <g transform="translate(455 515)">
    <rect width="290" height="86" rx="8" fill="#10344a" stroke="#3dd8c5"/>
    <text x="22" y="34" fill="#ffffff" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800">Calendar date can move</text>
    <text x="22" y="62" fill="#bdd2dc" font-family="Manrope, Arial, sans-serif" font-size="17">A Seoul morning is often the previous U.S. evening.</text>
  </g>
