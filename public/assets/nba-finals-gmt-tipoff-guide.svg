<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">2026 NBA Finals GMT tip-off guide</title>
  <desc id="desc">A basketball court inspired timezone guide showing an 8:30 PM Eastern tip-off converting to 00:30 GMT the next day.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eefaf7"/>
      <stop offset="0.48" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eaf2ff"/>
    </linearGradient>
    <linearGradient id="court" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5c47a"/>
      <stop offset="1" stop-color="#df8f3c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect x="58" y="54" width="1084" height="522" rx="8" fill="#ffffff" stroke="#d9e2ec"/>

  <g filter="url(#shadow)">
    <rect x="82" y="170" width="1036" height="350" rx="8" fill="url(#court)"/>
    <path d="M82 345h1036M600 170v350" stroke="#ffffff" stroke-width="8" opacity="0.72"/>
    <circle cx="600" cy="345" r="82" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.72"/>
    <path d="M82 255h150v180H82M1118 255H968v180h150" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.72"/>
    <path d="M232 285a88 88 0 0 1 0 120M968 285a88 88 0 0 0 0 120" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.72"/>
  </g>

  <g transform="translate(96 86)">
    <text x="0" y="0" fill="#0f766e" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800">GMT TO EST CONVERTER</text>
    <text x="0" y="64" fill="#12202f" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="900">2026 NBA Finals</text>
    <text x="0" y="118" fill="#12202f" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="850">GMT Tip-Off Guide</text>
  </g>

  <g transform="translate(146 282)">
    <rect x="0" y="0" width="314" height="154" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
    <text x="28" y="44" fill="#5d6978" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">EASTERN TIME</text>
    <text x="28" y="103" fill="#12202f" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="900">8:30 PM</text>
    <text x="28" y="132" fill="#0f766e" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">EDT, UTC-4</text>
  </g>

  <g transform="translate(514 282)">
    <rect x="0" y="57" width="172" height="40" rx="8" fill="#0f766e"/>
    <path d="M122 23l70 54-70 54V97H0V57h122z" fill="#0f766e"/>
    <text x="26" y="84" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="900">ADD 4 HRS</text>
  </g>

  <g transform="translate(740 282)">
    <rect x="0" y="0" width="314" height="154" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
    <text x="28" y="44" fill="#5d6978" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">GREENWICH TIME</text>
    <text x="28" y="103" fill="#12202f" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="900">00:30</text>
    <text x="28" y="132" fill="#1d4ed8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">GMT, NEXT DAY</text>
  </g>

  <g transform="translate(884 83)">
    <circle cx="88" cy="88" r="72" fill="#c96a24" stroke="#8a3f14" stroke-width="6"/>
    <path d="M88 16c-18 28-18 116 0 144M88 16c18 28 18 116 0 144M18 88h140M38 39c34 24 66 24 100 0M38 137c34-24 66-24 100 0" fill="none" stroke="#8a3f14" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g transform="translate(142 542)">
    <rect x="0" y="0" width="916" height="44" rx="8" fill="#12202f"/>
    <text x="24" y="29" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">June games use EDT, not EST: GMT is 4 hours ahead of Eastern Time.</text>
  </g>
</svg>
