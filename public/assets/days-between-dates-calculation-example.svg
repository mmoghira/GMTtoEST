<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="exBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081e2b" />
      <stop offset="100%" stop-color="#0d3448" />
    </linearGradient>
    <linearGradient id="exCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0f3c52" />
    </linearGradient>
    <filter id="exShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#exBgGrad)" />

  <!-- Header -->
  <g transform="translate(400, 44)" text-anchor="middle">
    <text x="0" y="0" font-family="'Space Grotesk', system-ui, sans-serif" font-size="24" font-weight="800" fill="#f4fbff">How Days Are Counted: 22 Sep 2026 to 27 Nov 2026</text>
    <text x="0" y="26" font-family="'Manrope', system-ui, sans-serif" font-size="14" fill="#bdd2dc">Visualizing Exclusive vs. Inclusive Date Math</text>
  </g>

  <!-- Two comparison lanes -->
  <!-- Lane 1: Exclusive (Default) -->
  <g transform="translate(60, 105)">
    <rect width="680" height="135" rx="12" fill="url(#exCardGrad)" stroke="#2f6278" stroke-width="1.5" filter="url(#exShadow)" />
    
    <rect x="20" y="16" width="130" height="26" rx="6" fill="#0c354a" />
    <text x="85" y="34" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" fill="#8fd7ff" text-anchor="middle">EXCLUSIVE (DEFAULT)</text>
    <text x="640" y="34" font-family="'Space Grotesk', system-ui, sans-serif" font-size="18" font-weight="800" fill="#36c7b5" text-anchor="end">66 DAYS</text>

    <!-- Timeline visual -->
    <g transform="translate(40, 75)">
      <!-- Line -->
      <line x1="0" y1="0" x2="600" y2="0" stroke="#256e91" stroke-width="4" stroke-linecap="round" />
      <line x1="0" y1="0" x2="570" y2="0" stroke="#36c7b5" stroke-width="4" stroke-linecap="round" />
      
      <!-- Start point (excluded as interval zero) -->
      <circle cx="0" cy="0" r="9" fill="#071b26" stroke="#36c7b5" stroke-width="3" />
      <text x="0" y="-15" font-family="'Manrope', system-ui, sans-serif" font-size="12" font-weight="700" fill="#bdd2dc" text-anchor="middle">22 Sep (Day 0)</text>
      
      <!-- Day 1 -->
      <circle cx="60" cy="0" r="5" fill="#36c7b5" />
      <text x="60" y="18" font-family="'Manrope', system-ui, sans-serif" font-size="10" fill="#bdd2dc" text-anchor="middle">23 Sep (+1)</text>

      <!-- Ellipsis -->
      <text x="300" y="5" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="800" fill="#8fd7ff" text-anchor="middle">• • • 66 elapsed calendar days • • •</text>

      <!-- End point -->
      <circle cx="600" cy="0" r="9" fill="#36c7b5" stroke="#ffffff" stroke-width="2" />
      <text x="600" y="-15" font-family="'Manrope', system-ui, sans-serif" font-size="12" font-weight="700" fill="#36c7b5" text-anchor="middle">27 Nov (Day 66)</text>
    </g>
    
    <text x="40" y="118" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#bdd2dc">Formula: End Date − Start Date = 66 days (counts elapsed 24-hour periods)</text>
  </g>

  <!-- Lane 2: Inclusive -->
  <g transform="translate(60, 260)">
    <rect width="680" height="135" rx="12" fill="url(#exCardGrad)" stroke="#36c7b5" stroke-width="1.5" filter="url(#exShadow)" />
    
    <rect x="20" y="16" width="130" height="26" rx="6" fill="#1b536e" />
    <text x="85" y="34" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">INCLUSIVE (+1 DAY)</text>
    <text x="640" y="34" font-family="'Space Grotesk', system-ui, sans-serif" font-size="18" font-weight="800" fill="#fbbf24" text-anchor="end">67 DAYS</text>

    <!-- Timeline visual -->
    <g transform="translate(40, 75)">
      <!-- Line -->
      <line x1="0" y1="0" x2="600" y2="0" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
      
      <!-- Start point (Included) -->
      <circle cx="0" cy="0" r="9" fill="#fbbf24" stroke="#ffffff" stroke-width="2" />
      <text x="0" y="-15" font-family="'Manrope', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">22 Sep (Day 1)</text>

      <!-- Ellipsis -->
      <text x="300" y="5" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="800" fill="#fbbf24" text-anchor="middle">• • • Both Start Date and End Date Counted • • •</text>

      <!-- End point (Included) -->
      <circle cx="600" cy="0" r="9" fill="#fbbf24" stroke="#ffffff" stroke-width="2" />
      <text x="600" y="-15" font-family="'Manrope', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">27 Nov (Day 67)</text>
    </g>

    <text x="40" y="118" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#bdd2dc">Formula: (End Date − Start Date) + 1 = 67 days (counts every calendar day touched)</text>
  </g>

  <!-- Caption / Note -->
  <text x="400" y="425" font-family="'Manrope', system-ui, sans-serif" font-size="13" font-style="italic" fill="#8fd7ff" text-anchor="middle">
    66 days excluding the end date, 67 days including it.
  </text>
</svg>