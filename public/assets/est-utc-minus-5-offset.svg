<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26" />
      <stop offset="100%" stop-color="#0f3c52" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0c354a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36c7b5" />
      <stop offset="100%" stop-color="#8fd7ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <g transform="translate(0, 70)" text-anchor="middle">
    <text x="600" y="40" font-family="'Space Grotesk', system-ui, sans-serif" font-size="40" font-weight="bold" fill="#f4fbff">EST UTC-5 Hour Offset Calculation</text>
    <text x="600" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="22" fill="#bdd2dc">Subtract 5 Hours from UTC / GMT to Obtain Eastern Standard Time</text>
  </g>

  <!-- Visual Diagram -->
  <g transform="translate(250, 220)" filter="url(#shadow)">
    <rect width="700" height="380" rx="20" fill="url(#cardGrad)" stroke="#36c7b5" stroke-width="3" />
    
    <!-- Top Row: UTC -->
    <g transform="translate(50, 50)">
      <circle cx="45" cy="45" r="30" fill="#1b536e" />
      <circle cx="45" cy="45" r="18" fill="none" stroke="#36c7b5" stroke-width="3" />
      <path d="M45 33 L45 45 L55 45" stroke="#36c7b5" stroke-width="3" fill="none" />
      
      <text x="100" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-size="30" font-weight="bold" fill="#f4fbff">UTC (Coordinated Universal Time)</text>
      <text x="100" y="70" font-family="'Space Grotesk', system-ui, sans-serif" font-size="26" font-weight="bold" fill="#36c7b5">12:00 PM Noon (12:00 UTC)</text>
    </g>

    <!-- Arrow Down -->
    <g transform="translate(400, 150)" text-anchor="middle">
      <path d="M0 0 L0 50" stroke="url(#accentGrad)" stroke-width="6" stroke-dasharray="8 6" />
      <polygon points="-12,45 0,65 12,45" fill="#36c7b5" />
      <rect x="-80" y="12" width="160" height="34" rx="17" fill="#1b536e" stroke="#36c7b5" stroke-width="1.5" />
      <text x="0" y="35" font-family="'Space Grotesk', system-ui, sans-serif" font-size="18" font-weight="bold" fill="#f4fbff">-5 Hours</text>
    </g>

    <!-- Bottom Row: EST -->
    <g transform="translate(50, 240)">
      <circle cx="45" cy="45" r="30" fill="#1b536e" />
      <circle cx="45" cy="45" r="18" fill="none" stroke="#8fd7ff" stroke-width="3" />
      <path d="M45 33 L45 45 L35 45" stroke="#8fd7ff" stroke-width="3" fill="none" />
      
      <text x="100" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-size="30" font-weight="bold" fill="#f4fbff">EST (Eastern Standard Time)</text>
      <text x="100" y="70" font-family="'Space Grotesk', system-ui, sans-serif" font-size="26" font-weight="bold" fill="#8fd7ff">07:00 AM (07:00 EST)</text>
    </g>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(150, 680)" text-anchor="middle">
    <rect x="0" y="0" width="900" height="60" rx="12" fill="#12455d" stroke="#2f6278" stroke-width="1.5" />
    <text x="450" y="38" font-family="'Manrope', system-ui, sans-serif" font-size="19" font-weight="bold" fill="#f4fbff">
      Formula: EST = UTC - 5 Hours (12:00 UTC - 5 Hours = 07:00 AM EST)
    </text>
  </g>
</svg>
