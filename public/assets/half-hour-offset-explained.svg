
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="45" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#f59e0b" text-anchor="middle">The Half-Hour Offset: 82.5° E Longitude</text>
  
  <!-- Timeline mapping whole hours to half hours -->
  <g transform="translate(100, 180)">
    <!-- Main Axis Line -->
    <line x1="0" y1="0" x2="600" y2="0" stroke="#334155" stroke-width="4"/>
    
    <!-- 75° E (UTC+5) Node -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="8" fill="#38bdf8"/>
      <line x1="0" y1="0" x2="0" y2="30" stroke="#38bdf8" stroke-width="2"/>
      <text x="0" y="-15" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="bold">75° E Longitude</text>
      <text x="0" y="50" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">UTC+5:00</text>
    </g>

    <!-- 82.5° E (UTC+5:30) Central Node -->
    <g transform="translate(300, 0)">
      <circle cx="0" cy="0" r="12" fill="#f59e0b" filter="drop-shadow(0 0 8px #f59e0b)"/>
      <line x1="0" y1="0" x2="0" y2="50" stroke="#f59e0b" stroke-width="3"/>
      <text x="0" y="-20" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold">82.5° E Standard Meridian</text>
      <text x="0" y="70" font-family="'Space Grotesk', sans-serif" font-size="18" fill="#f59e0b" text-anchor="middle" font-weight="bold">UTC+5:30 (IST)</text>
    </g>
    
    <!-- 90° E (UTC+6) Node -->
    <g transform="translate(600, 0)">
      <circle cx="0" cy="0" r="8" fill="#38bdf8"/>
      <line x1="0" y1="0" x2="0" y2="30" stroke="#38bdf8" stroke-width="2"/>
      <text x="0" y="-15" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="bold">90° E Longitude</text>
      <text x="0" y="50" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">UTC+6:00</text>
    </g>
  </g>
  
  <text x="400" y="320" font-family="'Manrope', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    By using the central 82.5° E meridian, India splits the difference between the adjacent standard zones, creating a unified time zone.
  </text>
</svg>
