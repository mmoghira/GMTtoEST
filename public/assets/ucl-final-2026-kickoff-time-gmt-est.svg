<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">UEFA Champions League Final 2026 kick-off time guide</title>
  <desc id="desc">A football pitch inspired timezone guide showing PSG vs Arsenal in Budapest at 18:00 CEST, 16:00 GMT and 12:00 PM EDT.</desc>
  <defs>
