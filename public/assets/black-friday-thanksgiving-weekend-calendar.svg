
  <svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="calBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06151f"/>
        <stop offset="100%" stop-color="#0c354a"/>
      </linearGradient>
    </defs>

    <rect width="800" height="450" fill="url(#calBg)"/>

    <text x="40" y="44" fill="#36c7b5" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">COMMERCIAL CALENDAR</text>
    <text x="40" y="74" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800">Thanksgiving Weekend 2026 Shopping Timeline</text>

    <!-- Horizontal Connecting Timeline Line -->
    <line x1="80" y1="210" x2="720" y2="210" stroke="#1e5f80" stroke-width="4"/>

    <!-- Step 1: Thanksgiving -->
    <g transform="translate(100, 140)">
      <circle cx="30" cy="70" r="24" fill="#3b82f6" stroke="#ffffff" stroke-width="3"/>
      <text x="30" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">1</text>
      <text x="30" y="20" fill="#93c5fd" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Thu, Nov 26</text>
      <text x="30" y="115" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Thanksgiving</text>
      <text x="30" y="135" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Family Day</text>
    </g>

    <!-- Step 2: Black Friday (Highlighted) -->
    <g transform="translate(280, 130)">
      <circle cx="30" cy="80" r="30" fill="#fbbf24" stroke="#ffffff" stroke-width="3"/>
      <text x="30" y="86" fill="#0c354a" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">2</text>
      <text x="30" y="20" fill="#fde68a" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="800" text-anchor="middle">Fri, Nov 27</text>
      <text x="30" y="130" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" text-anchor="middle">Black Friday</text>
      <text x="30" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Prime In-Store Deals</text>
    </g>

    <!-- Step 3: Small Business Saturday -->
    <g transform="translate(460, 140)">
      <circle cx="30" cy="70" r="24" fill="#10b981" stroke="#ffffff" stroke-width="3"/>
      <text x="30" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">3</text>
      <text x="30" y="20" fill="#6ee7b7" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Sat, Nov 28</text>
      <text x="30" y="115" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Small Biz Sat</text>
      <text x="30" y="135" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Support Local</text>
    </g>

    <!-- Step 4: Cyber Monday -->
    <g transform="translate(630, 140)">
      <circle cx="30" cy="70" r="24" fill="#a855f7" stroke="#ffffff" stroke-width="3"/>
      <text x="30" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">4</text>
      <text x="30" y="20" fill="#d8b4fe" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Mon, Nov 30</text>
      <text x="30" y="115" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Cyber Monday</text>
      <text x="30" y="135" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Online Blowouts</text>
    </g>

    <!-- Note at bottom -->
    <rect x="40" y="360" width="720" height="56" rx="8" fill="#12455d" stroke="#1e5f80" stroke-width="1"/>
    <text x="60" y="384" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Official Formula:</text>
    <text x="175" y="384" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="13">Thanksgiving is the 4th Thursday in November; Black Friday is the day after.</text>
    <text x="60" y="403" fill="#36c7b5" font-family="system-ui, sans-serif" font-size="12">Earliest possible date: Nov 23 &#160;•&#160; Latest possible date: Nov 29 &#160;•&#160; 2026 Date: November 27</text>
  </svg>
  