
  <svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="diagBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06151f"/>
        <stop offset="100%" stop-color="#0c354a"/>
      </linearGradient>
    </defs>

    <rect width="800" height="450" fill="url(#diagBg)"/>

    <text x="40" y="44" fill="#36c7b5" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">TIME REFERENCE</text>
    <text x="40" y="74" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800">24-Hour vs. 12-Hour Conversion Reference</text>

    <!-- Table Graphic Container -->
    <g transform="translate(40, 105)">
      <rect x="0" y="0" width="720" height="260" rx="10" fill="#082030" stroke="#1e5f80" stroke-width="1.5"/>
      
      <!-- Table Header -->
      <path d="M 0,10 Q 0,0 10,0 L 710,0 Q 720,0 720,10 L 720,40 L 0,40 Z" fill="#12455d"/>
      <text x="30" y="26" fill="#36c7b5" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800">24-HOUR TIME</text>
      <text x="210" y="26" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800">12-HOUR EQUIVALENT</text>
      <text x="440" y="26" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">PERIOD / RULE CLASSIFICATION</text>

      <!-- Row 1: Midnight (Special Case 1) -->
      <g transform="translate(0, 40)">
        <rect x="0" y="0" width="720" height="44" fill="rgba(59, 130, 246, 0.1)"/>
        <text x="30" y="27" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="16" font-weight="800">00:00</text>
        <text x="210" y="27" fill="#60a5fa" font-family="'Space Grotesk', monospace" font-size="16" font-weight="800">12:00 AM</text>
        <text x="440" y="27" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Midnight (Start of new calendar day)</text>
      </g>
      <line x1="0" y1="84" x2="720" y2="84" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

      <!-- Row 2: Early Morning -->
      <g transform="translate(0, 84)">
        <text x="30" y="27" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="16" font-weight="800">06:00</text>
        <text x="210" y="27" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="16" font-weight="800">6:00 AM</text>
        <text x="440" y="27" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Morning (Hours 01–11 retain hour number)</text>
      </g>
      <line x1="0" y1="128" x2="720" y2="128" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

      <!-- Row 3: Noon (Special Case 2) -->
      <g transform="translate(0, 128)">
        <rect x="0" y="0" width="720" height="44" fill="rgba(245, 158, 11, 0.1)"/>
        <text x="30" y="27" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="16" font-weight="800">12:00</text>
        <text x="210" y="27" fill="#fbbf24" font-family="'Space Grotesk', monospace" font-size="16" font-weight="800">12:00 PM</text>
        <text x="440" y="27" fill="#fde68a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Noon (Midday transition to PM)</text>
      </g>
      <line x1="0" y1="172" x2="720" y2="172" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

      <!-- Row 4: Afternoon Example (Featured) -->
      <g transform="translate(0, 172)">
        <rect x="0" y="0" width="720" height="44" fill="rgba(54, 199, 181, 0.1)"/>
        <text x="30" y="27" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="16" font-weight="800">15:30</text>
        <text x="210" y="27" fill="#36c7b5" font-family="'Space Grotesk', monospace" font-size="16" font-weight="800">3:30 PM</text>
        <text x="440" y="27" fill="#8fd7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Afternoon (Hours 13–23: Subtract 12)</text>
      </g>
      <line x1="0" y1="216" x2="720" y2="216" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

      <!-- Row 5: Late Night -->
      <g transform="translate(0, 216)">
        <text x="30" y="27" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="16" font-weight="800">23:59</text>
        <text x="210" y="27" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="16" font-weight="800">11:59 PM</text>
        <text x="440" y="27" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">End of Day (Last minute before midnight)</text>
      </g>
    </g>

    <!-- Visible Caption Box -->
    <rect x="40" y="380" width="720" height="48" rx="8" fill="#12455d" stroke="#1e5f80" stroke-width="1"/>
    <text x="60" y="410" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="13">00:00 is 12:00 AM, 12:00 is 12:00 PM, and 15:30 is 3:30 PM.</text>
  </svg>
  