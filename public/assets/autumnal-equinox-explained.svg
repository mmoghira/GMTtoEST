
  <svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="eqBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06151f"/>
        <stop offset="100%" stop-color="#0c354a"/>
      </linearGradient>
      <radialGradient id="sunOrigin" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="40%" stop-color="#fde047"/>
        <stop offset="100%" stop-color="#f59e0b"/>
      </radialGradient>
      <linearGradient id="earthDay" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#1e3a8a"/>
        <stop offset="50%" stop-color="#2563eb"/>
        <stop offset="100%" stop-color="#60a5fa"/>
      </linearGradient>
    </defs>

    <rect width="800" height="450" fill="url(#eqBg)"/>

    <!-- Title and Subtitle -->
    <text x="40" y="44" fill="#36c7b5" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">ASTRONOMICAL MECHANICS</text>
    <text x="40" y="74" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800">Autumnal Equinox: Direct Sunlight on the Equator</text>

    <!-- Sun rays originating on left side -->
    <path d="M -80,240 C -40,160 30,240 60,240" fill="none"/>
    <circle cx="-30" cy="245" r="110" fill="url(#sunOrigin)" filter="drop-shadow(0 0 35px #f59e0b)"/>

    <!-- Parallel Sunlight arrows entering toward Earth -->
    <g stroke="#fde047" stroke-width="2.5" opacity="0.85">
      <!-- Top ray -->
      <line x1="120" y1="180" x2="380" y2="180"/>
      <polygon points="380,180 370,175 370,185" fill="#fde047"/>

      <!-- Center ray (subsolar point at equator) -->
      <line x1="120" y1="245" x2="420" y2="245" stroke="#36c7b5" stroke-width="3"/>
      <polygon points="420,245 408,239 408,251" fill="#36c7b5"/>

      <!-- Bottom ray -->
      <line x1="120" y1="310" x2="380" y2="310"/>
      <polygon points="380,310 370,305 370,315" fill="#fde047"/>
    </g>
    <text x="140" y="235" fill="#36c7b5" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Subsolar Point (Sun directly overhead at 0°)</text>

    <!-- Earth Container Group with 23.4° Tilt for Axis -->
    <!-- Earth Globe -->
    <g transform="translate(520, 245)">
      <!-- Earth Body: Day side left, Night side right -->
      <clipPath id="earthClip">
        <circle cx="0" cy="0" r="110"/>
      </clipPath>

      <g clip-path="url(#earthClip)">
        <!-- Day side (Left half illuminated by parallel sun rays) -->
        <rect x="-110" y="-110" width="110" height="220" fill="#2563eb"/>
        <!-- Night side (Right half in shadow) -->
        <rect x="0" y="-110" width="110" height="220" fill="#0f172a"/>
        <!-- Terminator Line (Vertical at equinox!) -->
        <line x1="0" y1="-110" x2="0" y2="110" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
      </g>
      <circle cx="0" cy="0" r="110" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

      <!-- Axial Tilt of 23.4° (Rotated) -->
      <g transform="rotate(23.4)">
        <!-- Polar Axis -->
        <line x1="0" y1="-140" x2="0" y2="140" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6,4"/>
        <text x="6" y="-142" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="12" font-weight="800">North Pole (23.4°)</text>
        <text x="6" y="152" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="12" font-weight="800">South Pole</text>

        <!-- Equator Line -->
        <line x1="-120" y1="0" x2="120" y2="0" stroke="#fbbf24" stroke-width="3"/>
        <text x="125" y="4" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Equator (0°)</text>
      </g>
    </g>

    <!-- Annotation Card -->
    <rect x="40" y="340" width="370" height="85" rx="8" fill="#12455d" stroke="#1e5f80" stroke-width="1.5"/>
    <text x="56" y="365" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Key Equinox Fact: Equal Day &amp; Night Terminator</text>
    <text x="56" y="388" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="12">The day-night boundary (terminator) runs perpendicular to</text>
    <text x="56" y="406" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="12">the Equator, giving nearly 12 hours of light across all latitudes.</text>
  </svg>
  