<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="diagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06151f"/>
      <stop offset="100%" stop-color="#0c354a"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36c7b5"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#diagBg)"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="160" height="24" rx="12" fill="rgba(54, 199, 181, 0.15)" stroke="#36c7b5" stroke-width="1.2"/>
    <text x="14" y="16" fill="#36c7b5" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" letter-spacing="1">EPOCH TIMELINE</text>
    <text x="0" y="60" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800">How Unix Time Counts Continuous Seconds</text>
    <text x="0" y="84" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="14">Counting elapsed seconds from the reference point of 00:00:00 UTC, 1 January 1970.</text>
  </g>

  <!-- Horizontal Timeline Axis -->
  <g transform="translate(40, 180)">
    <!-- Base Timeline Bar -->
    <rect x="0" y="16" width="720" height="8" rx="4" fill="url(#lineGrad)"/>

    <!-- Milestone 1: 1 Jan 1970 (Origin) -->
    <g transform="translate(40, 0)">
      <circle cx="0" cy="20" r="14" fill="#082030" stroke="#36c7b5" stroke-width="3"/>
      <circle cx="0" cy="20" r="6" fill="#36c7b5"/>
      
      <!-- Label Above -->
      <text x="0" y="-12" fill="#36c7b5" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="900" text-anchor="middle">1 JAN 1970</text>
      <text x="0" y="4" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">00:00:00 UTC</text>
      
      <!-- Value Below -->
      <rect x="-42" y="46" width="84" height="28" rx="6" fill="#06151f" stroke="#1e5f80" stroke-width="1"/>
      <text x="0" y="65" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="13" font-weight="800" text-anchor="middle">t = 0</text>
      <text x="0" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">The Unix Epoch</text>
    </g>

    <!-- Milestone 2: 9 Sep 2001 (1 Billion) -->
    <g transform="translate(260, 0)">
      <circle cx="0" cy="20" r="12" fill="#082030" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="0" cy="20" r="5" fill="#38bdf8"/>
      
      <!-- Label Above -->
      <text x="0" y="-12" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" text-anchor="middle">9 SEP 2001</text>
      <text x="0" y="4" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">01:46:40 UTC</text>

      <!-- Value Below -->
      <rect x="-56" y="46" width="112" height="28" rx="6" fill="#06151f" stroke="#1e5f80" stroke-width="1"/>
      <text x="0" y="65" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="13" font-weight="800" text-anchor="middle">1,000,000,000</text>
      <text x="0" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">1 Billion Seconds</text>
    </g>

    <!-- Milestone 3: 1 Jan 2026 (Modern Timestamp) -->
    <g transform="translate(480, 0)">
      <circle cx="0" cy="20" r="14" fill="#fbbf24" stroke="#f59e0b" stroke-width="3"/>
      <circle cx="0" cy="20" r="6" fill="#06151f"/>
      
      <!-- Label Above -->
      <text x="0" y="-12" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="900" text-anchor="middle">1 JAN 2026</text>
      <text x="0" y="4" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">00:00:00 UTC</text>

      <!-- Value Below -->
      <rect x="-62" y="46" width="124" height="28" rx="6" fill="#06151f" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="0" y="65" fill="#fbbf24" font-family="'Space Grotesk', monospace" font-size="13" font-weight="900" text-anchor="middle">1767225600</text>
      <text x="0" y="90" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Modern Example</text>
    </g>

    <!-- Milestone 4: 19 Jan 2038 (Year 2038 Problem) -->
    <g transform="translate(670, 0)">
      <circle cx="0" cy="20" r="11" fill="#082030" stroke="#f87171" stroke-width="2"/>
      <circle cx="0" cy="20" r="4" fill="#f87171"/>
      
      <!-- Label Above -->
      <text x="0" y="-12" fill="#f87171" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" text-anchor="middle">19 JAN 2038</text>
      <text x="0" y="4" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">03:14:07 UTC</text>

      <!-- Value Below -->
      <rect x="-56" y="46" width="112" height="28" rx="6" fill="#06151f" stroke="#ef4444" stroke-width="1"/>
      <text x="0" y="65" fill="#f87171" font-family="'Space Grotesk', monospace" font-size="12" font-weight="800" text-anchor="middle">2,147,483,647</text>
      <text x="0" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">32-bit Limit (Y2038)</text>
    </g>
  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="720" height="70" rx="10" fill="#082030" stroke="#1e5f80" stroke-width="1.5"/>
    <g transform="translate(20, 15)">
      <circle cx="10" cy="10" r="10" fill="#36c7b5"/>
      <text x="10" y="14" fill="#06151f" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">i</text>
      <text x="30" y="14" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800">Continuous Second Counter:</text>
      <text x="30" y="36" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="12">
        Unix time increments uniformly without leap seconds. Negative values represent moments prior to 1970.
      </text>
    </g>
  </g>
</svg>