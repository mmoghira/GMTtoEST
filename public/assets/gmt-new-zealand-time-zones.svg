<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26" />
      <stop offset="100%" stop-color="#0f3c52" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0c354a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <g transform="translate(0, 70)" text-anchor="middle">
    <text x="600" y="40" font-family="'Space Grotesk', system-ui, sans-serif" font-size="40" font-weight="bold" fill="#f4fbff">GMT Baseline vs New Zealand Time Zones</text>
    <text x="600" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="22" fill="#bdd2dc">Understanding GMT Offset Transitions in New Zealand</text>
  </g>

  <!-- Big Central Card -->
  <g transform="translate(200, 200)" filter="url(#shadow)">
    <rect width="800" height="430" rx="20" fill="url(#cardGrad)" stroke="#36c7b5" stroke-width="3" />
    
    <g transform="translate(50, 40)">
      <circle cx="50" cy="50" r="40" fill="#1b536e" />
      <text x="50" y="60" font-family="'Space Grotesk', system-ui, sans-serif" font-size="40" font-weight="bold" fill="#36c7b5" text-anchor="middle">NZ</text>
      
      <text x="120" y="45" font-family="'Space Grotesk', system-ui, sans-serif" font-size="36" font-weight="bold" fill="#f4fbff">Pacific/Auckland Time Baseline</text>
      <text x="120" y="80" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="600" fill="#8fd7ff">Seasonal Transition Between NZDT (UTC+13) &amp; NZST (UTC+12)</text>
    </g>

    <line x1="50" y1="150" x2="750" y2="150" stroke="#256e91" stroke-width="2" />

    <g transform="translate(50, 190)">
      <text x="0" y="0" font-family="'Manrope', system-ui, sans-serif" font-size="20" fill="#f4fbff">• <tspan font-weight="bold" fill="#36c7b5">GMT Reference:</tspan> Greenwich Mean Time (UTC+0) zero meridian baseline.</text>
      <text x="0" y="45" font-family="'Manrope', system-ui, sans-serif" font-size="20" fill="#f4fbff">• <tspan font-weight="bold" fill="#36c7b5">Summer (NZDT):</tspan> Clocks set to UTC+13 (+13 hours ahead of GMT).</text>
      <text x="0" y="90" font-family="'Manrope', system-ui, sans-serif" font-size="20" fill="#f4fbff">• <tspan font-weight="bold" fill="#36c7b5">Winter (NZST):</tspan> Clocks set to UTC+12 (+12 hours ahead of GMT).</text>
      <text x="0" y="135" font-family="'Manrope', system-ui, sans-serif" font-size="20" fill="#f4fbff">• <tspan font-weight="bold" fill="#36c7b5">IANA Database:</tspan> Standardized as <code>Pacific/Auckland</code> key.</text>
    </g>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(200, 680)">
    <rect width="800" height="55" rx="12" fill="#12455d" stroke="#2f6278" stroke-width="1.5" />
    <text x="400" y="35" font-family="'Manrope', system-ui, sans-serif" font-size="18" font-weight="bold" fill="#f4fbff" text-anchor="middle">
      When converting GMT to New Zealand time, verify whether NZDT (+13) or NZST (+12) is active.
    </text>
  </g>
</svg>
