<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06151f"/>
      <stop offset="50%" stop-color="#0c354a"/>
      <stop offset="100%" stop-color="#12455d"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36c7b5"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(18, 69, 93, 0.95)"/>
      <stop offset="100%" stop-color="rgba(12, 53, 74, 0.95)"/>
    </linearGradient>
    <radialGradient id="timerGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#36c7b5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06151f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="540" fill="url(#heroBg)"/>
  <circle cx="480" cy="270" r="400" fill="url(#timerGlow)"/>

  <!-- Subtle Classroom Layout Lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1.5">
    <line x1="80" y1="80" x2="880" y2="80"/>
    <line x1="80" y1="460" x2="880" y2="460"/>
    <circle cx="480" cy="280" r="210" fill="none"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(80, 42)">
    <rect x="0" y="0" width="230" height="30" rx="15" fill="rgba(54, 199, 181, 0.15)" stroke="#36c7b5" stroke-width="1.5"/>
    <text x="18" y="20" fill="#36c7b5" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">CLASSROOM FOCUS TOOL</text>
    <text x="0" y="70" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="800">Visual Timer for Students</text>
    <text x="0" y="98" fill="#bdd2dc" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="600">Free, Large-Format Countdown Display for Classrooms &amp; Study</text>
  </g>

  <!-- Main Timer Simulation Card -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="800" height="320" rx="20" fill="url(#cardGrad)" stroke="#1e5f80" stroke-width="2.5"/>

    <!-- Status Pill -->
    <g transform="translate(40, 28)">
      <rect x="0" y="0" width="105" height="26" rx="13" fill="rgba(54, 199, 181, 0.2)" stroke="#36c7b5" stroke-width="1"/>
      <circle cx="15" cy="13" r="5" fill="#36c7b5"/>
      <text x="28" y="17" fill="#36c7b5" font-family="system-ui, sans-serif" font-size="11" font-weight="800">RUNNING</text>
    </g>

    <text x="760" y="46" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" text-anchor="end">TOTAL: 15 MINUTES</text>

    <!-- Large Digits -->
    <text x="400" y="145" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="82" font-weight="900" text-anchor="middle" letter-spacing="2">09:45</text>
    <text x="400" y="180" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">65% OF TIME REMAINING</text>

    <!-- Shrinking Visual Progress Bar Container -->
    <g transform="translate(40, 205)">
      <!-- Background track -->
      <rect x="0" y="0" width="720" height="38" rx="19" fill="#06151f" stroke="#1e5f80" stroke-width="1.5"/>
      <!-- Active shrinking bar (65% width = 468px) -->
      <rect x="4" y="4" width="468" height="30" rx="15" fill="url(#barGrad)"/>
      <text x="450" y="24" fill="#06151f" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="end">TIME LEFT</text>
    </g>

    <!-- Mock Control Action Buttons -->
    <g transform="translate(40, 262)">
      <rect x="0" y="0" width="90" height="36" rx="8" fill="rgba(255,255,255,0.08)" stroke="#1e5f80" stroke-width="1"/>
      <text x="45" y="23" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">5 min</text>

      <rect x="100" y="0" width="90" height="36" rx="8" fill="rgba(255,255,255,0.08)" stroke="#1e5f80" stroke-width="1"/>
      <text x="145" y="23" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">10 min</text>

      <rect x="200" y="0" width="90" height="36" rx="8" fill="#36c7b5" stroke="#36c7b5" stroke-width="1"/>
      <text x="245" y="23" fill="#06151f" font-family="system-ui, sans-serif" font-size="13" font-weight="900" text-anchor="middle">✓ 15 min</text>

      <rect x="300" y="0" width="90" height="36" rx="8" fill="rgba(255,255,255,0.08)" stroke="#1e5f80" stroke-width="1"/>
      <text x="345" y="23" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">25 min</text>

      <!-- Action Buttons Right -->
      <rect x="520" y="0" width="90" height="36" rx="8" fill="#fbbf24"/>
      <text x="565" y="23" fill="#06151f" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">⏸ Pause</text>

      <rect x="620" y="0" width="100" height="36" rx="8" fill="rgba(255,255,255,0.12)" stroke="#1e5f80" stroke-width="1"/>
      <text x="670" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">⛶ Fullscreen</text>
    </g>
  </g>
</svg>