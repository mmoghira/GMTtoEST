<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="auto" style="display: block; margin: 0 auto;">
        <rect width="800" height="300" fill="#0f172a" rx="8" />
        
        <!-- UTC side -->
        <g transform="translate(50, 40)">
          <rect width="320" height="220" fill="#12455d" rx="6" />
          <text x="160" y="40" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="20" fill="#8fd7ff" text-anchor="middle">UTC Standard</text>
          <text x="160" y="80" font-family="'Manrope', sans-serif" font-size="12" fill="#bdd2dc" text-anchor="middle">Coordinated Universal Time</text>
          <circle cx="160" cy="140" r="30" fill="#1b536e" />
          <text x="160" y="145" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="14" fill="#8fd7ff" text-anchor="middle">UTC+0</text>
          <text x="160" y="195" font-family="'Manrope', sans-serif" font-size="11" fill="#8fd7ff" text-anchor="middle">Scientific Atomic Reference</text>
        </g>

        <!-- Offset Arrow -->
        <g transform="translate(380, 140)">
          <line x1="0" y1="0" x2="40" y2="0" stroke="#36c7b5" stroke-width="4" />
          <polygon points="40,-6 50,0 40,6" fill="#36c7b5" />
          <text x="20" y="-15" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="11" fill="#36c7b5" text-anchor="middle">-5 Hours</text>
        </g>

        <!-- EST side -->
        <g transform="translate(430, 40)">
          <rect width="320" height="220" fill="#1b536e" rx="6" />
          <text x="160" y="40" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="20" fill="#36c7b5" text-anchor="middle">EST Time Zone</text>
          <text x="160" y="80" font-family="'Manrope', sans-serif" font-size="12" fill="#bdd2dc" text-anchor="middle">Eastern Standard Time</text>
          <circle cx="160" cy="140" r="30" fill="#12455d" />
          <text x="160" y="145" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="14" fill="#36c7b5" text-anchor="middle">UTC-5</text>
          <text x="160" y="195" font-family="'Manrope', sans-serif" font-size="11" fill="#36c7b5" text-anchor="middle">Regional Civil Time Zone</text>
        </g>
      </svg>