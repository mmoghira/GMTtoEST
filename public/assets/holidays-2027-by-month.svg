<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="diagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06151f"/>
      <stop offset="100%" stop-color="#0c354a"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12455d"/>
      <stop offset="100%" stop-color="#082030"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#diagBg)"/>

  <!-- Header -->
  <g transform="translate(40, 32)">
    <rect x="0" y="0" width="160" height="24" rx="12" fill="rgba(54, 199, 181, 0.15)" stroke="#36c7b5" stroke-width="1.2"/>
    <text x="14" y="16" fill="#36c7b5" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" letter-spacing="1">CALENDAR TIMELINE</text>
    <text x="0" y="58" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800">Major Holidays in 2027 by Month</text>
    <text x="0" y="82" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="14">Chronological breakdown across international civil, religious, and cultural dates.</text>
  </g>

  <!-- Month Grid (3 columns x 3 rows = 9 months with supplied holidays) -->
  <g transform="translate(40, 115)">
    
    <!-- Row 1: Jan, Feb, Mar -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="226" height="86" rx="8" fill="url(#boxGrad)" stroke="#1e5f80" stroke-width="1.2"/>
      <text x="14" y="24" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800">JANUARY 2027</text>
      <text x="14" y="46" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">1 Jan: New Year's Day (Fri)</text>
      <text x="14" y="66" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">18 Jan: MLK Jr. Day (Mon)</text>
    </g>

    <g transform="translate(246, 0)">
      <rect x="0" y="0" width="226" height="86" rx="8" fill="url(#boxGrad)" stroke="#1e5f80" stroke-width="1.2"/>
      <text x="14" y="24" fill="#36c7b5" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800">FEBRUARY 2027</text>
      <text x="14" y="46" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">8 Feb: Ramadan Start*</text>
      <text x="14" y="66" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">15 Feb: Presidents Day</text>
    </g>

    <g transform="translate(492, 0)">
      <rect x="0" y="0" width="226" height="86" rx="8" fill="url(#boxGrad)" stroke="#1e5f80" stroke-width="1.2"/>
      <text x="14" y="24" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800">MARCH 2027</text>
      <text x="14" y="46" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">9–10 Mar: Eid al-Fitr*</text>
      <text x="14" y="66" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">28 Mar: Easter Sunday</text>
    </g>

    <!-- Row 2: May, Jun, Jul -->
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="226" height="86" rx="8" fill="url(#boxGrad)" stroke="#1e5f80" stroke-width="1.2"/>
      <text x="14" y="24" fill="#34d399" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800">MAY 2027</text>
      <text x="14" y="46" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">31 May: Memorial Day (Mon)</text>
      <text x="14" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Federal Public Holiday</text>
    </g>

    <g transform="translate(246, 96)">
      <rect x="0" y="0" width="226" height="86" rx="8" fill="url(#boxGrad)" stroke="#1e5f80" stroke-width="1.2"/>
      <text x="14" y="24" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800">JUNE 2027</text>
      <text x="14" y="46" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">19 Jun: Juneteenth (Sat)</text>
      <text x="14" y="66" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">20 Jun: Father's Day (Sun)</text>
    </g>

    <g transform="translate(492, 96)">
      <rect x="0" y="0" width="226" height="86" rx="8" fill="url(#boxGrad)" stroke="#1e5f80" stroke-width="1.2"/>
      <text x="14" y="24" fill="#f87171" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800">JULY 2027</text>
      <text x="14" y="46" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">4 Jul: Independence Day (Sun)</text>
      <text x="14" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Observed Monday 5 Jul</text>
    </g>

    <!-- Row 3: Sep, Oct, Nov–Dec -->
    <g transform="translate(0, 192)">
      <rect x="0" y="0" width="226" height="86" rx="8" fill="url(#boxGrad)" stroke="#1e5f80" stroke-width="1.2"/>
      <text x="14" y="24" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800">SEPTEMBER 2027</text>
      <text x="14" y="46" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">6 Sep: Labor Day (Mon)</text>
      <text x="14" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Federal Public Holiday</text>
    </g>

    <g transform="translate(246, 192)">
      <rect x="0" y="0" width="226" height="86" rx="8" fill="url(#boxGrad)" stroke="#1e5f80" stroke-width="1.2"/>
      <text x="14" y="24" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800">OCTOBER 2027</text>
      <text x="14" y="46" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">29 Oct: Diwali (India)</text>
      <text x="14" y="66" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">31 Oct: Halloween (Sun)</text>
    </g>

    <g transform="translate(492, 192)">
      <rect x="0" y="0" width="226" height="86" rx="8" fill="url(#boxGrad)" stroke="#1e5f80" stroke-width="1.2"/>
      <text x="14" y="24" fill="#34d399" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800">NOV – DEC 2027</text>
      <text x="14" y="46" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">25 Nov: Thanksgiving (Thu)</text>
      <text x="14" y="66" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">25 Dec: Christmas Day (Sat)</text>
    </g>

  </g>

  <!-- Footer note -->
  <text x="400" y="426" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    *Dates subject to moon sighting and local community observances.
  </text>
</svg>