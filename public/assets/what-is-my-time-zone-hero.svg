
  <svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06151f"/>
        <stop offset="50%" stop-color="#0c354a"/>
        <stop offset="100%" stop-color="#12455d"/>
      </linearGradient>
      <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#36c7b5"/>
        <stop offset="100%" stop-color="#8fd7ff"/>
      </linearGradient>
      <radialGradient id="mapGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#36c7b5" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#06151f" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="rgba(18, 69, 93, 0.95)"/>
        <stop offset="100%" stop-color="rgba(12, 53, 74, 0.95)"/>
      </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="960" height="540" fill="url(#heroBg)"/>

    <!-- Map Grid & Longitude meridian lines background -->
    <g stroke="rgba(255,255,255,0.06)" stroke-width="1.5" fill="none">
      <ellipse cx="480" cy="270" rx="420" ry="210"/>
      <ellipse cx="480" cy="270" rx="280" ry="210"/>
      <ellipse cx="480" cy="270" rx="140" ry="210"/>
      <line x1="60" y1="270" x2="900" y2="270"/>
      <line x1="480" y1="60" x2="480" y2="480"/>
      <line x1="60" y1="165" x2="900" y2="165"/>
      <line x1="60" y1="375" x2="900" y2="375"/>
    </g>

    <!-- Center Soft Glow -->
    <circle cx="480" cy="260" r="240" fill="url(#mapGlow)"/>

    <!-- Left Header Info -->
    <g transform="translate(64, 60)">
      <rect x="0" y="0" width="220" height="32" rx="16" fill="rgba(54, 199, 181, 0.15)" stroke="#36c7b5" stroke-width="1.5"/>
      <text x="18" y="21" fill="#36c7b5" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">CLIENT-SIDE DETECTION</text>
      
      <text x="0" y="75" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="40" font-weight="800">What Is My Time Zone?</text>
      <text x="0" y="112" fill="#fbbf24" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="20" font-weight="700">Detect Your Exact Zone, Offset &amp; DST Status</text>
      <text x="0" y="140" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="15">Reads your device's configured IANA timezone instantly via browser APIs</text>
    </g>

    <!-- Center-Right: Interactive Device / Clock Visual Card -->
    <g transform="translate(490, 160)">
      <!-- Outer Card Container -->
      <rect x="0" y="0" width="410" height="310" rx="16" fill="url(#cardGrad)" stroke="#1e5f80" stroke-width="2" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.5))"/>
      
      <!-- Top header bar in card -->
      <path d="M 0,16 Q 0,0 16,0 L 394,0 Q 410,0 410,16 L 410,50 L 0,50 Z" fill="#082030"/>
      <circle cx="24" cy="25" r="5" fill="#ef4444"/>
      <circle cx="40" cy="25" r="5" fill="#f59e0b"/>
      <circle cx="56" cy="25" r="5" fill="#10b981"/>
      <text x="80" y="30" fill="#8fd7ff" font-family="monospace" font-size="13">Intl.DateTimeFormat().resolvedOptions()</text>

      <!-- Detected Timezone Row -->
      <g transform="translate(24, 75)">
        <text x="0" y="14" fill="#8fd7ff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">DETECTED TIME ZONE</text>
        <text x="0" y="44" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="24" font-weight="800">America/New_York</text>
        <text x="0" y="68" fill="#36c7b5" font-family="system-ui, sans-serif" font-size="14" font-weight="700">New York, United States (Eastern Time)</text>
      </g>

      <line x1="24" y1="165" x2="386" y2="165" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

      <!-- Metrics Grid: UTC Offset & DST -->
      <g transform="translate(24, 185)">
        <!-- Box 1: Offset -->
        <rect x="0" y="0" width="170" height="95" rx="10" fill="#0c354a" stroke="#1e5f80" stroke-width="1.5"/>
        <text x="16" y="24" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">CURRENT OFFSET</text>
        <text x="16" y="58" fill="#fbbf24" font-family="'Space Grotesk', monospace" font-size="24" font-weight="800">UTC−04:00</text>
        <text x="16" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">4 hours behind UTC</text>

        <!-- Box 2: DST -->
        <rect x="190" y="0" width="170" height="95" rx="10" fill="#0c354a" stroke="#1e5f80" stroke-width="1.5"/>
        <text x="206" y="24" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">DAYLIGHT SAVING</text>
        <text x="206" y="58" fill="#36c7b5" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800">In Effect</text>
        <text x="206" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">EDT active today</text>
      </g>
    </g>

    <!-- Mini Globe Pin on Left -->
    <g transform="translate(180, 290)">
      <!-- Analog Clock Motif -->
      <circle cx="90" cy="90" r="85" fill="#0a1926" stroke="#36c7b5" stroke-width="4"/>
      <circle cx="90" cy="90" r="5" fill="#fbbf24"/>
      <!-- Hour markers -->
      <line x1="90" y1="15" x2="90" y2="28" stroke="#8fd7ff" stroke-width="3"/>
      <line x1="90" y1="152" x2="90" y2="165" stroke="#8fd7ff" stroke-width="3"/>
      <line x1="15" y1="90" x2="28" y2="90" stroke="#8fd7ff" stroke-width="3"/>
      <line x1="152" y1="90" x2="165" y2="90" stroke="#8fd7ff" stroke-width="3"/>
      <!-- Clock Hands -->
      <line x1="90" y1="90" x2="125" y2="60" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <line x1="90" y1="90" x2="60" y2="40" stroke="#36c7b5" stroke-width="3" stroke-linecap="round"/>
      <line x1="90" y1="90" x2="90" y2="135" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    </g>
  </svg>
  