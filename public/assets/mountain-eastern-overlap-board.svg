<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MST to EST meeting planner illustration</title>
  <desc id="desc">A meeting planner view for Mountain and Eastern time teams with a highlighted business overlap window.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#092335"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <text x="86" y="100" fill="#ffffff" font-family="Arial, sans-serif" font-size="46" font-weight="900">Mountain and Eastern Meeting Window</text>
  <text x="88" y="144" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="22">The easiest recurring slot is late morning in Mountain Time and early afternoon in Eastern Time.</text>
  <rect x="82" y="205" width="1036" height="360" rx="24" fill="#0f3d56" stroke="#4b7890"/>
  <g font-family="Arial, sans-serif" font-size="18" fill="#d7eef8">
    <text x="118" y="260">MST</text>
    <text x="118" y="405">EST</text>
  </g>
  <g stroke="#4b7890" stroke-width="2">
    <line x1="180" y1="230" x2="180" y2="535"/>
    <line x1="304" y1="230" x2="304" y2="535"/>
    <line x1="428" y1="230" x2="428" y2="535"/>
    <line x1="552" y1="230" x2="552" y2="535"/>
    <line x1="676" y1="230" x2="676" y2="535"/>
    <line x1="800" y1="230" x2="800" y2="535"/>
    <line x1="924" y1="230" x2="924" y2="535"/>
    <line x1="1048" y1="230" x2="1048" y2="535"/>
  </g>
  <rect x="428" y="250" width="372" height="90" rx="18" fill="#174c43" stroke="#2dd4bf" stroke-width="3"/>
  <rect x="428" y="395" width="372" height="90" rx="18" fill="#174c43" stroke="#2dd4bf" stroke-width="3"/>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="800">
    <text x="180" y="590" fill="#bfdbfe" text-anchor="middle">7</text>
    <text x="304" y="590" fill="#bfdbfe" text-anchor="middle">8</text>
    <text x="428" y="590" fill="#fbbf24" text-anchor="middle">9</text>
    <text x="552" y="590" fill="#ffffff" text-anchor="middle">10</text>
    <text x="676" y="590" fill="#ffffff" text-anchor="middle">11</text>
    <text x="800" y="590" fill="#fbbf24" text-anchor="middle">12</text>
    <text x="924" y="590" fill="#bfdbfe" text-anchor="middle">1</text>
    <text x="1048" y="590" fill="#bfdbfe" text-anchor="middle">2</text>
  </g>
  <text x="614" y="304" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="900">Best MST overlap</text>
  <text x="614" y="448" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="900">Best EST overlap</text>
  <rect x="398" y="610" width="404" height="58" rx="29" fill="url(#accent)"/>
  <text x="600" y="648" fill="#062334" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="900">9 AM-12 PM MST = 11 AM-2 PM EST</text>
</svg>
