
  <svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bfBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0a121e"/>
        <stop offset="50%" stop-color="#0f1f30"/>
        <stop offset="100%" stop-color="#142c44"/>
      </linearGradient>
      <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#fbbf24"/>
        <stop offset="100%" stop-color="#f59e0b"/>
      </linearGradient>
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="rgba(18, 69, 93, 0.95)"/>
        <stop offset="100%" stop-color="rgba(12, 53, 74, 0.95)"/>
      </linearGradient>
    </defs>

    <rect width="960" height="540" fill="url(#bfBg)"/>

    <!-- Subtle festive shopping patterns / gift outline motifs -->
    <g stroke="rgba(255,255,255,0.06)" stroke-width="2" fill="none">
      <circle cx="820" cy="120" r="80"/>
      <circle cx="820" cy="120" r="140"/>
      <rect x="700" y="260" width="180" height="180" rx="16"/>
      <line x1="790" y1="260" x2="790" y2="440"/>
      <line x1="700" y1="350" x2="880" y2="350"/>
      <circle cx="120" cy="460" r="100"/>
    </g>

    <!-- Top Badge -->
    <rect x="64" y="52" width="220" height="34" rx="17" fill="rgba(54, 199, 181, 0.15)" stroke="#36c7b5" stroke-width="1.5"/>
    <text x="84" y="74" fill="#36c7b5" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">HOLIDAY CALENDAR 2026</text>

    <!-- Main Title -->
    <text x="64" y="140" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="800">Black Friday 2026</text>
    <text x="64" y="185" fill="#fbbf24" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="24" font-weight="700">Friday, November 27, 2026</text>
    <text x="64" y="215" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="16">Official day after Thanksgiving Day (November 26, 2026)</text>

    <!-- Visual Schedule Cards Grid -->
    <g transform="translate(64, 260)">
      <!-- Card 1: Thanksgiving -->
      <rect x="0" y="0" width="185" height="190" rx="12" fill="url(#cardGrad)" stroke="#1e5f80" stroke-width="1.5"/>
      <rect x="16" y="16" width="70" height="22" rx="4" fill="#3b82f6"/>
      <text x="24" y="31" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">NOV 26</text>
      <text x="16" y="72" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">Thanksgiving</text>
      <text x="16" y="94" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Federal Holiday</text>
      <text x="16" y="130" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="12">4th Thursday</text>
      <text x="16" y="150" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="12">Family gatherings</text>

      <!-- Card 2: Black Friday (Featured) -->
      <rect x="205" y="0" width="200" height="190" rx="12" fill="#12455d" stroke="#fbbf24" stroke-width="2.5"/>
      <rect x="221" y="16" width="70" height="22" rx="4" fill="#fbbf24"/>
      <text x="229" y="31" fill="#0c354a" font-family="system-ui, sans-serif" font-size="11" font-weight="900">NOV 27</text>
      <text x="221" y="72" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800">Black Friday</text>
      <text x="221" y="94" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Kickoff of Sales</text>
      <text x="221" y="130" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">In-store &amp; online</text>
      <text x="221" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">Doorbuter specials</text>

      <!-- Card 3: Small Business Saturday -->
      <rect x="425" y="0" width="185" height="190" rx="12" fill="url(#cardGrad)" stroke="#1e5f80" stroke-width="1.5"/>
      <rect x="441" y="16" width="70" height="22" rx="4" fill="#10b981"/>
      <text x="449" y="31" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">NOV 28</text>
      <text x="441" y="72" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Small Biz Sat</text>
      <text x="441" y="94" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Local Merchants</text>
      <text x="441" y="130" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="12">Main street stores</text>
      <text x="441" y="150" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="12">Community retail</text>

      <!-- Card 4: Cyber Monday -->
      <rect x="630" y="0" width="185" height="190" rx="12" fill="url(#cardGrad)" stroke="#1e5f80" stroke-width="1.5"/>
      <rect x="646" y="16" width="70" height="22" rx="4" fill="#a855f7"/>
      <text x="654" y="31" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">NOV 30</text>
      <text x="646" y="72" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">Cyber Monday</text>
      <text x="646" y="94" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Online Deals</text>
      <text x="646" y="130" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="12">E-commerce focus</text>
      <text x="646" y="150" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="12">Tech &amp; software</text>
    </g>
  </svg>
  