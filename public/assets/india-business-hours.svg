
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="40" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">India Business Hours Overlap (US/UK Sync)</text>
  
  <!-- Hour Timeline (IST scale) -->
  <g transform="translate(50, 100)">
    <line x1="0" y1="30" x2="700" y2="30" stroke="#334155" stroke-width="4"/>
    
    <!-- Nodes from 9:00 AM to 9:00 PM IST -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="30" r="6" fill="#10b981"/>
      <text x="0" y="15" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">09:00 AM</text>
      <text x="0" y="55" font-family="'Manrope', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">IST Day Start</text>
    </g>
    
    <g transform="translate(180, 0)">
      <circle cx="0" cy="30" r="6" fill="#10b981"/>
      <text x="0" y="15" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">02:00 PM</text>
      <text x="0" y="55" font-family="'Manrope', sans-serif" font-size="9" fill="#e2e8f0" text-anchor="middle">UK Work Day Starts (BST)</text>
    </g>

    <g transform="translate(420, 0)">
      <circle cx="0" cy="30" r="6" fill="#f59e0b" filter="drop-shadow(0 0 6px #f59e0b)"/>
      <text x="0" y="15" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="bold">06:30 PM</text>
      <text x="0" y="55" font-family="'Manrope', sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle" font-weight="bold">USA Work Day Starts (EDT)</text>
    </g>
    
    <g transform="translate(600, 0)">
      <circle cx="0" cy="30" r="6" fill="#ef4444"/>
      <text x="0" y="15" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">09:00 PM</text>
      <text x="0" y="55" font-family="'Manrope', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">IST Office Closes</text>
    </g>
  </g>
  
  <rect x="180" y="240" width="440" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="400" y="270" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">Optimal Cross-Border Collaboration Windows</text>
  <text x="400" y="300" font-family="'Manrope', sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">
    Sync with UK: <tspan fill="#10b981">02:00 PM - 06:00 PM IST</tspan> | Sync with USA (EDT): <tspan fill="#38bdf8">06:30 PM - 09:30 PM IST</tspan>
  </text>
</svg>
