
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="40" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">New York EST vs EDT Seasonal Transitions</text>
  
  <g transform="translate(100, 100)">
    <!-- Main Year Axis -->
    <line x1="0" y1="80" x2="600" y2="80" stroke="#334155" stroke-width="4"/>
    
    <!-- Winter Period (EST) -->
    <rect x="0" y="40" width="120" height="15" fill="#38bdf8" opacity="0.3"/>
    <text x="60" y="30" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="bold">EST (UTC-5)</text>
    
    <!-- Spring forward node -->
    <g transform="translate(120, 80)">
      <circle cx="0" cy="0" r="8" fill="#f59e0b" filter="drop-shadow(0 0 6px #f59e0b)"/>
      <line x1="0" y1="0" x2="0" y2="30" stroke="#f59e0b" stroke-width="2"/>
      <text x="0" y="-15" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="bold">March: Spring Forward</text>
      <text x="0" y="50" font-family="'Manrope', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">2nd Sun in March (2AM -> 3AM)</text>
    </g>

    <!-- Summer Period (EDT) -->
    <rect x="120" y="40" width="360" height="15" fill="#f59e0b" opacity="0.3"/>
    <text x="300" y="30" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="bold">EDT (UTC-4) - Daylight Saving Time</text>

    <!-- Fall back node -->
    <g transform="translate(480, 80)">
      <circle cx="0" cy="0" r="8" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)"/>
      <line x1="0" y1="0" x2="0" y2="30" stroke="#38bdf8" stroke-width="2"/>
      <text x="0" y="-15" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="bold">November: Fall Back</text>
      <text x="0" y="50" font-family="'Manrope', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">1st Sun in Nov (2AM -> 1AM)</text>
    </g>
    
    <!-- Winter Period (EST) -->
    <rect x="480" y="40" width="120" height="15" fill="#38bdf8" opacity="0.3"/>
    <text x="540" y="30" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="bold">EST (UTC-5)</text>
  </g>
</svg>
