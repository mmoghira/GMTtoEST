<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="auto" style="display: block; margin: 0 auto;">
        <rect width="800" height="240" fill="#0f172a" rx="8" />
        <text x="400" y="30" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="14" fill="#8fd7ff" text-anchor="middle">Overview of the Six Primary State Time Zones</text>
        
        <!-- Grid listing the 6 zones -->
        <g transform="translate(60, 60)">
          <rect x="0" y="0" width="200" height="60" fill="#1b536e" rx="4" />
          <text x="100" y="25" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="12" fill="#8fd7ff" text-anchor="middle">Eastern Time (ET)</text>
          <text x="100" y="45" font-family="'Manrope', sans-serif" font-size="10" fill="#bdd2dc" text-anchor="middle">UTC-5 / UTC-4</text>
        </g>
        <g transform="translate(300, 60)">
          <rect x="0" y="0" width="200" height="60" fill="#12455d" rx="4" />
          <text x="100" y="25" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="12" fill="#36c7b5" text-anchor="middle">Central Time (CT)</text>
          <text x="100" y="45" font-family="'Manrope', sans-serif" font-size="10" fill="#bdd2dc" text-anchor="middle">UTC-6 / UTC-5</text>
        </g>
        <g transform="translate(540, 60)">
          <rect x="0" y="0" width="200" height="60" fill="#1b536e" rx="4" />
          <text x="100" y="25" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="12" fill="#8fd7ff" text-anchor="middle">Mountain Time (MT)</text>
          <text x="100" y="45" font-family="'Manrope', sans-serif" font-size="10" fill="#bdd2dc" text-anchor="middle">UTC-7 / UTC-6</text>
        </g>
        
        <g transform="translate(60, 140)">
          <rect x="0" y="0" width="200" height="60" fill="#12455d" rx="4" />
          <text x="100" y="25" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="12" fill="#36c7b5" text-anchor="middle">Pacific Time (PT)</text>
          <text x="100" y="45" font-family="'Manrope', sans-serif" font-size="10" fill="#bdd2dc" text-anchor="middle">UTC-8 / UTC-7</text>
        </g>
        <g transform="translate(300, 140)">
          <rect x="0" y="0" width="200" height="60" fill="#1b536e" rx="4" />
          <text x="100" y="25" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="12" fill="#8fd7ff" text-anchor="middle">Alaska Time (AKT)</text>
          <text x="100" y="45" font-family="'Manrope', sans-serif" font-size="10" fill="#bdd2dc" text-anchor="middle">UTC-9 / UTC-8</text>
        </g>
        <g transform="translate(540, 140)">
          <rect x="0" y="0" width="200" height="60" fill="#12455d" rx="4" />
          <text x="100" y="25" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="12" fill="#36c7b5" text-anchor="middle">Hawaii-Aleutian Time</text>
          <text x="100" y="45" font-family="'Manrope', sans-serif" font-size="10" fill="#bdd2dc" text-anchor="middle">UTC-10 / UTC-9</text>
        </g>
      </svg>