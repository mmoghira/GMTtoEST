<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="brBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061824" />
      <stop offset="100%" stop-color="#0e3a50" />
    </linearGradient>
    <linearGradient id="brCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0b3145" />
    </linearGradient>
    <filter id="brShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#brBgGrad)" />

  <!-- Header -->
  <g transform="translate(400, 45)" text-anchor="middle">
    <text x="0" y="0" font-family="'Space Grotesk', system-ui, sans-serif" font-size="24" font-weight="800" fill="#f4fbff">Decomposing a Date Range: Days, Weeks &amp; Weekdays</text>
    <text x="0" y="26" font-family="'Manrope', system-ui, sans-serif" font-size="14" fill="#bdd2dc">How total calendar span splits into workdays and rest days</text>
  </g>

  <!-- 3 Pillar Breakdown Cards -->
  <g transform="translate(50, 105)">
    <!-- Card 1: Total Calendar Days -->
    <g transform="translate(0, 0)" filter="url(#brShadow)">
      <rect width="215" height="270" rx="14" fill="url(#brCard)" stroke="#2f6278" stroke-width="1.5" />
      <rect x="0" y="0" width="215" height="42" rx="14" fill="#1b5f80" />
      <rect x="0" y="28" width="215" height="14" fill="#1b5f80" />
      <text x="107" y="27" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#8fd7ff" text-anchor="middle">TOTAL CALENDAR</text>
      
      <text x="107" y="105" font-family="'Space Grotesk', system-ui, sans-serif" font-size="46" font-weight="800" fill="#ffffff" text-anchor="middle">66</text>
      <text x="107" y="132" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="700" fill="#36c7b5" text-anchor="middle">Total Days</text>

      <line x1="20" y1="152" x2="195" y2="152" stroke="#256e91" stroke-width="1" />
      
      <text x="107" y="180" font-family="'Manrope', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f4fbff" text-anchor="middle">9 Full Weeks</text>
      <text x="107" y="202" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#bdd2dc" text-anchor="middle">+ 3 Remainder Days</text>
      <text x="107" y="235" font-family="'Manrope', system-ui, sans-serif" font-size="11" fill="#8fd7ff" text-anchor="middle">(9 × 7) + 3 = 66 days</text>
    </g>

    <!-- Card 2: Weekdays (Mon-Fri) -->
    <g transform="translate(242, 0)" filter="url(#brShadow)">
      <rect width="215" height="270" rx="14" fill="url(#brCard)" stroke="#36c7b5" stroke-width="2" />
      <rect x="0" y="0" width="215" height="42" rx="14" fill="#156073" />
      <rect x="0" y="28" width="215" height="14" fill="#156073" />
      <text x="107" y="27" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#36c7b5" text-anchor="middle">WEEKDAYS</text>
      
      <text x="107" y="105" font-family="'Space Grotesk', system-ui, sans-serif" font-size="46" font-weight="800" fill="#36c7b5" text-anchor="middle">48</text>
      <text x="107" y="132" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="700" fill="#8fd7ff" text-anchor="middle">Mon through Fri</text>

      <line x1="20" y1="152" x2="195" y2="152" stroke="#256e91" stroke-width="1" />
      
      <text x="107" y="180" font-family="'Manrope', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f4fbff" text-anchor="middle">72.7% of Duration</text>
      <text x="107" y="202" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#bdd2dc" text-anchor="middle">Standard Workdays</text>
      <text x="107" y="235" font-family="'Manrope', system-ui, sans-serif" font-size="11" fill="#8fd7ff" text-anchor="middle">Holidays not subtracted</text>
    </g>

    <!-- Card 3: Weekends (Sat-Sun) -->
    <g transform="translate(485, 0)" filter="url(#brShadow)">
      <rect width="215" height="270" rx="14" fill="url(#brCard)" stroke="#fbbf24" stroke-width="1.5" />
      <rect x="0" y="0" width="215" height="42" rx="14" fill="#6a5214" />
      <rect x="0" y="28" width="215" height="14" fill="#6a5214" />
      <text x="107" y="27" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="middle">WEEKEND DAYS</text>
      
      <text x="107" y="105" font-family="'Space Grotesk', system-ui, sans-serif" font-size="46" font-weight="800" fill="#fbbf24" text-anchor="middle">18</text>
      <text x="107" y="132" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="middle">Saturdays &amp; Sundays</text>

      <line x1="20" y1="152" x2="195" y2="152" stroke="#256e91" stroke-width="1" />
      
      <text x="107" y="180" font-family="'Manrope', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f4fbff" text-anchor="middle">9 Weekends Spanned</text>
      <text x="107" y="202" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#bdd2dc" text-anchor="middle">9 × 2 = 18 Weekend Days</text>
      <text x="107" y="235" font-family="'Manrope', system-ui, sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">27.3% of Duration</text>
    </g>
  </g>

  <!-- Footer Formula -->
  <g transform="translate(400, 415)" text-anchor="middle">
    <text font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="700" fill="#bdd2dc">
      48 Weekdays + 18 Weekend Days = 66 Total Days
    </text>
  </g>
</svg>