<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="exBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081e2b" />
      <stop offset="100%" stop-color="#0d3448" />
    </linearGradient>
    <linearGradient id="exCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0f3c52" />
    </linearGradient>
    <filter id="exShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#exBgGrad)" />

  <!-- Header -->
  <g transform="translate(400, 44)" text-anchor="middle">
    <text x="0" y="0" font-family="'Space Grotesk', system-ui, sans-serif" font-size="24" font-weight="800" fill="#f4fbff">Deconstructing Duration: 09:00 to 17:30</text>
    <text x="0" y="26" font-family="'Manrope', system-ui, sans-serif" font-size="14" fill="#bdd2dc">Converting clock time to timeline minutes, hours, and decimals</text>
  </g>

  <!-- Timeline Flow Container -->
  <g transform="translate(50, 105)">
    <rect width="700" height="280" rx="14" fill="url(#exCardGrad)" stroke="#2f6278" stroke-width="1.5" filter="url(#exShadow)" />

    <!-- Step 1: Conversion to Common Timeline -->
    <g transform="translate(30, 25)">
      <rect x="0" y="0" width="120" height="26" rx="6" fill="#1b5f80" />
      <text x="60" y="18" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" fill="#8fd7ff" text-anchor="middle">STEP 1: MINUTES</text>
      
      <text x="140" y="19" font-family="'Manrope', system-ui, sans-serif" font-size="14" fill="#f4fbff">
        Start (09:00) = <strong fill="#8fd7ff">540 min</strong> &#160;|&#160; End (17:30) = <strong fill="#8fd7ff">1,050 min</strong>
      </text>
    </g>

    <!-- Step 2: Subtraction -->
    <g transform="translate(30, 70)">
      <rect x="0" y="0" width="120" height="26" rx="6" fill="#156073" />
      <text x="60" y="18" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" fill="#36c7b5" text-anchor="middle">STEP 2: SUBTRACT</text>
      
      <text x="140" y="19" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="700" fill="#36c7b5">
        1,050 min − 540 min = 510 Total Elapsed Minutes
      </text>
    </g>

    <line x1="30" y1="115" x2="670" y2="115" stroke="#256e91" stroke-width="1.5" />

    <!-- Step 3: Two representations side by side -->
    <!-- Left Box: Clock Breakdown -->
    <g transform="translate(40, 135)">
      <rect width="290" height="115" rx="10" fill="#071b26" stroke="#36c7b5" stroke-width="1.5" />
      <text x="145" y="28" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="700" fill="#8fd7ff" text-anchor="middle">CLOCK TIME BREAKDOWN</text>
      <text x="145" y="68" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">8h 30m 00s</text>
      <text x="145" y="95" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#bdd2dc" text-anchor="middle">510 ÷ 60 = 8 full hours (rem. 30 min)</text>
    </g>

    <!-- Right Box: Decimal Hours -->
    <g transform="translate(370, 135)">
      <rect width="290" height="115" rx="10" fill="#071b26" stroke="#fbbf24" stroke-width="1.5" />
      <text x="145" y="28" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">PAYROLL DECIMAL HOURS</text>
      <text x="145" y="68" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="800" fill="#fbbf24" text-anchor="middle">8.50 Hours</text>
      <text x="145" y="95" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#bdd2dc" text-anchor="middle">8 + (30 / 60) = 8.50 decimal hours</text>
    </g>
  </g>

  <!-- Caption -->
  <text x="400" y="422" font-family="'Manrope', system-ui, sans-serif" font-size="13" font-style="italic" fill="#8fd7ff" text-anchor="middle">
    09:00 to 17:30 is 8 hours 30 minutes (8.50 decimal hours).
  </text>
</svg>