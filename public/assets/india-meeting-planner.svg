
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="40" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#10b981" text-anchor="middle">International Meeting Planner (IST Coordination)</text>
  
  <g transform="translate(100, 100)">
    <!-- Time Slots Grid -->
    <!-- NY Row -->
    <text x="20" y="35" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#38bdf8" font-weight="bold">New York (EDT, UTC-4)</text>
    <rect x="200" y="15" width="400" height="30" fill="#1e293b" rx="4"/>
    <text x="210" y="35" font-family="monospace" font-size="11" fill="#e2e8f0">08:00 AM</text>
    <text x="350" y="35" font-family="monospace" font-size="11" fill="#e2e8f0">10:00 AM</text>
    <text x="500" y="35" font-family="monospace" font-size="11" fill="#e2e8f0">12:00 PM</text>
    
    <!-- Connections -->
    <path d="M 230,45 L 230,125" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
    <path d="M 530,45 L 530,125" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>

    <!-- IST Row -->
    <text x="20" y="115" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#f59e0b" font-weight="bold">New Delhi (IST, UTC+5:30)</text>
    <rect x="200" y="95" width="400" height="30" fill="#1e293b" rx="4" stroke="#f59e0b"/>
    <text x="210" y="115" font-family="monospace" font-size="11" fill="#f59e0b" font-weight="bold">06:30 PM</text>
    <text x="350" y="115" font-family="monospace" font-size="11" fill="#e2e8f0">08:30 PM</text>
    <text x="500" y="115" font-family="monospace" font-size="11" fill="#e2e8f0">10:30 PM</text>
  </g>
  
  <rect x="150" y="280" width="500" height="70" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="400" y="305" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold" fill="#10b981" text-anchor="middle">Meeting Sync Tip</text>
  <text x="400" y="330" font-family="'Manrope', sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">
    A morning meeting at <tspan fill="#38bdf8">08:00 AM EDT</tspan> in NY corresponds directly to a convenient dinner-time <tspan fill="#f59e0b">06:30 PM IST</tspan> in India.
  </text>
</svg>
