<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="auto" style="display: block; margin: 0 auto;">
        <rect width="800" height="240" fill="#0f172a" rx="8" />
        <text x="400" y="30" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="14" fill="#8fd7ff" text-anchor="middle">Daylight Saving Clock Transition Mechanics</text>
        
        <!-- Spring Forward -->
        <g transform="translate(200, 130)">
          <circle cx="0" cy="0" r="50" fill="#1b536e" stroke="#36c7b5" stroke-width="3" />
          <line x1="0" y1="0" x2="0" y2="-35" stroke="#bdd2dc" stroke-width="2" />
          <line x1="0" y1="0" x2="25" y2="-25" stroke="#e11d48" stroke-width="3" />
          <path d="M 10 -40 A 42 42 0 0 1 35 -20" fill="none" stroke="#8fd7ff" stroke-width="2" />
          <text x="0" y="70" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="11" fill="#36c7b5" text-anchor="middle">Spring Forward (+1 Hour)</text>
        </g>

        <!-- Fall Back -->
        <g transform="translate(600, 130)">
          <circle cx="0" cy="0" r="50" fill="#12455d" stroke="#e11d48" stroke-width="3" />
          <line x1="0" y1="0" x2="0" y2="-35" stroke="#bdd2dc" stroke-width="2" />
          <line x1="0" y1="0" x2="-25" y2="-25" stroke="#36c7b5" stroke-width="3" />
          <path d="M -10 -40 A 42 42 0 0 0 -35 -20" fill="none" stroke="#8fd7ff" stroke-width="2" />
          <text x="0" y="70" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="11" fill="#e11d48" text-anchor="middle">Fall Back (-1 Hour)</text>
        </g>
      </svg>