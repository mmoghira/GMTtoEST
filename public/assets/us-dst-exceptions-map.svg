<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="optOutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="observeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" rx="16" fill="url(#bgGrad2)"/>
  
  <!-- Header -->
  <text x="500" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">U.S. DAYLIGHT SAVING TIME: WHO OBSERVES &amp; WHO OPTS OUT</text>
  <text x="500" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Under the Uniform Time Act of 1966, states may exempt themselves from Daylight Saving Time</text>

  <!-- Left Column: Most of the US (Observes DST) -->
  <g transform="translate(50, 95)" filter="url(#shadow2)">
    <rect width="425" height="420" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="425" height="48" rx="12" fill="#0284c7" fill-opacity="0.2"/>
    <circle cx="28" cy="24" r="8" fill="#38bdf8"/>
    <text x="46" y="29" font-family="sans-serif" font-size="16" font-weight="700" fill="#38bdf8">OBSERVES DAYLIGHT SAVING TIME</text>
    
    <text x="24" y="80" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">48 Contiguous States + Alaska</text>
    <text x="24" y="102" font-family="sans-serif" font-size="12" fill="#94a3b8">The vast majority of the United States population shifts clocks.</text>

    <!-- Rule Details -->
    <rect x="24" y="125" width="377" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="40" y="152" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8">Spring Forward (+1 Hour):</text>
    <text x="40" y="172" font-family="sans-serif" font-size="12" fill="#cbd5e1">Second Sunday in March at 2:00 AM local time</text>
    <text x="40" y="196" font-family="sans-serif" font-size="11" fill="#64748b">Clocks advance: EST→EDT, CST→CDT, MST→MDT, PST→PDT, AKST→AKDT</text>

    <rect x="24" y="225" width="377" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="40" y="252" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8">Fall Back (−1 Hour):</text>
    <text x="40" y="272" font-family="sans-serif" font-size="12" fill="#cbd5e1">First Sunday in November at 2:00 AM local time</text>
    <text x="40" y="296" font-family="sans-serif" font-size="11" fill="#64748b">Clocks return to baseline Standard Time across participating states</text>

    <!-- Inset Note: Navajo Nation -->
    <rect x="24" y="325" width="377" height="70" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="40" y="350" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Special Exception inside Arizona:</text>
    <text x="40" y="370" font-family="sans-serif" font-size="11" fill="#94a3b8">The <tspan fill="#38bdf8" font-weight="600">Navajo Nation</tspan> spans AZ, NM, and UT and DOES observe DST,</text>
    <text x="40" y="386" font-family="sans-serif" font-size="11" fill="#94a3b8">shifting to MDT (UTC−6) to keep tribal operations synchronized.</text>
  </g>

  <!-- Right Column: Exemptions (No DST) -->
  <g transform="translate(525, 95)" filter="url(#shadow2)">
    <rect width="425" height="420" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="425" height="48" rx="12" fill="#f43f5e" fill-opacity="0.2"/>
    <circle cx="28" cy="24" r="8" fill="#fb7185"/>
    <text x="46" y="29" font-family="sans-serif" font-size="16" font-weight="700" fill="#fb7185">DO NOT OBSERVE DST (YEAR-ROUND STANDARD)</text>

    <!-- Hawaii -->
    <rect x="24" y="65" width="377" height="95" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="40" y="90" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">1. Hawaii (Opted Out 1967)</text>
    <text x="40" y="110" font-family="sans-serif" font-size="12" fill="#fb7185" font-weight="600">Remains on HST (UTC−10) 365 Days a Year</text>
    <text x="40" y="130" font-family="sans-serif" font-size="11" fill="#94a3b8">Tropical latitude near 21°N provides virtually equal daylight year-round.</text>
    <text x="40" y="146" font-family="sans-serif" font-size="11" fill="#64748b">Difference from NY is 5 hrs in winter (EST) and 6 hrs in summer (EDT).</text>

    <!-- Arizona -->
    <rect x="24" y="175" width="377" height="115" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="40" y="200" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">2. Most of Arizona (Opted Out 1968)</text>
    <text x="40" y="220" font-family="sans-serif" font-size="12" fill="#fb7185" font-weight="600">Remains on MST (UTC−7) 365 Days a Year</text>
    <text x="40" y="240" font-family="sans-serif" font-size="11" fill="#94a3b8">Extreme desert heat exceeds 110°F in Phoenix. Extending late afternoon</text>
    <text x="40" y="256" font-family="sans-serif" font-size="11" fill="#94a3b8">sunlight would raise energy costs and prolong dangerous heat exposure.</text>
    <text x="40" y="274" font-family="sans-serif" font-size="11" fill="#64748b">In summer, AZ matches California time (PDT = UTC−7)!</text>

    <!-- Territories -->
    <rect x="24" y="305" width="377" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="40" y="330" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">3. U.S. Territories (All Exempt)</text>
    <text x="40" y="350" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Puerto Rico &amp; U.S. Virgin Islands: <tspan fill="#f43f5e">AST (UTC−4)</tspan></text>
    <text x="40" y="368" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Guam &amp; Northern Mariana Islands: <tspan fill="#f43f5e">ChST (UTC+10)</tspan></text>
    <text x="40" y="386" font-family="sans-serif" font-size="11" fill="#cbd5e1">• American Samoa: <tspan fill="#f43f5e">SST (UTC−11)</tspan></text>
  </g>
</svg>
