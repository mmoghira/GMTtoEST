<svg class="visual-svg" viewBox="0 0 800 360" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UTC Architecture Diagram showing TAI, UT1, UTC and Civil Offsets">
        <rect width="800" height="360" rx="12" fill="#0f172a" stroke="var(--line)" stroke-width="2"/>
        
        <!-- Box 1: TAI -->
        <rect x="40" y="40" width="210" height="120" rx="8" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" stroke-width="2"/>
        <text x="145" y="75" fill="#60a5fa" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="18" text-anchor="middle">TAI (Atomic Time)</text>
        <text x="145" y="100" fill="#94a3b8" font-size="12" text-anchor="middle">400+ Atomic Clocks (BIPM)</text>
        <text x="145" y="120" fill="#cbd5e1" font-size="12" text-anchor="middle">Pure Physics / No Leap Secs</text>
        <text x="145" y="142" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">TAI = UTC + 37s</text>

        <!-- Arrow TAI -> UTC -->
        <path d="M 145 160 L 145 210" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
        
        <!-- Box 2: UT1 -->
        <rect x="550" y="40" width="210" height="120" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="2"/>
        <text x="655" y="75" fill="#34d399" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="18" text-anchor="middle">UT1 (Astronomical)</text>
        <text x="655" y="100" fill="#94a3b8" font-size="12" text-anchor="middle">Earth Rotation (IERS VLBI)</text>
        <text x="655" y="120" fill="#cbd5e1" font-size="12" text-anchor="middle">Fluctuates with Solar Noon</text>
        <text x="655" y="142" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">|UTC - UT1| &lt; 0.9s</text>

        <!-- Arrow UT1 -> UTC -->
        <path d="M 655 160 L 655 210" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>

        <!-- Middle Core: UTC -->
        <rect x="250" y="190" width="300" height="90" rx="10" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="3"/>
        <text x="400" y="225" fill="#fbbf24" font-family="Space Grotesk, sans-serif" font-weight="800" font-size="22" text-anchor="middle">UTC (Coordinated Universal Time)</text>
        <text x="400" y="250" fill="#fef3c7" font-size="13" text-anchor="middle">Atomic Accuracy + Astronomical Alignment</text>
        <text x="400" y="268" fill="#94a3b8" font-size="11" text-anchor="middle">Maintained by BIPM in Sèvres, France</text>

        <!-- Connecting Lines to Civil Time Zones -->
        <path d="M 400 280 L 150 320" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4"/>
        <path d="M 400 280 L 400 320" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4"/>
        <path d="M 400 280 L 650 320" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4"/>

        <!-- Bottom Zone Nodes -->
        <text x="150" y="342" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">EST (UTC-5) / EDT (UTC-4)</text>
        <text x="400" y="342" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">GMT (UTC+0) / BST (UTC+1)</text>
        <text x="650" y="342" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">IST (UTC+5:30) / JST (UTC+9)</text>

        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent,#38bdf8)" />
          </marker>
        </defs>
      </svg>