
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="45" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">India Time Throughout the Day (East-West Solar Span)</text>
  
  <g transform="translate(80, 150)">
    <line x1="0" y1="50" x2="640" y2="50" stroke="#334155" stroke-width="4"/>
    
    <!-- East Point Solar Sunrise -->
    <g transform="translate(60, 0)">
      <circle cx="0" cy="50" r="8" fill="#10b981" filter="drop-shadow(0 0 6px #10b981)"/>
      <line x1="0" y1="50" x2="0" y2="0" stroke="#10b981" stroke-width="2"/>
      <text x="0" y="-15" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#10b981" text-anchor="middle" font-weight="bold">Arunachal Sunrise</text>
      <text x="0" y="80" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">04:15 AM IST</text>
    </g>
    
    <!-- Central Meridian Noon -->
    <g transform="translate(320, 0)">
      <circle cx="0" cy="50" r="10" fill="#f59e0b" filter="drop-shadow(0 0 8px #f59e0b)"/>
      <line x1="0" y1="50" x2="0" y2="-20" stroke="#f59e0b" stroke-width="2"/>
      <text x="0" y="-35" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="bold">Mirzapur Solar Noon</text>
      <text x="0" y="80" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold">12:00 PM IST</text>
    </g>

    <!-- West Point Solar Sunrise -->
    <g transform="translate(580, 0)">
      <circle cx="0" cy="50" r="8" fill="#ef4444" filter="drop-shadow(0 0 6px #ef4444)"/>
      <line x1="0" y1="50" x2="0" y2="0" stroke="#ef4444" stroke-width="2"/>
      <text x="0" y="-15" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="bold">Gujarat Sunrise</text>
      <text x="0" y="80" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">06:00 AM IST</text>
    </g>
  </g>
  
  <text x="400" y="320" font-family="'Manrope', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
    Standard clocks show the same time across India, despite a 1.75-hour physical solar gap between the eastern and western borders.
  </text>
</svg>
