
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="45" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#10b981" text-anchor="middle">Evolution of Global Time Standardization</text>
  
  <g transform="translate(80, 180)">
    <!-- Main line -->
    <line x1="0" y1="50" x2="640" y2="50" stroke="#334155" stroke-width="4"/>
    
    <!-- 1880: Greenwich Mean Time -->
    <g transform="translate(60, 0)">
      <circle cx="0" cy="50" r="8" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)"/>
      <line x1="0" y1="50" x2="0" y2="0" stroke="#38bdf8" stroke-width="2"/>
      <text x="0" y="-15" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="bold">GMT Adopted</text>
      <text x="0" y="80" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">1880</text>
    </g>

    <!-- 1918: US Standard Time -->
    <g transform="translate(240, 0)">
      <circle cx="0" cy="50" r="8" fill="#f59e0b" filter="drop-shadow(0 0 6px #f59e0b)"/>
      <line x1="0" y1="50" x2="0" y2="0" stroke="#f59e0b" stroke-width="2"/>
      <text x="0" y="-15" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="bold">EST/PST Codified</text>
      <text x="0" y="80" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">1918</text>
    </g>

    <!-- 1972: Coordinated Universal Time -->
    <g transform="translate(420, 0)">
      <circle cx="0" cy="50" r="8" fill="#10b981" filter="drop-shadow(0 0 6px #10b981)"/>
      <line x1="0" y1="50" x2="0" y2="0" stroke="#10b981" stroke-width="2"/>
      <text x="0" y="-15" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#10b981" text-anchor="middle" font-weight="bold">UTC standard</text>
      <text x="0" y="80" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">1972</text>
    </g>

    <!-- 1980s: IANA tz database -->
    <g transform="translate(580, 0)">
      <circle cx="0" cy="50" r="8" fill="#ec4899" filter="drop-shadow(0 0 6px #ec4899)"/>
      <line x1="0" y1="50" x2="0" y2="0" stroke="#ec4899" stroke-width="2"/>
      <text x="0" y="-15" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#ec4899" text-anchor="middle" font-weight="bold">IANA db Created</text>
      <text x="0" y="80" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">1986</text>
    </g>
  </g>
</svg>
