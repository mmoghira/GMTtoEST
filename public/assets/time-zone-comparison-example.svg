
  <svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="diagBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06151f"/>
        <stop offset="100%" stop-color="#0c354a"/>
      </linearGradient>
    </defs>

    <rect width="800" height="450" fill="url(#diagBg)"/>

    <text x="40" y="44" fill="#36c7b5" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">GLOBAL SYNCHRONIZATION</text>
    <text x="40" y="74" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800">One Instant Across London, New York &amp; Tokyo</text>

    <!-- Central Instant Beam -->
    <rect x="40" y="105" width="720" height="50" rx="8" fill="#12455d" stroke="#1e5f80" stroke-width="1.5"/>
    <text x="60" y="136" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Target Universal Instant:</text>
    <text x="220" y="136" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="15" font-weight="700">Monday, October 26, 2026 at 14:30:00 UTC</text>

    <!-- 3 Conversion Nodes connected vertically -->
    <g transform="translate(40, 180)">
      
      <!-- Node 1: New York -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="225" height="175" rx="12" fill="#082030" stroke="#3b82f6" stroke-width="2"/>
        <text x="20" y="32" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="800">NORTH AMERICA</text>
        <text x="20" y="60" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800">New York</text>
        <text x="20" y="80" fill="#bdd2dc" font-family="monospace" font-size="12">America/New_York</text>
        
        <text x="20" y="115" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="22" font-weight="800">10:30 AM</text>
        <text x="20" y="138" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Mon, Oct 26, 2026</text>
        <text x="20" y="158" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="12" font-weight="700">UTC−04:00 (EDT active)</text>
      </g>

      <!-- Connecting Arrow 1 to 2 -->
      <path d="M 235,88 L 255,88" stroke="#36c7b5" stroke-width="3"/>
      <polygon points="255,88 247,83 247,93" fill="#36c7b5"/>

      <!-- Node 2: London -->
      <g transform="translate(265, 0)">
        <rect x="0" y="0" width="225" height="175" rx="12" fill="#082030" stroke="#36c7b5" stroke-width="2"/>
        <text x="20" y="32" fill="#8fd7ff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">EUROPE</text>
        <text x="20" y="60" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800">London</text>
        <text x="20" y="80" fill="#bdd2dc" font-family="monospace" font-size="12">Europe/London</text>
        
        <text x="20" y="115" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="22" font-weight="800">2:30 PM</text>
        <text x="20" y="138" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Mon, Oct 26, 2026</text>
        <text x="20" y="158" fill="#36c7b5" font-family="system-ui, sans-serif" font-size="12" font-weight="700">UTC+00:00 (GMT active)</text>
      </g>

      <!-- Connecting Arrow 2 to 3 -->
      <path d="M 500,88 L 520,88" stroke="#36c7b5" stroke-width="3"/>
      <polygon points="520,88 512,83 512,93" fill="#36c7b5"/>

      <!-- Node 3: Tokyo -->
      <g transform="translate(530, 0)">
        <rect x="0" y="0" width="190" height="175" rx="12" fill="#082030" stroke="#a855f7" stroke-width="2"/>
        <text x="20" y="32" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="12" font-weight="800">ASIA</text>
        <text x="20" y="60" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800">Tokyo</text>
        <text x="20" y="80" fill="#bdd2dc" font-family="monospace" font-size="12">Asia/Tokyo</text>
        
        <text x="20" y="115" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="22" font-weight="800">11:30 PM</text>
        <text x="20" y="138" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Mon, Oct 26, 2026</text>
        <text x="20" y="158" fill="#a855f7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">UTC+09:00 (JST - no DST)</text>
      </g>
    </g>

    <!-- Bottom Caption Box -->
    <rect x="40" y="375" width="720" height="50" rx="8" fill="#12455d" stroke="#1e5f80" stroke-width="1"/>
    <text x="60" y="405" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="13">One instant, shown in three zones — the difference depends on the date.</text>
  </svg>
  