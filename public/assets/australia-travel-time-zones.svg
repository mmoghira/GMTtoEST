
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="40" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">Perth to Sydney Travel Time Shift</text>
  
  <!-- Map Representation of Australia (Abstract Vector) -->
  <path d="M 180,180 Q 220,130 300,140 T 420,130 T 520,150 T 600,200 T 560,300 T 480,310 T 360,320 T 260,300 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Perth Node -->
  <circle cx="210" cy="240" r="8" fill="#f59e0b" filter="drop-shadow(0 0 8px #f59e0b)"/>
  <text x="210" y="270" font-family="'Manrope', sans-serif" font-size="12" font-weight="bold" fill="#f59e0b" text-anchor="middle">Perth (AWST, UTC+8)</text>
  
  <!-- Sydney Node -->
  <circle cx="530" cy="250" r="8" fill="#10b981" filter="drop-shadow(0 0 8px #10b981)"/>
  <text x="530" y="280" font-family="'Manrope', sans-serif" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">Sydney (AEST, UTC+10)</text>
  
  <!-- Flight Path -->
  <path d="M 210,240 Q 370,160 530,250" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8,5" filter="drop-shadow(0 0 4px #38bdf8)"/>
  
  <!-- Airplane Icon -->
  <g transform="translate(365, 195) rotate(10)">
    <path d="M0,-8 L2,-3 L8,-3 L8,-1 L2,-1 L4,3 L2,3 L0,0 L-2,3 L-4,3 L-2,-1 L-8,-1 L-8,-3 L-2,-3 Z" fill="#38bdf8"/>
  </g>
  
  <!-- Info Overlay -->
  <rect x="250" y="320" width="300" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="400" y="350" font-family="'Manrope', sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">
    Flight Duration: <tspan fill="#38bdf8" font-weight="bold">4.5 Hours</tspan> | Clock Shift: <tspan fill="#f59e0b" font-weight="bold">+2 Hours</tspan>
  </text>
</svg>
