
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="40" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#10b981" text-anchor="middle">Full-Stack Time Zone Workflow (UTC Storage)</text>
  
  <!-- Client Side -->
  <rect x="60" y="120" width="180" height="160" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="150" y="150" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">Client UI Layer</text>
  <text x="150" y="180" font-family="'Manrope', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">IANA Translation</text>
  <rect x="80" y="210" width="140" height="50" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="150" y="230" font-family="monospace" font-size="10" fill="#e2e8f0" text-anchor="middle">America/Toronto</text>
  <text x="150" y="245" font-family="monospace" font-size="10" fill="#e2e8f0" text-anchor="middle">Australia/Sydney</text>

  <!-- Flow Arrow 1 -->
  <line x1="250" y1="200" x2="310" y2="200" stroke="#10b981" stroke-width="3"/>
  <polygon points="310,195 320,200 310,205" fill="#10b981"/>
  
  <!-- API Server -->
  <rect x="330" y="120" width="180" height="160" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="420" y="150" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#10b981" text-anchor="middle">Application API</text>
  <text x="420" y="180" font-family="'Manrope', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Standardization</text>
  <rect x="350" y="210" width="140" height="50" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="420" y="230" font-family="monospace" font-size="10" fill="#10b981" text-anchor="middle">UTC Epoch / ISO 8601</text>
  <text x="420" y="245" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">YYYY-MM-DDTHH:mm:ssZ</text>

  <!-- Flow Arrow 2 -->
  <line x1="520" y1="200" x2="580" y2="200" stroke="#f59e0b" stroke-width="3"/>
  <polygon points="580,195 590,200 580,205" fill="#f59e0b"/>

  <!-- Database -->
  <rect x="600" y="120" width="140" height="160" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="670" y="150" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">Database</text>
  <!-- Cylinder lines for DB -->
  <path d="M 620,190 A 50,10 0 1 0 720,190" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <path d="M 620,210 A 50,10 0 1 0 720,210" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <rect x="620" y="230" width="100" height="30" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="670" y="248" font-family="'Manrope', sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">UTC Timestamps</text>
</svg>
