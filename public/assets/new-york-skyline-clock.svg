
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#090d16" rx="12"/>
  <text x="400" y="45" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="middle">New York Time System Reference</text>
  
  <!-- Stylized Skyline Silhouette -->
  <!-- Chrysler-like shape -->
  <path d="M 180,350 L 190,200 L 195,120 L 200,200 L 210,350 Z" fill="#1e293b"/>
  <!-- Empire-like shape -->
  <path d="M 280,350 L 290,180 L 295,90 L 300,180 L 310,350 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <!-- One WTC-like shape -->
  <path d="M 380,350 L 400,100 L 420,350 Z" fill="#1e293b"/>
  
  <!-- Base buildings -->
  <rect x="100" y="250" width="80" height="100" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="220" y="280" width="70" height="70" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="330" y="220" width="60" height="130" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="430" y="260" width="90" height="90" fill="#1e293b"/>
  
  <!-- Water Reflection base line -->
  <line x1="80" y1="350" x2="720" y2="350" stroke="#334155" stroke-width="3"/>
  <path d="M 80,360 C 180,365 300,355 450,362 C 550,358 650,365 720,360" fill="none" stroke="#1e293b" stroke-dasharray="8,4" stroke-width="1.5"/>

  <!-- Large Glowing Clock Face overlay -->
  <g transform="translate(600, 180)">
    <circle cx="0" cy="0" r="70" fill="#1e293b" stroke="#f59e0b" stroke-width="4" filter="drop-shadow(0 0 10px #f59e0b)"/>
    <circle cx="0" cy="0" r="5" fill="#e2e8f0"/>
    <line x1="0" y1="0" x2="0" y2="-45" stroke="#e2e8f0" stroke-width="3.5"/> <!-- Hour hand -->
    <line x1="0" y1="0" x2="35" y2="25" stroke="#f59e0b" stroke-width="2"/> <!-- Minute hand -->
    <text x="0" y="95" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">Eastern Time (ET)</text>
    <text x="0" y="115" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">EST (UTC-5) / EDT (UTC-4)</text>
  </g>
</svg>
