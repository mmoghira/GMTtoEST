<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="auto" style="display: block; margin: 0 auto;">
        <rect width="800" height="240" fill="#0f172a" rx="8" />
        <text x="400" y="30" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="14" fill="#8fd7ff" text-anchor="middle">24-Hour Military Clock Alignment</text>
        
        <g transform="translate(400, 130)">
          <!-- Outer circle -->
          <circle cx="0" cy="0" r="75" fill="#12455d" stroke="#8fd7ff" stroke-width="4" />
          
          <!-- Inner circle (standard 12 hours) -->
          <circle cx="0" cy="0" r="50" fill="#1b536e" opacity="0.6" stroke="#36c7b5" stroke-width="2" />
          
          <!-- Clock Hands indicating 15:00 (3:00 PM) -->
          <line x1="0" y1="0" x2="35" y2="0" stroke="#e11d48" stroke-width="4" stroke-linecap="round" />
          <line x1="0" y1="0" x2="0" y2="-55" stroke="#8fd7ff" stroke-width="2" stroke-linecap="round" />
          
          <!-- Inner labels for standard hours -->
          <text x="0" y="-35" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="8" fill="#36c7b5" text-anchor="middle">12</text>
          <text x="35" y="3" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="8" fill="#36c7b5" text-anchor="middle">3</text>
          <text x="0" y="40" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="8" fill="#36c7b5" text-anchor="middle">6</text>
          <text x="-35" y="3" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="8" fill="#36c7b5" text-anchor="middle">9</text>
          
          <!-- Outer labels for military hours -->
          <text x="0" y="-62" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="8" fill="#8fd7ff" text-anchor="middle">24 / 00</text>
          <text x="62" y="3" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="8" fill="#8fd7ff" text-anchor="middle">15</text>
          <text x="0" y="68" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="8" fill="#8fd7ff" text-anchor="middle">18</text>
          <text x="-62" y="3" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="8" fill="#8fd7ff" text-anchor="middle">21</text>
        </g>
      </svg>