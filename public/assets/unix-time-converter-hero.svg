<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06151f"/>
      <stop offset="50%" stop-color="#0c354a"/>
      <stop offset="100%" stop-color="#12455d"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(18, 69, 93, 0.95)"/>
      <stop offset="100%" stop-color="rgba(12, 53, 74, 0.95)"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#36c7b5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06151f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="540" fill="url(#heroBg)"/>
  <circle cx="480" cy="270" r="420" fill="url(#centerGlow)"/>

  <!-- Background Data Grid Accent -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="80" y1="80" x2="880" y2="80"/>
    <line x1="80" y1="160" x2="880" y2="160"/>
    <line x1="80" y1="460" x2="880" y2="460"/>
  </g>

  <!-- Header Title -->
  <g transform="translate(80, 42)">
    <rect x="0" y="0" width="220" height="30" rx="15" fill="rgba(54, 199, 181, 0.15)" stroke="#36c7b5" stroke-width="1.5"/>
    <text x="18" y="20" fill="#36c7b5" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">TIME UTILITY &amp; EPOCH</text>
    <text x="0" y="70" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="800">Unix Time Converter</text>
    <text x="0" y="98" fill="#bdd2dc" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="600">Two-Way Conversion: Epoch Seconds &amp; Milliseconds to Human Dates</text>
  </g>

  <!-- Central Conversion Flow Container -->
  <g transform="translate(80, 160)">
    
    <!-- Left Box: Epoch Input -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="360" height="300" rx="16" fill="url(#cardGrad)" stroke="#1e5f80" stroke-width="2"/>
      
      <rect x="24" y="24" width="130" height="26" rx="6" fill="#082030" stroke="#36c7b5" stroke-width="1"/>
      <text x="89" y="41" fill="#36c7b5" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" text-anchor="middle">UNIX TIMESTAMP</text>

      <text x="24" y="95" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">EPOCH SECONDS (10 DIGITS)</text>
      <rect x="24" y="108" width="312" height="60" rx="10" fill="#06151f" stroke="#36c7b5" stroke-width="2"/>
      <text x="44" y="148" fill="#36c7b5" font-family="'Space Grotesk', monospace" font-size="28" font-weight="900" letter-spacing="2">1767225600</text>

      <g transform="translate(24, 195)">
        <circle cx="8" cy="8" r="6" fill="#38bdf8"/>
        <text x="24" y="12" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="12">Seconds since 1 January 1970 UTC</text>
        
        <circle cx="8" cy="38" r="6" fill="#fbbf24"/>
        <text x="24" y="42" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="12">Milliseconds: 1767225600000 ms</text>

        <circle cx="8" cy="68" r="6" fill="#34d399"/>
        <text x="24" y="72" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="12">One universal moment in time</text>
      </g>
    </g>

    <!-- Center Arrow -->
    <g transform="translate(375, 125)">
      <circle cx="25" cy="25" r="24" fill="#082030" stroke="#36c7b5" stroke-width="2"/>
      <path d="M 18,25 L 32,25 M 26,19 L 32,25 L 26,31" stroke="#36c7b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Right Box: 3 Converted Displays -->
    <g transform="translate(440, 0)">
      <rect x="0" y="0" width="360" height="300" rx="16" fill="url(#cardGrad)" stroke="#1e5f80" stroke-width="2"/>

      <rect x="24" y="24" width="140" height="26" rx="6" fill="#082030" stroke="#38bdf8" stroke-width="1"/>
      <text x="94" y="41" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" text-anchor="middle">HUMAN READABLE</text>

      <!-- Row 1: UTC -->
      <g transform="translate(24, 70)">
        <rect x="0" y="0" width="312" height="62" rx="8" fill="#06151f" stroke="#12455d" stroke-width="1"/>
        <text x="14" y="22" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800">1. UTC DATE &amp; TIME</text>
        <text x="14" y="46" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="15" font-weight="800">1 Jan 2026, 00:00:00 UTC</text>
      </g>

      <!-- Row 2: Local Time -->
      <g transform="translate(24, 142)">
        <rect x="0" y="0" width="312" height="62" rx="8" fill="#06151f" stroke="#12455d" stroke-width="1"/>
        <text x="14" y="22" fill="#34d399" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800">2. VISITOR'S LOCAL TIME</text>
        <text x="14" y="46" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="15" font-weight="800">Synchronized Local Timezone</text>
      </g>

      <!-- Row 3: Eastern Time -->
      <g transform="translate(24, 214)">
        <rect x="0" y="0" width="312" height="62" rx="8" fill="#06151f" stroke="#12455d" stroke-width="1"/>
        <text x="14" y="22" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800">3. EASTERN TIME (AMERICA/NEW_YORK)</text>
        <text x="14" y="46" fill="#fbbf24" font-family="'Space Grotesk', monospace" font-size="15" font-weight="800">31 Dec 2025, 19:00:00 EST</text>
      </g>
    </g>

  </g>
</svg>