
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="40" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#f59e0b" text-anchor="middle">Travel Itinerary Timezone Transitions</text>
  
  <g transform="translate(100, 100)">
    <!-- Ticket Card -->
    <rect width="600" height="180" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    
    <!-- Departure -->
    <g transform="translate(50, 40)">
      <text x="0" y="20" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#94a3b8">DEPART</text>
      <text x="0" y="50" font-family="'Space Grotesk', sans-serif" font-size="24" fill="#e2e8f0" font-weight="bold">LAX (Los Angeles)</text>
      <text x="0" y="80" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#f59e0b" font-weight="bold">08:00 AM PDT (UTC-7)</text>
    </g>

    <!-- Flight arrow -->
    <g transform="translate(260, 80)">
      <line x1="0" y1="0" x2="80" y2="0" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,2"/>
      <polygon points="70,-5 85,0 70,5" fill="#38bdf8"/>
      <text x="40" y="-15" font-family="'Manrope', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">10 Hour Flight</text>
    </g>

    <!-- Arrival -->
    <g transform="translate(370, 40)">
      <text x="0" y="20" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#94a3b8">ARRIVE</text>
      <text x="0" y="50" font-family="'Space Grotesk', sans-serif" font-size="24" fill="#e2e8f0" font-weight="bold">LHR (London)</text>
      <text x="0" y="80" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#10b981" font-weight="bold">04:00 AM BST (UTC+1)</text>
    </g>
  </g>
  
  <text x="400" y="320" font-family="'Manrope', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Cross-continental travel planners must track standard and daylight abbreviations to confirm correct local times.
  </text>
</svg>
