
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="45" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="middle">Time Zone Abbreviations System</text>
  
  <!-- Central Globe Icon -->
  <circle cx="400" cy="230" r="80" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <path d="M 320,230 Q 400,180 480,230" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 320,230 Q 400,280 480,230" fill="none" stroke="#475569" stroke-width="2"/>
  <line x1="400" y1="150" x2="400" y2="310" stroke="#475569" stroke-width="2"/>
  
  <!-- Floating Acronym Tags -->
  <!-- EST -->
  <g transform="translate(240, 150)">
    <rect x="-40" y="-15" width="80" height="30" rx="6" fill="#f59e0b" filter="drop-shadow(0 0 6px #f59e0b)"/>
    <text x="0" y="5" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">EST (-5)</text>
  </g>
  <!-- GMT -->
  <g transform="translate(400, 110)">
    <rect x="-40" y="-15" width="80" height="30" rx="6" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)"/>
    <text x="0" y="5" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">GMT (0)</text>
  </g>
  <!-- IST -->
  <g transform="translate(560, 160)">
    <rect x="-45" y="-15" width="90" height="30" rx="6" fill="#10b981" filter="drop-shadow(0 0 6px #10b981)"/>
    <text x="0" y="5" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">IST (+5:30)</text>
  </g>
  <!-- CET -->
  <g transform="translate(530, 280)">
    <rect x="-40" y="-15" width="80" height="30" rx="6" fill="#ec4899" filter="drop-shadow(0 0 6px #ec4899)"/>
    <text x="0" y="5" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">CET (+1)</text>
  </g>
  <!-- PST -->
  <g transform="translate(250, 290)">
    <rect x="-40" y="-15" width="80" height="30" rx="6" fill="#a855f7" filter="drop-shadow(0 0 6px #a855f7)"/>
    <text x="0" y="5" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">PST (-8)</text>
  </g>
  <!-- AEST -->
  <g transform="translate(400, 350)">
    <rect x="-45" y="-15" width="90" height="30" rx="6" fill="#e11d48" filter="drop-shadow(0 0 6px #e11d48)"/>
    <text x="0" y="5" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">AEST (+10)</text>
  </g>
  
  <text x="400" y="405" font-family="'Manrope', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Standardized acronyms represent specific regional offsets from Coordinated Universal Time (UTC) for civil administration.
  </text>
</svg>
