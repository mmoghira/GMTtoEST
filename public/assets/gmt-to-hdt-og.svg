<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26" />
      <stop offset="100%" stop-color="#0f3c52" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36c7b5" />
      <stop offset="100%" stop-color="#8fd7ff" />
    </linearGradient>
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0c354a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <path d="M-100 500 C 300 600, 500 300, 900 550 C 1100 650, 1200 500, 1300 550 L1300 680 L-100 680 Z" fill="#0b2a3a" opacity="0.4" />
  <path d="M-100 530 C 400 580, 600 350, 1000 520 C 1150 580, 1200 480, 1300 510 L1300 680 L-100 680 Z" fill="url(#accentGrad)" opacity="0.1" />

  <!-- Header Branding -->
  <g transform="translate(80, 70)">
    <rect width="56" height="56" rx="12" fill="url(#accentGrad)" />
    <circle cx="28" cy="28" r="18" fill="none" stroke="#071b26" stroke-width="3.5" />
    <path d="M28 14 L28 28 L38 28" fill="none" stroke="#071b26" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="76" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="bold" fill="#f4fbff">GMT to EST Converter</text>
  </g>

  <!-- Main Content Layout -->
  <g transform="translate(80, 200)">
    <rect width="180" height="34" rx="17" fill="#1b536e" />
    <text x="90" y="22" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="800" fill="#36c7b5" text-anchor="middle" letter-spacing="1.5">STANDALONE TOOL</text>
    
    <text x="0" y="100" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="bold" fill="#f4fbff">GMT to HDT</text>
    <text x="0" y="170" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="bold" fill="url(#accentGrad)">Converter</text>
    
    <text x="0" y="235" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="500" fill="#bdd2dc">
      Convert Greenwich Mean Time (UTC+0) to Hawaii-Aleutian Daylight Time (UTC−9).
    </text>
    <text x="0" y="270" font-family="'Manrope', system-ui, sans-serif" font-size="18" font-weight="500" fill="#8cb1c4">
      Instant 9-hour offset calculations, previous-day calendar date rollover support,
    </text>
    <text x="0" y="300" font-family="'Manrope', system-ui, sans-serif" font-size="18" font-weight="500" fill="#8cb1c4">
      24-hour schedules, HDT vs HST guides, and Aleutian meeting planners.
    </text>

    <g transform="translate(0, 340)">
      <g transform="translate(0, 0)">
        <circle cx="15" cy="15" r="15" fill="#1b536e" />
        <path d="M10 15 L14 19 L21 11" fill="none" stroke="#36c7b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="40" y="22" font-family="'Manrope', system-ui, sans-serif" font-size="16" font-weight="700" fill="#f4fbff">GMT UTC+0</text>
      </g>
      <g transform="translate(160, 0)">
        <circle cx="15" cy="15" r="15" fill="#1b536e" />
        <path d="M10 15 L14 19 L21 11" fill="none" stroke="#36c7b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="40" y="22" font-family="'Manrope', system-ui, sans-serif" font-size="16" font-weight="700" fill="#f4fbff">HDT UTC−9</text>
      </g>
      <g transform="translate(300, 0)">
        <circle cx="15" cy="15" r="15" fill="#1b536e" />
        <path d="M10 15 L14 19 L21 11" fill="none" stroke="#36c7b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="40" y="22" font-family="'Manrope', system-ui, sans-serif" font-size="16" font-weight="700" fill="#f4fbff">−9 Hour Offset</text>
      </g>
    </g>
  </g>

  <!-- Right Side Visual -->
  <g transform="translate(850, 310)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="120" fill="url(#clockGrad)" stroke="#1c5773" stroke-width="4" />
    <circle cx="0" cy="0" r="105" fill="none" stroke="#256e91" stroke-width="1.5" stroke-dasharray="4 8" />
    <text x="0" y="-30" font-family="'Space Grotesk', system-ui, sans-serif" font-size="32" font-weight="bold" fill="#36c7b5" text-anchor="middle">GMT → HDT</text>
    <text x="0" y="15" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="bold" fill="#f4fbff" text-anchor="middle">−9 Hours</text>
    <text x="0" y="50" font-family="'Manrope', system-ui, sans-serif" font-size="16" font-weight="600" fill="#bdd2dc" text-anchor="middle">UTC+0 to UTC−9</text>
  </g>
</svg>
