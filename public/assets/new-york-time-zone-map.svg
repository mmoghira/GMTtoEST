
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="40" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">North American Eastern Time Zone Map</text>
  
  <!-- US East Coast outline map representation -->
  <path d="M 200,80 L 250,80 L 300,100 L 350,90 L 400,120 L 450,110 L 500,130 L 550,120 L 580,150 L 560,180 L 580,210 L 540,240 L 560,280 L 520,320 L 540,360 L 500,420 L 480,440 L 450,440 L 450,400 L 470,350 L 430,300 L 410,250 L 380,240 L 350,200 L 300,200 L 250,150 L 200,130 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Highlights for New York State / City -->
  <!-- NY State outline (approximate) -->
  <path d="M 480,140 L 540,130 L 560,150 L 540,170 L 500,170 L 480,150 Z" fill="#38bdf8" opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="535" cy="165" r="6" fill="#ef4444" filter="drop-shadow(0 0 6px #ef4444)"/>
  <text x="545" y="170" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#ef4444">New York City</text>
  
  <!-- Legend panel -->
  <rect x="60" y="320" width="280" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="80" y="345" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">Eastern Time Zone (ET)</text>
  <text x="80" y="370" font-family="'Manrope', sans-serif" font-size="11" fill="#e2e8f0">Winter Standard: EST (UTC-5)</text>
  <text x="80" y="390" font-family="'Manrope', sans-serif" font-size="11" fill="#f59e0b">Summer Daylight: EDT (UTC-4)</text>
  <text x="80" y="410" font-family="'Manrope', sans-serif" font-size="10" fill="#94a3b8">Borders: Atlantic Coast to Great Lakes</text>
</svg>
