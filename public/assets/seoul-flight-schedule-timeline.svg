<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Flight schedule timeline between Seoul and New York</title>
  <desc id="desc">A custom timeline illustration for travel and flight planning from Seoul to Eastern Time with departure, connection, arrival, and hotel check-in cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#061721"/>
      <stop offset="0.55" stop-color="#103a53"/>
      <stop offset="1" stop-color="#0d4a45"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#36c7b5"/>
      <stop offset="0.5" stop-color="#8fd7ff"/>
      <stop offset="1" stop-color="#f3b34f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="140" cy="118" r="54" fill="#36c7b5" opacity="0.18"/>
  <circle cx="1042" cy="146" r="72" fill="#f3b34f" opacity="0.18"/>
  <path d="M118 354 C315 220 501 230 647 350 C776 456 944 474 1084 344" fill="none" stroke="url(#line)" stroke-width="10" stroke-linecap="round"/>
  <path d="M118 354 C315 220 501 230 647 350 C776 456 944 474 1084 344" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="9 18" stroke-linecap="round" opacity="0.75"/>
  <g transform="translate(560 300) rotate(20)">
    <path d="M0 18 L118 0 L104 26 L118 52 Z" fill="#ffffff"/>
    <path d="M22 20 L-48 -14 L-38 18 L-48 50 Z" fill="#8fd7ff"/>
    <rect x="-4" y="14" width="78" height="12" rx="6" fill="#d7eef8"/>
  </g>
  <g transform="translate(62 424)">
    <rect width="232" height="126" rx="10" fill="#0a2433" stroke="#36c7b5"/>
    <text x="20" y="36" fill="#8ff5e6" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800">Depart Seoul</text>
    <text x="20" y="74" fill="#ffffff" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="700">23:40 KST</text>
    <text x="20" y="102" fill="#bdd2dc" font-family="Manrope, Arial, sans-serif" font-size="16">Airport time stays local</text>
  </g>
  <g transform="translate(338 112)">
    <rect width="232" height="126" rx="10" fill="#0a2433" stroke="#8fd7ff"/>
    <text x="20" y="36" fill="#8fd7ff" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800">Calendar check</text>
    <text x="20" y="74" fill="#ffffff" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="700">Previous ET</text>
    <text x="20" y="102" fill="#bdd2dc" font-family="Manrope, Arial, sans-serif" font-size="16">Many KST times back up a day</text>
  </g>
  <g transform="translate(654 456)">
    <rect width="232" height="126" rx="10" fill="#0a2433" stroke="#f3b34f"/>
    <text x="20" y="36" fill="#ffd996" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800">Arrive East Coast</text>
    <text x="20" y="74" fill="#ffffff" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="700">ET label</text>
    <text x="20" y="102" fill="#bdd2dc" font-family="Manrope, Arial, sans-serif" font-size="16">Could be EST or EDT</text>
  </g>
  <g transform="translate(906 232)">
    <rect width="232" height="126" rx="10" fill="#0a2433" stroke="#36c7b5"/>
    <text x="20" y="36" fill="#8ff5e6" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800">Hotel pickup</text>
    <text x="20" y="74" fill="#ffffff" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="700">Copy both</text>
    <text x="20" y="102" fill="#bdd2dc" font-family="Manrope, Arial, sans-serif" font-size="16">Date plus city prevents errors</text>
  </g>
  <g transform="translate(106 126)">
    <rect width="230" height="92" rx="8" fill="#10344a" stroke="#2f7584"/>
    <text x="20" y="36" fill="#ffffff" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800">ICN to JFK planning</text>
    <text x="20" y="65" fill="#bdd2dc" font-family="Manrope, Arial, sans-serif" font-size="16">Use local airport times, then convert messages.</text>
  </g>
  <g transform="translate(424 620)">
    <rect width="352" height="56" rx="28" fill="#07131f" opacity="0.78" stroke="#8fd7ff"/>
    <text x="32" y="36" fill="#dff8ff" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800">Flight pages show local time; coordination notes need both zones.</text>
  </g>
</svg>
