<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="diagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06151f"/>
      <stop offset="100%" stop-color="#0c354a"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12455d"/>
      <stop offset="100%" stop-color="#082030"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#diagBg)"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="160" height="24" rx="12" fill="rgba(54, 199, 181, 0.15)" stroke="#36c7b5" stroke-width="1.2"/>
    <text x="14" y="16" fill="#36c7b5" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" letter-spacing="1">WORKED EXAMPLE</text>
    <text x="0" y="60" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="800">ISO Week 39 of 2026: Complete Span</text>
    <text x="0" y="86" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Monday, 21 September 2026 — Sunday, 27 September 2026</text>
  </g>

  <!-- 7 Day Cards Row -->
  <g transform="translate(40, 142)">
    
    <!-- Day 1: Mon 21 (Start) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="94" height="150" rx="10" fill="url(#boxGrad)" stroke="#36c7b5" stroke-width="2"/>
      <rect x="0" y="0" width="94" height="34" rx="10" fill="#36c7b5"/>
      <text x="47" y="22" fill="#06151f" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="900" text-anchor="middle">MON</text>
      <text x="47" y="78" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="900" text-anchor="middle">21</text>
      <text x="47" y="102" fill="#36c7b5" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SEP</text>
      <rect x="10" y="118" width="74" height="20" rx="4" fill="#06151f"/>
      <text x="47" y="132" fill="#36c7b5" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">START</text>
    </g>

    <!-- Day 2: Tue 22 (Selected Example) -->
    <g transform="translate(104, 0)">
      <rect x="0" y="0" width="94" height="150" rx="10" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
      <rect x="0" y="0" width="94" height="34" rx="10" fill="#f59e0b"/>
      <text x="47" y="22" fill="#06151f" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="900" text-anchor="middle">TUE</text>
      <text x="47" y="78" fill="#06151f" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="900" text-anchor="middle">22</text>
      <text x="47" y="102" fill="#06151f" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">SEP</text>
      <rect x="8" y="118" width="78" height="20" rx="4" fill="#06151f"/>
      <text x="47" y="132" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">SELECTED</text>
    </g>

    <!-- Day 3: Wed 23 -->
    <g transform="translate(208, 0)">
      <rect x="0" y="0" width="94" height="150" rx="10" fill="url(#boxGrad)" stroke="#1e5f80" stroke-width="1.5"/>
      <rect x="0" y="0" width="94" height="34" rx="10" fill="#12455d"/>
      <text x="47" y="22" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" text-anchor="middle">WED</text>
      <text x="47" y="78" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="800" text-anchor="middle">23</text>
      <text x="47" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">SEP</text>
      <text x="47" y="132" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">DAY +1</text>
    </g>

    <!-- Day 4: Thu 24 (Determining Thursday) -->
    <g transform="translate(312, 0)">
      <rect x="0" y="0" width="94" height="150" rx="10" fill="url(#boxGrad)" stroke="#fbbf24" stroke-width="1.5"/>
      <rect x="0" y="0" width="94" height="34" rx="10" fill="#12455d"/>
      <text x="47" y="22" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" text-anchor="middle">THU</text>
      <text x="47" y="78" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="800" text-anchor="middle">24</text>
      <text x="47" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">SEP</text>
      <rect x="10" y="118" width="74" height="20" rx="4" fill="rgba(245, 158, 11, 0.15)"/>
      <text x="47" y="132" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">ISO ANCHOR</text>
    </g>

    <!-- Day 5: Fri 25 -->
    <g transform="translate(416, 0)">
      <rect x="0" y="0" width="94" height="150" rx="10" fill="url(#boxGrad)" stroke="#1e5f80" stroke-width="1.5"/>
      <rect x="0" y="0" width="94" height="34" rx="10" fill="#12455d"/>
      <text x="47" y="22" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" text-anchor="middle">FRI</text>
      <text x="47" y="78" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="800" text-anchor="middle">25</text>
      <text x="47" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">SEP</text>
      <text x="47" y="132" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">DAY +3</text>
    </g>

    <!-- Day 6: Sat 26 -->
    <g transform="translate(520, 0)">
      <rect x="0" y="0" width="94" height="150" rx="10" fill="url(#boxGrad)" stroke="#1e5f80" stroke-width="1.5"/>
      <rect x="0" y="0" width="94" height="34" rx="10" fill="#12455d"/>
      <text x="47" y="22" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" text-anchor="middle">SAT</text>
      <text x="47" y="78" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="800" text-anchor="middle">26</text>
      <text x="47" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">SEP</text>
      <text x="47" y="132" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">DAY +4</text>
    </g>

    <!-- Day 7: Sun 27 (End) -->
    <g transform="translate(624, 0)">
      <rect x="0" y="0" width="94" height="150" rx="10" fill="url(#boxGrad)" stroke="#ef4444" stroke-width="2"/>
      <rect x="0" y="0" width="94" height="34" rx="10" fill="#ef4444"/>
      <text x="47" y="22" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="900" text-anchor="middle">SUN</text>
      <text x="47" y="78" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="900" text-anchor="middle">27</text>
      <text x="47" y="102" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SEP</text>
      <rect x="10" y="118" width="74" height="20" rx="4" fill="#06151f"/>
      <text x="47" y="132" fill="#f87171" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">END</text>
    </g>
  </g>

  <!-- Explanation Banner Below Cards -->
  <g transform="translate(40, 318)">
    <rect x="0" y="0" width="720" height="96" rx="10" fill="#082030" stroke="#1e5f80" stroke-width="1.5"/>
    
    <g transform="translate(20, 18)">
      <circle cx="10" cy="10" r="10" fill="#fbbf24"/>
      <text x="10" y="14" fill="#06151f" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">i</text>
      <text x="30" y="15" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800">5 Days Remaining Calculation Breakdown:</text>
      <text x="30" y="38" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="13">
        From Tuesday 22 Sep, there are 5 days remaining in the week: Wednesday 23, Thursday 24, Friday 25, Saturday 26, and Sunday 27.
      </text>
      <text x="30" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
        The selected date itself is not counted as remaining. On Sunday 27 Sep, exactly 0 days remain after today.
      </text>
    </g>
  </g>
</svg>