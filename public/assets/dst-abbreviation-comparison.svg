
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="40" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">Daylight Saving vs Standard Time Acronyms</text>
  
  <g transform="translate(80, 80)">
    <!-- Column Headers -->
    <rect width="640" height="40" fill="#1e293b" rx="4"/>
    <text x="40" y="25" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">Standard Time (Winter)</text>
    <text x="320" y="25" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">Transition (+1h)</text>
    <text x="500" y="25" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">Daylight Time (Summer)</text>
    
    <!-- Row 1: EST to EDT -->
    <g transform="translate(0, 50)">
      <text x="40" y="25" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#e2e8f0" font-weight="bold">EST (UTC-5)</text>
      <line x1="200" y1="20" x2="450" y2="20" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
      <polygon points="440,15 455,20 440,25" fill="#f59e0b"/>
      <text x="500" y="25" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#f59e0b" font-weight="bold">EDT (UTC-4)</text>
      <line x1="0" y1="40" x2="640" y2="40" stroke="#334155" stroke-width="1"/>
    </g>

    <!-- Row 2: GMT to BST -->
    <g transform="translate(0, 110)">
      <text x="40" y="25" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#e2e8f0" font-weight="bold">GMT (UTC+0)</text>
      <line x1="200" y1="20" x2="450" y2="20" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2"/>
      <polygon points="440,15 455,20 440,25" fill="#10b981"/>
      <text x="500" y="25" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#10b981" font-weight="bold">BST (UTC+1)</text>
      <line x1="0" y1="40" x2="640" y2="40" stroke="#334155" stroke-width="1"/>
    </g>

    <!-- Row 3: CET to CEST -->
    <g transform="translate(0, 170)">
      <text x="40" y="25" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#e2e8f0" font-weight="bold">CET (UTC+1)</text>
      <line x1="200" y1="20" x2="450" y2="20" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2"/>
      <polygon points="440,15 455,20 440,25" fill="#38bdf8"/>
      <text x="500" y="25" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#38bdf8" font-weight="bold">CEST (UTC+2)</text>
      <line x1="0" y1="40" x2="640" y2="40" stroke="#334155" stroke-width="1"/>
    </g>

    <!-- Row 4: AEST to AEDT -->
    <g transform="translate(0, 230)">
      <text x="40" y="25" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#e2e8f0" font-weight="bold">AEST (UTC+10)</text>
      <line x1="200" y1="20" x2="450" y2="20" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,2"/>
      <polygon points="440,15 455,20 440,25" fill="#ec4899"/>
      <text x="500" y="25" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#ec4899" font-weight="bold">AEDT (UTC+11)</text>
    </g>
  </g>
</svg>
