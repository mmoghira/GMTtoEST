
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="40" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#10b981" text-anchor="middle">Developers Timezone Reference Pipeline</text>
  
  <g transform="translate(100, 120)">
    <!-- UTC Store -->
    <rect width="160" height="140" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="30" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">Database Storage</text>
    <rect x="15" y="70" width="130" height="40" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="80" y="94" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">"UTC / ISO 8601"</text>
    
    <!-- Arrow 1 -->
    <g transform="translate(160, 70)">
      <line x1="10" y1="0" x2="100" y2="0" stroke="#10b981" stroke-width="3"/>
      <polygon points="90,-5 105,0 90,5" fill="#10b981"/>
    </g>

    <!-- UI Parse (Est) -->
    <rect x="280" y="0" width="160" height="140" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="360" y="30" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">Client: US East</text>
    <rect x="295" y="70" width="130" height="40" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="360" y="94" font-family="monospace" font-size="11" fill="#f59e0b" text-anchor="middle">"America/New_York"</text>
    <text x="360" y="130" font-family="'Manrope', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Formats to EST / EDT</text>
    
    <!-- Arrow 2 -->
    <g transform="translate(440, 70)">
      <line x1="10" y1="0" x2="100" y2="0" stroke="#10b981" stroke-width="3"/>
      <polygon points="90,-5 105,0 90,5" fill="#10b981"/>
    </g>

    <!-- UI Parse (Ist) -->
    <rect x="460" y="0" width="160" height="140" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="540" y="30" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#10b981" text-anchor="middle">Client: India</text>
    <rect x="475" y="70" width="130" height="40" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="540" y="94" font-family="monospace" font-size="11" fill="#10b981" text-anchor="middle">"Asia/Kolkata"</text>
    <text x="540" y="130" font-family="'Manrope', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Formats to IST</text>
  </g>
</svg>
