
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="40" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#10b981" text-anchor="middle">Why India Uses a Single Time Zone</text>
  
  <!-- Left Panel: Geographic Solar Span -->
  <g transform="translate(40, 80)">
    <rect width="330" height="320" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="165" y="30" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#ef4444" text-anchor="middle">Geographic Solar Deviation</text>
    <circle cx="165" cy="140" r="50" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <path d="M 165,140 L 135,115" stroke="#ef4444" stroke-width="3"/>
    <path d="M 165,140 L 205,140" stroke="#e2e8f0" stroke-width="3"/>
    
    <text x="165" y="220" font-family="'Manrope', sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">East-to-West Solar Shift: <tspan fill="#ef4444" font-weight="bold">~2 Hours</tspan></text>
    <text x="165" y="245" font-family="'Manrope', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Dong (East) Sunrise: ~04:15 AM</text>
    <text x="165" y="265" font-family="'Manrope', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Dwarka (West) Sunrise: ~06:00 AM</text>
  </g>
  
  <!-- Right Panel: Administrative Advantage -->
  <g transform="translate(430, 80)">
    <rect width="330" height="320" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="165" y="30" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#10b981" text-anchor="middle">Administrative Uniformity</text>
    <circle cx="165" cy="140" r="50" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <path d="M 165,140 L 165,95" stroke="#10b981" stroke-width="3"/>
    <path d="M 165,140 L 195,140" stroke="#10b981" stroke-width="3"/>
    
    <text x="165" y="220" font-family="'Manrope', sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Unified Clock Benefits</text>
    <text x="30" y="245" font-family="'Manrope', sans-serif" font-size="11" fill="#94a3b8">✓ Prevents railway scheduling collisions</text>
    <text x="30" y="265" font-family="'Manrope', sans-serif" font-size="11" fill="#94a3b8">✓ Simplifies national banking operations</text>
    <text x="30" y="285" font-family="'Manrope', sans-serif" font-size="11" fill="#94a3b8">✓ Centralized government administration</text>
  </g>
</svg>
