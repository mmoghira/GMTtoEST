
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="45" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">Travel Time Adjustments to New York</text>
  
  <g transform="translate(100, 100)">
    <!-- Route 1: LAX to JFK -->
    <rect width="600" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="40" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#e2e8f0" font-weight="bold">Los Angeles (PDT, UTC-7)</text>
    
    <g transform="translate(240, 30)">
      <line x1="0" y1="10" x2="100" y2="10" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
      <polygon points="90,5 105,10 90,15" fill="#f59e0b"/>
      <text x="50" y="-5" font-family="'Manrope', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Flight duration: 5.5h</text>
    </g>

    <text x="370" y="40" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#f59e0b" font-weight="bold">New York (EDT, UTC-4)</text>
    <text x="370" y="65" font-family="'Manrope', sans-serif" font-size="11" fill="#94a3b8">Set clocks <tspan fill="#f59e0b" font-weight="bold">3 hours forward</tspan></text>
  </g>

  <g transform="translate(100, 230)">
    <!-- Route 2: London LHR to JFK -->
    <rect width="600" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="40" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#e2e8f0" font-weight="bold">London (BST, UTC+1)</text>
    
    <g transform="translate(240, 30)">
      <line x1="0" y1="10" x2="100" y2="10" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2"/>
      <polygon points="90,5 105,10 90,15" fill="#10b981"/>
      <text x="50" y="-5" font-family="'Manrope', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Flight duration: 8h</text>
    </g>

    <text x="370" y="40" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#10b981" font-weight="bold">New York (EDT, UTC-4)</text>
    <text x="370" y="65" font-family="'Manrope', sans-serif" font-size="11" fill="#94a3b8">Set clocks <tspan fill="#10b981" font-weight="bold">5 hours backward</tspan></text>
  </g>
</svg>
