<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26" />
      <stop offset="100%" stop-color="#0f3c52" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36c7b5" />
      <stop offset="100%" stop-color="#8fd7ff" />
    </linearGradient>

    <!-- Clock Face Gradient -->
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0c354a" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Abstract Decorative Wave Lines -->
  <path d="M-100 500 C 300 600, 500 300, 900 550 C 1100 650, 1200 500, 1300 550 L1300 680 L-100 680 Z" fill="#0b2a3a" opacity="0.4" />
  <path d="M-100 530 C 400 580, 600 350, 1000 520 C 1150 580, 1200 480, 1300 510 L1300 680 L-100 680 Z" fill="url(#accentGrad)" opacity="0.1" />

  <!-- Header Branding -->
  <g transform="translate(80, 70)">
    <rect width="56" height="56" rx="12" fill="url(#accentGrad)" />
    <!-- Clock Logo Icon -->
    <circle cx="28" cy="28" r="18" fill="none" stroke="#071b26" stroke-width="3.5" />
    <path d="M28 14 L28 28 L38 28" fill="none" stroke="#071b26" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="76" y="38" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#f4fbff">GMT to EST Converter</text>
  </g>

  <!-- Main Content Layout -->
  <!-- Left Side: Title and Value Proposition -->
  <g transform="translate(80, 200)">
    <!-- Eyebrow -->
    <rect width="210" height="34" rx="17" fill="#1b536e" />
    <text x="105" y="22" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="800" fill="#36c7b5" text-anchor="middle" letter-spacing="1.5">TIME ZONE CONVERTER</text>
    
    <!-- Title -->
    <text x="0" y="100" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="bold" fill="#f4fbff">GMT to EST</text>
    <text x="0" y="170" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="bold" fill="url(#accentGrad)">Converter</text>
    
    <!-- Subtitle / Description -->
    <text x="0" y="235" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="500" fill="#bdd2dc">
      Convert Greenwich Mean Time to Eastern Standard Time.
    </text>
    <text x="0" y="270" font-family="'Manrope', system-ui, sans-serif" font-size="18" font-weight="500" fill="#8cb1c4">
      Compare seasonal offsets (UTC+0 to UTC-5/UTC-4), explore daylight
    </text>
    <text x="0" y="300" font-family="'Manrope', system-ui, sans-serif" font-size="18" font-weight="500" fill="#8cb1c4">
      saving transitions, and access a comprehensive 24-hour chart.
    </text>

    <!-- Badge / Features -->
    <g transform="translate(0, 340)">
      <!-- Feature 1 -->
      <g transform="translate(0, 0)">
        <circle cx="15" cy="15" r="15" fill="#1b536e" />
        <path d="M10 15 L14 19 L21 11" fill="none" stroke="#36c7b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="40" y="22" font-family="'Manrope', system-ui, sans-serif" font-size="16" font-weight="700" fill="#f4fbff">DST-Aware</text>
      </g>
      <!-- Feature 2 -->
      <g transform="translate(160, 0)">
        <circle cx="15" cy="15" r="15" fill="#1b536e" />
        <path d="M10 15 L14 19 L21 11" fill="none" stroke="#36c7b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="40" y="22" font-family="'Manrope', system-ui, sans-serif" font-size="16" font-weight="700" fill="#f4fbff">100% Free</text>
      </g>
      <!-- Feature 3 -->
      <g transform="translate(300, 0)">
        <circle cx="15" cy="15" r="15" fill="#1b536e" />
        <path d="M10 15 L14 19 L21 11" fill="none" stroke="#36c7b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="40" y="22" font-family="'Manrope', system-ui, sans-serif" font-size="16" font-weight="700" fill="#f4fbff">5-Hour Offset</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Interactive Visual Clocks -->
  <g transform="translate(780, 310)" filter="url(#shadow)">
    <!-- Connection Bridge Line -->
    <line x1="-130" y1="0" x2="130" y2="0" stroke="url(#accentGrad)" stroke-width="6" stroke-dasharray="10 6" />
    
    <!-- Left Clock (GMT - UTC+0) -->
    <g transform="translate(-150, 0)">
      <circle cx="0" cy="0" r="110" fill="url(#clockGrad)" stroke="#1c5773" stroke-width="4" />
      <circle cx="0" cy="0" r="95" fill="none" stroke="#256e91" stroke-width="1.5" stroke-dasharray="4 8" />
      
      <!-- Clock Hands (12:00) -->
      <!-- Hour Hand (12 o'clock) -->
      <line x1="0" y1="0" x2="0" y2="-55" stroke="#f4fbff" stroke-width="7" stroke-linecap="round" />
      <!-- Minute Hand (12 o'clock) -->
      <line x1="0" y1="0" x2="0" y2="-75" stroke="#36c7b5" stroke-width="5" stroke-linecap="round" />
      <!-- Center Pivot -->
      <circle cx="0" cy="0" r="10" fill="#071b26" stroke="#f4fbff" stroke-width="3" />
      
      <!-- Label -->
      <rect x="-65" y="130" width="130" height="38" rx="8" fill="#0c354a" stroke="#1c5773" stroke-width="2" />
      <text x="0" y="154" font-family="'Space Grotesk', system-ui, sans-serif" font-size="18" font-weight="bold" fill="#f4fbff" text-anchor="middle">12:00 GMT</text>
      <text x="0" y="195" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="600" fill="#bdd2dc" text-anchor="middle">UTC+0 Baseline</text>
    </g>

    <!-- Right Clock (EST - UTC-5) -->
    <g transform="translate(150, 0)">
      <circle cx="0" cy="0" r="110" fill="url(#clockGrad)" stroke="#36c7b5" stroke-width="4" />
      <circle cx="0" cy="0" r="95" fill="none" stroke="#2a9084" stroke-width="1.5" stroke-dasharray="4 8" />
      
      <!-- Clock Hands (EST is 5 hours behind GMT, so 7:00) -->
      <!-- Hour Hand (7 o'clock) -->
      <line x1="0" y1="0" x2="-28" y2="48" stroke="#f4fbff" stroke-width="7" stroke-linecap="round" />
      <!-- Minute Hand (12 o'clock) -->
      <line x1="0" y1="0" x2="0" y2="-75" stroke="#8fd7ff" stroke-width="5" stroke-linecap="round" />
      <!-- Center Pivot -->
      <circle cx="0" cy="0" r="10" fill="#071b26" stroke="#f4fbff" stroke-width="3" />
      
      <!-- Label -->
      <rect x="-65" y="130" width="130" height="38" rx="8" fill="#0c354a" stroke="#36c7b5" stroke-width="2" />
      <text x="0" y="154" font-family="'Space Grotesk', system-ui, sans-serif" font-size="18" font-weight="bold" fill="#36c7b5" text-anchor="middle">7:00 EST</text>
      <text x="0" y="195" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="600" fill="#bdd2dc" text-anchor="middle">UTC-5 Offset</text>
    </g>

    <!-- Offset Indicator Arrow Bubble -->
    <g transform="translate(0, -60)">
      <rect x="-55" y="-20" width="110" height="36" rx="18" fill="url(#accentGrad)" />
      <text x="0" y="4" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="bold" fill="#071b26" text-anchor="middle">-5 Hours</text>
    </g>
  </g>
</svg>
