
  <svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06151f"/>
        <stop offset="50%" stop-color="#0c354a"/>
        <stop offset="100%" stop-color="#12455d"/>
      </linearGradient>
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="rgba(18, 69, 93, 0.95)"/>
        <stop offset="100%" stop-color="rgba(12, 53, 74, 0.95)"/>
      </linearGradient>
      <radialGradient id="glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#36c7b5" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#06151f" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect width="960" height="540" fill="url(#heroBg)"/>
    <circle cx="480" cy="270" r="360" fill="url(#glow)"/>

    <!-- Subtle Dial / Time Ring Backdrop -->
    <g stroke="rgba(255,255,255,0.06)" stroke-width="2" fill="none">
      <circle cx="480" cy="270" r="230"/>
      <circle cx="480" cy="270" r="170"/>
      <line x1="120" y1="270" x2="840" y2="270"/>
      <line x1="480" y1="60" x2="480" y2="480"/>
    </g>

    <!-- Header info in hero -->
    <g transform="translate(64, 46)">
      <rect x="0" y="0" width="230" height="30" rx="15" fill="rgba(54, 199, 181, 0.15)" stroke="#36c7b5" stroke-width="1.5"/>
      <text x="16" y="20" fill="#36c7b5" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">TWO-WAY TIME FORMAT</text>
      
      <text x="0" y="74" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="38" font-weight="800">AM PM Converter</text>
      <text x="0" y="104" fill="#fbbf24" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="18" font-weight="700">24-Hour Military to 12-Hour Standard Time</text>
    </g>

    <!-- Central Conversion Composition (Analog Clock + Dual Digital Displays) -->
    <g transform="translate(64, 175)">
      
      <!-- Panel 1: 24-Hour Input Side (15:30) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="240" height="270" rx="16" fill="url(#cardGrad)" stroke="#1e5f80" stroke-width="2"/>
        <rect x="20" y="20" width="105" height="24" rx="4" fill="#1e3a8a"/>
        <text x="28" y="36" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="800">24-HOUR TIME</text>
        
        <text x="20" y="80" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="13">Afternoon Hour (15)</text>
        <text x="20" y="145" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="52" font-weight="900" letter-spacing="-0.02em">15:30</text>
        
        <line x1="20" y1="180" x2="220" y2="180" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
        <text x="20" y="210" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Formula: 15 − 12 = 3</text>
        <text x="20" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Minutes (30) unchanged</text>
      </g>

      <!-- Central Transition: Analog Clock face showing 3:30 PM -->
      <g transform="translate(290, 15)">
        <circle cx="120" cy="120" r="115" fill="#082030" stroke="#36c7b5" stroke-width="4" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.6))"/>
        
        <!-- Hour markers -->
        <g stroke="#8fd7ff" stroke-width="2.5" stroke-linecap="round">
          <!-- 12 o'clock -->
          <line x1="120" y1="15" x2="120" y2="30"/>
          <!-- 3 o'clock -->
          <line x1="225" y1="120" x2="210" y2="120"/>
          <!-- 6 o'clock -->
          <line x1="120" y1="225" x2="120" y2="210"/>
          <!-- 9 o'clock -->
          <line x1="15" y1="120" x2="30" y2="120"/>
        </g>
        
        <!-- Dial Numbers -->
        <text x="120" y="48" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" text-anchor="middle">12</text>
        <text x="195" y="126" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" text-anchor="middle">3</text>
        <text x="120" y="200" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" text-anchor="middle">6</text>
        <text x="45" y="126" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" text-anchor="middle">9</text>

        <!-- 3:30 Hands (Hour hand between 3 and 4, Minute hand straight down at 6) -->
        <line x1="120" y1="120" x2="168" y2="136" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
        <line x1="120" y1="120" x2="120" y2="188" stroke="#36c7b5" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="120" cy="120" r="6" fill="#fbbf24"/>
        
        <!-- Badge below clock -->
        <text x="120" y="260" fill="#36c7b5" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">ANALOG: 3:30 PM</text>
      </g>

      <!-- Conversion Arrow Right -->
      <path d="M 555,135 L 575,135" stroke="#36c7b5" stroke-width="3.5" stroke-linecap="round"/>
      <polygon points="575,135 565,129 565,141" fill="#36c7b5"/>

      <!-- Panel 2: 12-Hour Output Side (3:30 PM) -->
      <g transform="translate(590, 0)">
        <rect x="0" y="0" width="240" height="270" rx="16" fill="url(#cardGrad)" stroke="#36c7b5" stroke-width="2.5"/>
        <rect x="20" y="20" width="105" height="24" rx="4" fill="#047857"/>
        <text x="28" y="36" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="800">12-HOUR TIME</text>
        
        <text x="20" y="80" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="13">Post Meridiem (PM)</text>
        <text x="20" y="145" fill="#fbbf24" font-family="'Space Grotesk', monospace" font-size="46" font-weight="900" letter-spacing="-0.02em">3:30 PM</text>
        
        <line x1="20" y1="180" x2="220" y2="180" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
        <text x="20" y="210" fill="#36c7b5" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Result: 3:30 in the afternoon</text>
        <text x="20" y="235" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="12">Reverse: 3 + 12 = 15:30</text>
      </g>

    </g>
  </svg>
  