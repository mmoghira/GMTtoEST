
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="45" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">UTC Offset Wheel for Abbreviations</text>
  
  <g transform="translate(400, 230)">
    <!-- Main circles -->
    <circle cx="0" cy="0" r="140" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="100" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    
    <!-- Central Node -->
    <circle cx="0" cy="0" r="10" fill="#38bdf8"/>
    <text x="0" y="35" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0" text-anchor="middle">UTC / GMT</text>
    
    <!-- Nodes at different angles -->
    <!-- PST at 180° -->
    <g transform="rotate(180)">
      <line x1="0" y1="0" x2="140" y2="0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2,2"/>
      <circle cx="140" cy="0" r="5" fill="#ef4444"/>
      <text x="-165" y="4" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#ef4444" font-weight="bold" transform="rotate(180, -165, 0)">PST (-8)</text>
    </g>
    <!-- EST at 225° -->
    <g transform="rotate(225)">
      <line x1="0" y1="0" x2="140" y2="0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2,2"/>
      <circle cx="140" cy="0" r="5" fill="#f59e0b"/>
      <text x="-165" y="4" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#f59e0b" font-weight="bold" transform="rotate(135, -165, 0)">EST (-5)</text>
    </g>
    <!-- CET at 45° -->
    <g transform="rotate(45)">
      <line x1="0" y1="0" x2="140" y2="0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2,2"/>
      <circle cx="140" cy="0" r="5" fill="#10b981"/>
      <text x="150" y="4" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#10b981" font-weight="bold" transform="rotate(-45, 150, 0)">CET (+1)</text>
    </g>
    <!-- IST at 90° -->
    <g transform="rotate(90)">
      <line x1="0" y1="0" x2="140" y2="0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2,2"/>
      <circle cx="140" cy="0" r="5" fill="#10b981"/>
      <text x="150" y="4" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#10b981" font-weight="bold" transform="rotate(-90, 150, 0)">IST (+5.5)</text>
    </g>
    <!-- JST at 112.5° -->
    <g transform="rotate(112.5)">
      <line x1="0" y1="0" x2="140" y2="0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2,2"/>
      <circle cx="140" cy="0" r="5" fill="#38bdf8"/>
      <text x="150" y="4" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#38bdf8" font-weight="bold" transform="rotate(-112.5, 150, 0)">JST (+9)</text>
    </g>
    <!-- AEST at 135° -->
    <g transform="rotate(135)">
      <line x1="0" y1="0" x2="140" y2="0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2,2"/>
      <circle cx="140" cy="0" r="5" fill="#ec4899"/>
      <text x="150" y="4" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#ec4899" font-weight="bold" transform="rotate(-135, 150, 0)">AEST (+10)</text>
    </g>
  </g>
</svg>
