<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Tour de France 2026 GMT and EDT timezone conversion chart</title>
  <desc id="desc">CEST start times for key Tour de France 2026 stages converted to GMT, EDT, BST, PKT and IST.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7c7"/><stop offset="0.45" stop-color="#f0f8ff"/><stop offset="1" stop-color="#dff5ea"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.16"/></filter>
    <style>
      .title{font:800 46px Arial, Helvetica, sans-serif; fill:#0f172a}
      .subtitle{font:500 23px Arial, Helvetica, sans-serif; fill:#475569}
      .pill{font:800 22px Arial, Helvetica, sans-serif; fill:#0f172a}
      .head{font:800 19px Arial, Helvetica, sans-serif; fill:#1d4ed8; text-transform:uppercase; letter-spacing:.07em}
      .label{font:800 23px Arial, Helvetica, sans-serif; fill:#0f172a}
      .value{font:800 22px Arial, Helvetica, sans-serif; fill:#111827}
      .note{font:600 18px Arial, Helvetica, sans-serif; fill:#64748b}
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1010" cy="110" r="88" fill="#facc15" opacity=".28"/>
  <circle cx="1010" cy="110" r="68" fill="none" stroke="#0f172a" stroke-width="5" opacity=".18"/>
  <line x1="1010" y1="110" x2="1010" y2="62" stroke="#0f172a" stroke-width="6" stroke-linecap="round" opacity=".26"/>
  <line x1="1010" y1="110" x2="1052" y2="130" stroke="#0f172a" stroke-width="6" stroke-linecap="round" opacity=".26"/>
  <path d="M50 596 C230 526 365 648 536 578 C705 508 829 630 1148 544" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" opacity=".14"/>
  <g filter="url(#shadow)"><rect x="32" y="34" width="1136" height="620" rx="34" fill="white" opacity=".94"/></g>
  <text x="58" y="98" class="title">Tour de France 2026 Timezone Cheat Sheet</text>
  <text x="60" y="140" class="subtitle">CEST is UTC+2 in July: subtract 2 hours for GMT and 6 hours for EDT.</text>
  <rect x="58" y="164" width="382" height="42" rx="21" fill="#facc15"/>
  <text x="78" y="193" class="pill">GMT / EDT / BST / PKT / IST</text>
  <text x="44" y="224" class="head">Viewing case</text>
<text x="324" y="224" class="head">Local</text>
<text x="500" y="224" class="head">GMT</text>
<text x="650" y="224" class="head">EDT</text>
<text x="798" y="224" class="head">BST</text>
<text x="938" y="224" class="head">PKT</text>
<text x="1065" y="224" class="head">IST</text>
  <rect x="32" y="240" width="1136" height="58" rx="16" fill="#ffffff"/>
<text x="44" y="282" class="label">Stage 20 earliest</text>
<text x="324" y="282" class="value">11:20 CEST</text>
<text x="500" y="282" class="value">09:20 GMT</text>
<text x="650" y="282" class="value">05:20 EDT</text>
<text x="798" y="282" class="value">10:20 BST</text>
<text x="938" y="282" class="value">14:20 PKT</text>
<text x="1065" y="282" class="value">14:50 IST</text>
<rect x="32" y="312" width="1136" height="58" rx="16" fill="#f8fbff"/>
<text x="44" y="354" class="label">Mountain example</text>
<text x="324" y="354" class="value">12:10 CEST</text>
<text x="500" y="354" class="value">10:10 GMT</text>
<text x="650" y="354" class="value">06:10 EDT</text>
<text x="798" y="354" class="value">11:10 BST</text>
<text x="938" y="354" class="value">15:10 PKT</text>
<text x="1065" y="354" class="value">15:40 IST</text>
<rect x="32" y="384" width="1136" height="58" rx="16" fill="#ffffff"/>
<text x="44" y="426" class="label">Typical road start</text>
<text x="324" y="426" class="value">13:10 CEST</text>
<text x="500" y="426" class="value">11:10 GMT</text>
<text x="650" y="426" class="value">07:10 EDT</text>
<text x="798" y="426" class="value">12:10 BST</text>
<text x="938" y="426" class="value">16:10 PKT</text>
<text x="1065" y="426" class="value">16:40 IST</text>
<rect x="32" y="456" width="1136" height="58" rx="16" fill="#f8fbff"/>
<text x="44" y="498" class="label">Stage 1 TTT</text>
<text x="324" y="498" class="value">17:05 CEST</text>
<text x="500" y="498" class="value">15:05 GMT</text>
<text x="650" y="498" class="value">11:05 EDT</text>
<text x="798" y="498" class="value">16:05 BST</text>
<text x="938" y="498" class="value">20:05 PKT</text>
<text x="1065" y="498" class="value">20:35 IST</text>
<rect x="32" y="528" width="1136" height="58" rx="16" fill="#ffffff"/>
<text x="44" y="570" class="label">Paris finale</text>
<text x="324" y="570" class="value">16:15 CEST</text>
<text x="500" y="570" class="value">14:15 GMT</text>
<text x="650" y="570" class="value">10:15 EDT</text>
<text x="798" y="570" class="value">15:15 BST</text>
<text x="938" y="570" class="value">19:15 PKT</text>
<text x="1065" y="570" class="value">19:45 IST</text>
  <text x="58" y="626" class="note">Eastern Time in July is EDT, not winter EST. Verify final stage schedules close to race day.</text>
</svg>