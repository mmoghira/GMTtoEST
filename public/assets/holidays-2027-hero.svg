<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06151f"/>
      <stop offset="50%" stop-color="#0c354a"/>
      <stop offset="100%" stop-color="#12455d"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(18, 69, 93, 0.95)"/>
      <stop offset="100%" stop-color="rgba(12, 53, 74, 0.95)"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#36c7b5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06151f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="540" fill="url(#heroBg)"/>
  <circle cx="480" cy="270" r="420" fill="url(#sunGlow)"/>

  <!-- Background Lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1.5">
    <line x1="80" y1="80" x2="880" y2="80"/>
    <line x1="80" y1="460" x2="880" y2="460"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(80, 42)">
    <rect x="0" y="0" width="220" height="30" rx="15" fill="rgba(54, 199, 181, 0.15)" stroke="#36c7b5" stroke-width="1.5"/>
    <text x="18" y="20" fill="#36c7b5" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">ANNUAL CALENDAR HUB</text>
    <text x="0" y="70" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="800">Holidays in 2027</text>
    <text x="0" y="98" fill="#bdd2dc" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="600">Full Month-by-Month Schedule of Global Observances &amp; Celebrations</text>
  </g>

  <!-- 4 Seasonal Preview Cards -->
  <g transform="translate(80, 160)">
    
    <!-- Q1: Winter / Spring -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="185" height="300" rx="14" fill="url(#cardGrad)" stroke="#1e5f80" stroke-width="2"/>
      <rect x="0" y="0" width="185" height="38" rx="14" fill="#082030"/>
      <text x="92" y="24" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" text-anchor="middle">JAN – MAR (Q1)</text>

      <g transform="translate(16, 54)">
        <text x="0" y="16" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800">1 Jan</text>
        <text x="0" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">New Year's Day</text>

        <text x="0" y="66" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800">18 Jan</text>
        <text x="0" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">MLK Jr. Day</text>

        <text x="0" y="116" fill="#36c7b5" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800">8 Feb</text>
        <text x="0" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Ramadan Start</text>

        <text x="0" y="166" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800">28 Mar</text>
        <text x="0" y="182" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Easter Sunday</text>
      </g>
    </g>

    <!-- Q2: Late Spring -->
    <g transform="translate(205, 0)">
      <rect x="0" y="0" width="185" height="300" rx="14" fill="url(#cardGrad)" stroke="#1e5f80" stroke-width="2"/>
      <rect x="0" y="0" width="185" height="38" rx="14" fill="#082030"/>
      <text x="92" y="24" fill="#34d399" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" text-anchor="middle">MAY – JUN (Q2)</text>

      <g transform="translate(16, 54)">
        <text x="0" y="16" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800">31 May</text>
        <text x="0" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Memorial Day</text>

        <text x="0" y="66" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800">19 Jun</text>
        <text x="0" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Juneteenth</text>

        <text x="0" y="116" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800">20 Jun</text>
        <text x="0" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Father's Day</text>

        <rect x="0" y="160" width="153" height="50" rx="8" fill="#082030"/>
        <text x="76" y="182" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Observed 18 Jun</text>
        <text x="76" y="198" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Federal schedules</text>
      </g>
    </g>

    <!-- Q3: Summer / Early Fall -->
    <g transform="translate(410, 0)">
      <rect x="0" y="0" width="185" height="300" rx="14" fill="url(#cardGrad)" stroke="#1e5f80" stroke-width="2"/>
      <rect x="0" y="0" width="185" height="38" rx="14" fill="#082030"/>
      <text x="92" y="24" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" text-anchor="middle">JUL – SEP (Q3)</text>

      <g transform="translate(16, 54)">
        <text x="0" y="16" fill="#f87171" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800">4 Jul</text>
        <text x="0" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Independence Day</text>

        <text x="0" y="66" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800">26 Aug</text>
        <text x="0" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Int'l Dog Day</text>

        <text x="0" y="116" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800">6 Sep</text>
        <text x="0" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Labor Day</text>

        <rect x="0" y="160" width="153" height="50" rx="8" fill="#082030"/>
        <text x="76" y="182" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Observed 5 Jul</text>
        <text x="76" y="198" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Federal schedules</text>
      </g>
    </g>

    <!-- Q4: Autumn / Year-End -->
    <g transform="translate(615, 0)">
      <rect x="0" y="0" width="185" height="300" rx="14" fill="url(#cardGrad)" stroke="#1e5f80" stroke-width="2"/>
      <rect x="0" y="0" width="185" height="38" rx="14" fill="#082030"/>
      <text x="92" y="24" fill="#f87171" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" text-anchor="middle">OCT – DEC (Q4)</text>

      <g transform="translate(16, 54)">
        <text x="0" y="16" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800">29 Oct</text>
        <text x="0" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Diwali (India)</text>

        <text x="0" y="66" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800">31 Oct</text>
        <text x="0" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Halloween</text>

        <text x="0" y="116" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800">25 Nov</text>
        <text x="0" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Thanksgiving</text>

        <text x="0" y="166" fill="#34d399" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800">25 Dec</text>
        <text x="0" y="182" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Christmas Day</text>
      </g>
    </g>

  </g>
</svg>