<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26" />
      <stop offset="100%" stop-color="#0f3c52" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0c354a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <g transform="translate(0, 70)" text-anchor="middle">
    <text x="600" y="40" font-family="'Space Grotesk', system-ui, sans-serif" font-size="40" font-weight="bold" fill="#f4fbff">EST Global Time Zone Comparison</text>
    <text x="600" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="22" fill="#bdd2dc">Winter &amp; Summer Offset Relationships Between EST/EDT and Major World Cities</text>
  </g>

  <!-- Grid of 4 Cities -->
  <g transform="translate(100, 190)">
    <!-- London -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="460" height="200" rx="16" fill="url(#cardGrad)" stroke="#256e91" stroke-width="2" />
      <text x="30" y="45" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="bold" fill="#f4fbff">🇬🇧 London (GMT / BST)</text>
      <text x="30" y="90" font-family="'Manrope', system-ui, sans-serif" font-size="20" fill="#36c7b5">• Winter: <tspan font-weight="bold">5 hours ahead</tspan> of EST (GMT vs EST)</text>
      <text x="30" y="130" font-family="'Manrope', system-ui, sans-serif" font-size="20" fill="#8fd7ff">• Summer: <tspan font-weight="bold">5 hours ahead</tspan> of EDT (BST vs EDT)</text>
      <text x="30" y="170" font-family="'Manrope', system-ui, sans-serif" font-size="16" fill="#bdd2dc">Note: 4 hours during 2-week DST gap in March/Oct</text>
    </g>

    <!-- Berlin -->
    <g transform="translate(540, 0)" filter="url(#shadow)">
      <rect width="460" height="200" rx="16" fill="url(#cardGrad)" stroke="#256e91" stroke-width="2" />
      <text x="30" y="45" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="bold" fill="#f4fbff">🇩🇪 Berlin / Paris (CET / CEST)</text>
      <text x="30" y="90" font-family="'Manrope', system-ui, sans-serif" font-size="20" fill="#36c7b5">• Winter: <tspan font-weight="bold">6 hours ahead</tspan> of EST (CET vs EST)</text>
      <text x="30" y="130" font-family="'Manrope', system-ui, sans-serif" font-size="20" fill="#8fd7ff">• Summer: <tspan font-weight="bold">6 hours ahead</tspan> of EDT (CEST vs EDT)</text>
      <text x="30" y="170" font-family="'Manrope', system-ui, sans-serif" font-size="16" fill="#bdd2dc">Note: 5 hours during 2-week DST gap in March/Oct</text>
    </g>

    <!-- Sydney -->
    <g transform="translate(0, 240)" filter="url(#shadow)">
      <rect width="460" height="200" rx="16" fill="url(#cardGrad)" stroke="#256e91" stroke-width="2" />
      <text x="30" y="45" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="bold" fill="#f4fbff">🇦🇺 Sydney (AEDT / AEST)</text>
      <text x="30" y="90" font-family="'Manrope', system-ui, sans-serif" font-size="20" fill="#36c7b5">• US Winter / AU Summer: <tspan font-weight="bold">16 hours ahead</tspan></text>
      <text x="30" y="130" font-family="'Manrope', system-ui, sans-serif" font-size="20" fill="#8fd7ff">• US Summer / AU Winter: <tspan font-weight="bold">14 hours ahead</tspan></text>
      <text x="30" y="170" font-family="'Manrope', system-ui, sans-serif" font-size="16" fill="#bdd2dc">Opposite seasonal DST cycles in North vs South hemispheres</text>
    </g>

    <!-- Perth -->
    <g transform="translate(540, 240)" filter="url(#shadow)">
      <rect width="460" height="200" rx="16" fill="url(#cardGrad)" stroke="#256e91" stroke-width="2" />
      <text x="30" y="45" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="bold" fill="#f4fbff">🇦🇺 Perth (AWST - UTC+8)</text>
      <text x="30" y="90" font-family="'Manrope', system-ui, sans-serif" font-size="20" fill="#36c7b5">• Winter (EST): <tspan font-weight="bold">13 hours ahead</tspan> (AWST year-round)</text>
      <text x="30" y="130" font-family="'Manrope', system-ui, sans-serif" font-size="20" fill="#8fd7ff">• Summer (EDT): <tspan font-weight="bold">12 hours ahead</tspan> of EDT</text>
      <text x="30" y="170" font-family="'Manrope', system-ui, sans-serif" font-size="16" fill="#bdd2dc">Perth does not observe DST (UTC+8 fixed)</text>
    </g>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(150, 680)" text-anchor="middle">
    <rect x="0" y="0" width="900" height="60" rx="12" fill="#12455d" stroke="#2f6278" stroke-width="1.5" />
    <text x="450" y="38" font-family="'Manrope', system-ui, sans-serif" font-size="18" font-weight="bold" fill="#f4fbff">
      Offsets vary seasonally based on daylight saving rules in both locations.
    </text>
  </g>
</svg>
