<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="fsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041018" />
      <stop offset="50%" stop-color="#0a2638" />
      <stop offset="100%" stop-color="#0f3c52" />
    </linearGradient>
    <linearGradient id="monitorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06151f" />
      <stop offset="100%" stop-color="#02080d" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#36c7b5" flood-opacity="0.3" />
    </filter>
    <filter id="monShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#fsBg)" />

  <!-- Title Badge -->
  <g transform="translate(400, 36)" text-anchor="middle">
    <rect x="-160" y="0" width="320" height="28" rx="14" fill="rgba(54, 199, 181, 0.15)" stroke="#36c7b5" stroke-width="1.2" />
    <text x="0" y="19" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" fill="#36c7b5" letter-spacing="1.5">FULL SCREEN AMBIENT DISPLAY</text>
  </g>

  <!-- Monitor Frame Illustration -->
  <g transform="translate(100, 80)" filter="url(#monShadow)">
    <!-- Monitor Outer Bezel -->
    <rect width="600" height="300" rx="14" fill="#171d23" stroke="#2c3642" stroke-width="3" />
    <!-- Monitor Inner Screen -->
    <rect x="12" y="12" width="576" height="276" rx="8" fill="url(#monitorGrad)" />

    <!-- Live Clock Display Elements on Screen -->
    <!-- Mode badge -->
    <g transform="translate(300, 50)" text-anchor="middle">
      <rect x="-60" y="-12" width="120" height="24" rx="12" fill="#144d68" />
      <text x="0" y="4" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" fill="#8fd7ff">12-HOUR MODE</text>
    </g>

    <!-- Main Time Numbers -->
    <text x="300" y="145" font-family="'Space Grotesk', monospace, sans-serif" font-size="76" font-weight="800" fill="#ffffff" text-anchor="middle" filter="url(#glow)">
      10:24<tspan font-size="44" fill="#36c7b5">:45</tspan> <tspan font-size="34" fill="#8fd7ff">AM</tspan>
    </text>

    <!-- Full Date Line -->
    <text x="300" y="185" font-family="'Manrope', system-ui, sans-serif" font-size="18" font-weight="600" fill="#8fd7ff" text-anchor="middle">
      Sunday, October 25, 2026
    </text>

    <!-- Lower Secondary Zones Row inside the monitor -->
    <g transform="translate(120, 215)">
      <!-- GMT box -->
      <rect x="0" y="0" width="165" height="50" rx="8" fill="#0d3448" stroke="#256e91" stroke-width="1" />
      <text x="82" y="18" font-family="'Manrope', system-ui, sans-serif" font-size="10" font-weight="700" fill="#bdd2dc" text-anchor="middle">GMT (UTC)</text>
      <text x="82" y="38" font-family="'Space Grotesk', monospace, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">14:24:45</text>
      
      <!-- Eastern Time box -->
      <rect x="195" y="0" width="165" height="50" rx="8" fill="#0d3448" stroke="#36c7b5" stroke-width="1" />
      <text x="277" y="18" font-family="'Manrope', system-ui, sans-serif" font-size="10" font-weight="700" fill="#36c7b5" text-anchor="middle">EASTERN TIME (EDT)</text>
      <text x="277" y="38" font-family="'Space Grotesk', monospace, sans-serif" font-size="15" font-weight="700" fill="#36c7b5" text-anchor="middle">10:24:45 AM</text>
    </g>
  </g>

  <!-- Monitor Stand -->
  <g transform="translate(360, 380)" filter="url(#monShadow)">
    <path d="M 30 0 L 10 32 L 70 32 L 50 0 Z" fill="#1b242c" />
    <rect x="-20" y="32" width="120" height="10" rx="4" fill="#2c3642" />
  </g>

  <!-- Bottom Caption -->
  <text x="400" y="438" font-family="'Manrope', system-ui, sans-serif" font-size="12" font-style="italic" fill="#bdd2dc" text-anchor="middle">
    High-contrast full-screen digital clock with live GMT and Eastern Time.
  </text>
</svg>