<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26" />
      <stop offset="100%" stop-color="#0f3c52" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0c354a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <g transform="translate(0, 70)" text-anchor="middle">
    <text x="600" y="40" font-family="'Space Grotesk', system-ui, sans-serif" font-size="40" font-weight="bold" fill="#f4fbff">West Africa Time (WAT) Region Coverage</text>
    <text x="600" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="22" fill="#bdd2dc">West Africa Time — WAT — UTC+01:00 Representative Countries</text>
  </g>

  <!-- Big Central Card -->
  <g transform="translate(200, 200)" filter="url(#shadow)">
    <rect width="800" height="430" rx="20" fill="url(#cardGrad)" stroke="#36c7b5" stroke-width="3" />
    
    <g transform="translate(50, 40)">
      <circle cx="50" cy="50" r="40" fill="#1b536e" />
      <text x="50" y="60" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="bold" fill="#36c7b5" text-anchor="middle">WAT</text>
      
      <text x="120" y="45" font-family="'Space Grotesk', system-ui, sans-serif" font-size="36" font-weight="bold" fill="#f4fbff">UTC+01:00 Standard Offset</text>
      <text x="120" y="80" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="600" fill="#8fd7ff">Observed Year-Round Across West &amp; Central African Nations</text>
    </g>

    <line x1="50" y1="150" x2="750" y2="150" stroke="#256e91" stroke-width="2" />

    <g transform="translate(50, 190)">
      <text x="0" y="0" font-family="'Manrope', system-ui, sans-serif" font-size="19" fill="#f4fbff">• <tspan font-weight="bold" fill="#36c7b5">Nigeria:</tspan> Lagos, Abuja, Kano (Africa/Lagos)</text>
      <text x="0" y="40" font-family="'Manrope', system-ui, sans-serif" font-size="19" fill="#f4fbff">• <tspan font-weight="bold" fill="#36c7b5">Angola:</tspan> Luanda (Africa/Luanda)</text>
      <text x="0" y="80" font-family="'Manrope', system-ui, sans-serif" font-size="19" fill="#f4fbff">• <tspan font-weight="bold" fill="#36c7b5">Cameroon &amp; Benin:</tspan> Douala, Yaoundé, Cotonou, Porto-Novo</text>
      <text x="0" y="120" font-family="'Manrope', system-ui, sans-serif" font-size="19" fill="#f4fbff">• <tspan font-weight="bold" fill="#36c7b5">Central Africa:</tspan> Chad, CAR, Republic of the Congo, DRC (Western)</text>
      <text x="0" y="160" font-family="'Manrope', system-ui, sans-serif" font-size="19" fill="#f4fbff">• <tspan font-weight="bold" fill="#36c7b5">Other Nations:</tspan> Equatorial Guinea, Gabon, Niger</text>
    </g>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(200, 680)">
    <rect width="800" height="55" rx="12" fill="#12455d" stroke="#2f6278" stroke-width="1.5" />
    <text x="400" y="35" font-family="'Manrope', system-ui, sans-serif" font-size="18" font-weight="bold" fill="#f4fbff" text-anchor="middle">
      WAT is used in parts of West and Central Africa without seasonal DST shifts.
    </text>
  </g>
</svg>
