<svg class="visual-svg" viewBox="0 0 800 320" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UTC Offset Continuum Axis from UTC-12 to UTC+14">
        <rect width="800" height="320" rx="12" fill="#0f172a" stroke="var(--line)" stroke-width="2"/>
        
        <!-- Axis Main Line -->
        <line x1="50" y1="160" x2="750" y2="160" stroke="var(--line)" stroke-width="4"/>
        
        <!-- Zero Meridian Center Node -->
        <circle cx="400" cy="160" r="12" fill="#38bdf8"/>
        <text x="400" y="130" fill="#38bdf8" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="16" text-anchor="middle">UTC+0 (Baseline)</text>
        <text x="400" y="195" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">London / GMT</text>

        <!-- West Negative Offset Nodes -->
        <circle cx="280" cy="160" r="9" fill="#3b82f6"/>
        <text x="280" y="135" fill="#60a5fa" font-size="13" font-weight="bold" text-anchor="middle">UTC-5 (EST)</text>
        <text x="280" y="195" fill="#94a3b8" font-size="11" text-anchor="middle">New York (-5h)</text>

        <circle cx="170" cy="160" r="9" fill="#3b82f6"/>
        <text x="170" y="135" fill="#60a5fa" font-size="13" font-weight="bold" text-anchor="middle">UTC-8 (PST)</text>
        <text x="170" y="195" fill="#94a3b8" font-size="11" text-anchor="middle">Los Angeles (-8h)</text>

        <circle cx="70" cy="160" r="9" fill="#64748b"/>
        <text x="70" y="135" fill="#94a3b8" font-size="13" font-weight="bold" text-anchor="middle">UTC-12</text>
        <text x="70" y="195" fill="#64748b" font-size="11" text-anchor="middle">Baker Island</text>

        <!-- East Positive Offset Nodes -->
        <circle cx="520" cy="160" r="9" fill="#10b981"/>
        <text x="520" y="135" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">UTC+5:30 (IST)</text>
        <text x="520" y="195" fill="#94a3b8" font-size="11" text-anchor="middle">India (+5.5h)</text>

        <circle cx="630" cy="160" r="9" fill="#10b981"/>
        <text x="630" y="135" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">UTC+9 (JST)</text>
        <text x="630" y="195" fill="#94a3b8" font-size="11" text-anchor="middle">Tokyo (+9h)</text>

        <circle cx="730" cy="160" r="9" fill="#f59e0b"/>
        <text x="730" y="135" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">UTC+14</text>
        <text x="730" y="195" fill="#fbbf24" font-size="11" text-anchor="middle">Kiribati (+14h)</text>

        <text x="400" y="270" fill="#94a3b8" font-size="13" font-weight="bold" text-anchor="middle">← WEST (Behind UTC) | EAST (Ahead of UTC) →</text>
      </svg>