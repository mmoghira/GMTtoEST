
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="40" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">World Time Zone Abbreviations Map</text>
  
  <!-- Stylized world continent shapes -->
  <!-- North America -->
  <path d="M 120,120 L 220,120 L 220,200 L 150,220 L 140,160 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="160" y="150" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">PST/EST</text>
  
  <!-- South America -->
  <path d="M 180,240 L 230,240 L 210,360 L 180,280 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="210" y="270" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">ART/BRT</text>

  <!-- Europe / Africa -->
  <path d="M 360,110 L 440,110 L 450,180 L 420,320 L 350,260 L 340,180 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="390" y="140" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">WET/CET</text>
  <text x="385" y="250" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">WAT/CAT</text>

  <!-- Asia -->
  <path d="M 460,100 L 680,100 L 680,240 L 520,280 L 480,200 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="540" y="170" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#10b981">IST</text>
  <text x="600" y="140" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#10b981">SGT/HKT</text>
  <text x="650" y="170" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#10b981">JST/KST</text>

  <!-- Australia -->
  <path d="M 600,290 L 680,290 L 670,360 L 590,340 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="635" y="325" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#e11d48">AWST/AEST</text>
</svg>
