<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="100%" height="auto" style="display: block; margin: 0 auto;">
        <rect width="800" height="270" fill="#0f172a" rx="10" />
        <text x="400" y="30" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="16" fill="#8fd7ff" text-anchor="middle">Unix Time Progression: 1970 Epoch to Y2K38 Overflow</text>
        
        <!-- Timeline Line -->
        <line x1="60" y1="130" x2="740" y2="130" stroke="#334155" stroke-width="4" />

        <!-- Nodes -->
        <g transform="translate(80, 130)">
          <circle cx="0" cy="0" r="10" fill="#38bdf8" />
          <line x1="0" y1="0" x2="0" y2="-40" stroke="#38bdf8" stroke-width="2" />
          <text x="0" y="-50" font-family="sans-serif" font-size="11" fill="#7dd3fc" text-anchor="middle" font-weight="bold">Jan 1, 1970</text>
          <text x="0" y="-65" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">Timestamp: 0</text>
        </g>

        <g transform="translate(260, 130)">
          <circle cx="0" cy="0" r="10" fill="#36c7b5" />
          <line x1="0" y1="0" x2="0" y2="40" stroke="#36c7b5" stroke-width="2" />
          <text x="0" y="55" font-family="sans-serif" font-size="11" fill="#6ee7b7" text-anchor="middle" font-weight="bold">Sep 9, 2001</text>
          <text x="0" y="70" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">1,000,000,000 ("Billennium")</text>
        </g>

        <g transform="translate(480, 130)">
          <circle cx="0" cy="0" r="10" fill="#f59e0b" />
          <line x1="0" y1="0" x2="0" y2="-40" stroke="#f59e0b" stroke-width="2" />
          <text x="0" y="-50" font-family="sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="bold">July 2026 (Present)</text>
          <text x="0" y="-65" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">~1,785,418,800</text>
        </g>

        <g transform="translate(680, 130)">
          <circle cx="0" cy="0" r="10" fill="#e11d48" />
          <line x1="0" y1="0" x2="0" y2="40" stroke="#e11d48" stroke-width="2" />
          <text x="0" y="55" font-family="sans-serif" font-size="11" fill="#f87171" text-anchor="middle" font-weight="bold">Jan 19, 2038</text>
          <text x="0" y="70" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">2,147,483,647 (32-bit Limit)</text>
        </g>
      </svg>