<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26" />
      <stop offset="100%" stop-color="#0f3c52" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0c354a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36c7b5" />
      <stop offset="100%" stop-color="#8fd7ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <g transform="translate(0, 80)" text-anchor="middle">
    <text x="600" y="40" font-family="'Space Grotesk', system-ui, sans-serif" font-size="40" font-weight="bold" fill="#f4fbff">Mountain Standard Time (MST) — UTC−7</text>
    <text x="600" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="22" fill="#bdd2dc">Standard Winter Time &amp; Arizona Year-Round Offset Across North America</text>
  </g>

  <!-- Infographic Grid -->
  <g transform="translate(150, 220)">
    <!-- Main Card -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="900" height="380" rx="16" fill="url(#cardGrad)" stroke="#36c7b5" stroke-width="3" />
      
      <!-- Key Stats Columns -->
      <g transform="translate(50, 50)">
        <!-- Stat 1 -->
        <g transform="translate(0, 0)">
          <rect width="240" height="130" rx="12" fill="#1b536e" />
          <text x="120" y="45" font-family="'Space Grotesk', system-ui, sans-serif" font-size="32" font-weight="bold" fill="#36c7b5" text-anchor="middle">UTC−7</text>
          <text x="120" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="16" font-weight="600" fill="#f4fbff" text-anchor="middle">Standard Offset</text>
        </g>
        <!-- Stat 2 -->
        <g transform="translate(280, 0)">
          <rect width="240" height="130" rx="12" fill="#1b536e" />
          <text x="120" y="45" font-family="'Space Grotesk', system-ui, sans-serif" font-size="32" font-weight="bold" fill="#8fd7ff" text-anchor="middle">MST vs MDT</text>
          <text x="120" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="16" font-weight="600" fill="#f4fbff" text-anchor="middle">UTC−7 vs UTC−6</text>
        </g>
        <!-- Stat 3 -->
        <g transform="translate(560, 0)">
          <rect width="240" height="130" rx="12" fill="#1b536e" />
          <text x="120" y="45" font-family="'Space Grotesk', system-ui, sans-serif" font-size="24" font-weight="bold" fill="#fbbf24" text-anchor="middle">America/Denver</text>
          <text x="120" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="16" font-weight="600" fill="#f4fbff" text-anchor="middle">IANA Database Key</text>
        </g>
      </g>

      <!-- Details List -->
      <g transform="translate(50, 220)">
        <text x="0" y="30" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f4fbff">• Geographical Base: 105th Meridian West of Greenwich.</text>
        <text x="0" y="70" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f4fbff">• Coverage: Denver, Phoenix (Year-Round MST), Salt Lake City, Calgary, Edmonton.</text>
        <text x="0" y="110" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f4fbff">• Regional Rules: Arizona (except Navajo Nation) stays on MST year-round; others shift to MDT in summer.</text>
      </g>
    </g>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(200, 660)" text-anchor="middle">
    <rect width="800" height="60" rx="12" fill="#12455d" stroke="#2f6278" stroke-width="1.5" />
    <text x="400" y="38" font-family="'Manrope', system-ui, sans-serif" font-size="19" font-weight="600" fill="#f4fbff">
      Mountain Standard Time (MST, UTC−7) is exactly 7 hours behind Greenwich Mean Time (GMT, UTC+0).
    </text>
  </g>
</svg>
