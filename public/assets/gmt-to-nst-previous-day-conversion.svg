<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26" />
      <stop offset="100%" stop-color="#0f3c52" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0c354a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36c7b5" />
      <stop offset="100%" stop-color="#8fd7ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Header -->
  <g transform="translate(0, 80)" text-anchor="middle">
    <text x="600" y="40" font-family="'Space Grotesk', system-ui, sans-serif" font-size="40" font-weight="bold" fill="#f4fbff">GMT to NST Previous-Day Date Rollover</text>
    <text x="600" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="22" fill="#bdd2dc">GMT Times Before 03:30 AM Fall on the Previous Calendar Day in Newfoundland</text>
  </g>

  <!-- Timeline Cards -->
  <g transform="translate(100, 240)">
    <!-- Left Card: GMT Early Morning -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="450" height="320" rx="16" fill="url(#cardGrad)" stroke="#256e91" stroke-width="2" />
      <rect x="30" y="30" width="140" height="32" rx="16" fill="#1b536e" />
      <text x="100" y="52" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="bold" fill="#36c7b5" text-anchor="middle">GMT (UTC+0)</text>
      
      <text x="30" y="120" font-family="'Space Grotesk', system-ui, sans-serif" font-size="52" font-weight="bold" fill="#f4fbff">02:00 GMT</text>
      <text x="30" y="160" font-family="'Manrope', system-ui, sans-serif" font-size="22" font-weight="600" fill="#bdd2dc">2:00 AM GMT</text>
      
      <line x1="30" y1="190" x2="420" y2="190" stroke="#256e91" stroke-width="1.5" />
      
      <text x="30" y="235" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f4fbff">Date:</text>
      <text x="30" y="275" font-family="'Space Grotesk', system-ui, sans-serif" font-size="26" font-weight="bold" fill="#8fd7ff">January 15, 2027</text>
    </g>

    <!-- Arrow Connection -->
    <g transform="translate(470, 140)" text-anchor="middle">
      <path d="M0 20 L60 20" stroke="url(#accentGrad)" stroke-width="6" stroke-dasharray="8 6" />
      <polygon points="55,10 75,20 55,30" fill="#36c7b5" />
      <rect x="-35" y="-30" width="130" height="34" rx="17" fill="#1b536e" stroke="#36c7b5" stroke-width="1.5" />
      <text x="30" y="-8" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f4fbff">−3h 30m</text>
    </g>

    <!-- Right Card: NST Previous Day -->
    <g transform="translate(550, 0)" filter="url(#shadow)">
      <rect width="450" height="320" rx="16" fill="url(#cardGrad)" stroke="#36c7b5" stroke-width="3" />
      <rect x="30" y="30" width="190" height="32" rx="16" fill="#fbbf24" />
      <text x="125" y="52" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="bold" fill="#071b26" text-anchor="middle">PREVIOUS CALENDAR DAY</text>
      
      <text x="30" y="120" font-family="'Space Grotesk', system-ui, sans-serif" font-size="52" font-weight="bold" fill="#36c7b5">22:30 NST</text>
      <text x="30" y="160" font-family="'Manrope', system-ui, sans-serif" font-size="22" font-weight="600" fill="#bdd2dc">10:30 PM NST (Prev Day)</text>
      
      <line x1="30" y1="190" x2="420" y2="190" stroke="#256e91" stroke-width="1.5" />
      
      <text x="30" y="235" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f4fbff">Date:</text>
      <text x="30" y="275" font-family="'Space Grotesk', system-ui, sans-serif" font-size="26" font-weight="bold" fill="#fbbf24">January 14, 2027 (−1 Day)</text>
    </g>
  </g>

  <!-- Explanation Footer -->
  <g transform="translate(150, 640)" text-anchor="middle">
    <rect x="0" y="0" width="900" height="70" rx="14" fill="#12455d" stroke="#2f6278" stroke-width="1.5" />
    <text x="450" y="42" font-family="'Manrope', system-ui, sans-serif" font-size="19" font-weight="600" fill="#f4fbff">
      Crossing midnight 00:00 backward shifts the date to the previous day in Newfoundland Standard Time.
    </text>
  </g>
</svg>
