<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26" />
      <stop offset="100%" stop-color="#0f3c52" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0c354a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <g transform="translate(0, 70)" text-anchor="middle">
    <text x="600" y="40" font-family="'Space Grotesk', system-ui, sans-serif" font-size="40" font-weight="bold" fill="#f4fbff">EST vs. EDT Time Zone Difference</text>
    <text x="600" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="22" fill="#bdd2dc">Standard Winter Time (UTC-5) vs. Summer Daylight Saving Time (UTC-4)</text>
  </g>

  <!-- Comparison Cards -->
  <g transform="translate(100, 200)">
    <!-- Left Card: EST -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="460" height="420" rx="20" fill="url(#cardGrad)" stroke="#256e91" stroke-width="2" />
      <rect x="40" y="35" width="120" height="34" rx="17" fill="#1b536e" />
      <text x="100" y="57" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="bold" fill="#36c7b5" text-anchor="middle">WINTER</text>
      
      <text x="40" y="130" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="bold" fill="#f4fbff">EST</text>
      <text x="40" y="170" font-family="'Manrope', system-ui, sans-serif" font-size="22" font-weight="600" fill="#8fd7ff">Eastern Standard Time</text>
      
      <line x1="40" y1="200" x2="420" y2="200" stroke="#256e91" stroke-width="1.5" />
      
      <text x="40" y="245" font-family="'Manrope', system-ui, sans-serif" font-size="20" fill="#f4fbff">• <tspan font-weight="bold" fill="#36c7b5">UTC Offset:</tspan> UTC-05:00</text>
      <text x="40" y="290" font-family="'Manrope', system-ui, sans-serif" font-size="20" fill="#f4fbff">• <tspan font-weight="bold" fill="#36c7b5">Months:</tspan> Nov to March</text>
      <text x="40" y="335" font-family="'Manrope', system-ui, sans-serif" font-size="20" fill="#f4fbff">• <tspan font-weight="bold" fill="#36c7b5">Clock Shift:</tspan> Standard Time</text>
      <text x="40" y="380" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#bdd2dc">• 5 Hours Behind UTC / GMT</text>
    </g>

    <!-- Right Card: EDT -->
    <g transform="translate(540, 0)" filter="url(#shadow)">
      <rect width="460" height="420" rx="20" fill="url(#cardGrad)" stroke="#36c7b5" stroke-width="3" />
      <rect x="40" y="35" width="120" height="34" rx="17" fill="#fbbf24" />
      <text x="100" y="57" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="bold" fill="#071b26" text-anchor="middle">SUMMER</text>
      
      <text x="40" y="130" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="bold" fill="#36c7b5">EDT</text>
      <text x="40" y="170" font-family="'Manrope', system-ui, sans-serif" font-size="22" font-weight="600" fill="#8fd7ff">Eastern Daylight Time</text>
      
      <line x1="40" y1="200" x2="420" y2="200" stroke="#256e91" stroke-width="1.5" />
      
      <text x="40" y="245" font-family="'Manrope', system-ui, sans-serif" font-size="20" fill="#f4fbff">• <tspan font-weight="bold" fill="#36c7b5">UTC Offset:</tspan> UTC-04:00</text>
      <text x="40" y="290" font-family="'Manrope', system-ui, sans-serif" font-size="20" fill="#f4fbff">• <tspan font-weight="bold" fill="#36c7b5">Months:</tspan> March to Nov</text>
      <text x="40" y="335" font-family="'Manrope', system-ui, sans-serif" font-size="20" fill="#f4fbff">• <tspan font-weight="bold" fill="#36c7b5">Clock Shift:</tspan> +1 Hour Ahead of EST</text>
      <text x="40" y="380" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#bdd2dc">• 4 Hours Behind UTC / GMT</text>
    </g>
  </g>

  <!-- Footer Explanation -->
  <g transform="translate(150, 680)" text-anchor="middle">
    <rect x="0" y="0" width="900" height="60" rx="12" fill="#12455d" stroke="#2f6278" stroke-width="1.5" />
    <text x="450" y="38" font-family="'Manrope', system-ui, sans-serif" font-size="19" font-weight="bold" fill="#f4fbff">
      Eastern Time (ET) encompasses EST (UTC-5) in winter and EDT (UTC-4) in summer.
    </text>
  </g>
</svg>
