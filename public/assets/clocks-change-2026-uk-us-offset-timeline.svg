<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">UK and US Clocks Change 2026 Timezone Shift Timeline</title>
  <desc id="desc">Visual guide showing how the London–New York time difference changes from 5 hours to 4 hours during the gap week of October 25 to November 1, 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <style>
      .main-title { font: 800 42px 'Outfit', 'Inter', Arial, sans-serif; fill: #ffffff; letter-spacing: -0.02em; }
      .subtitle { font: 400 20px 'Inter', Arial, sans-serif; fill: #94a3b8; }
      
      .card-bg { rx: 20px; stroke-width: 1px; }
      .card-normal { fill: #1e293b; stroke: #334155; opacity: 0.85; }
      .card-active { fill: #2d1b4e; stroke: #6366f1; opacity: 0.95; }
      
      .period-tag { font: 800 15px 'Inter', Arial, sans-serif; fill: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
      .period-tag-active { font: 800 15px 'Inter', Arial, sans-serif; fill: #f59e0b; text-transform: uppercase; letter-spacing: 0.05em; }
      
      .date-label { font: 700 24px 'Outfit', 'Inter', Arial, sans-serif; fill: #ffffff; }
      .date-label-active { font: 700 26px 'Outfit', 'Inter', Arial, sans-serif; fill: #fbbf24; }
      
      .zone-title { font: 700 18px 'Inter', Arial, sans-serif; fill: #cbd5e1; }
      .zone-time { font: 800 28px 'Outfit', 'Inter', Arial, sans-serif; fill: #f8fafc; }
      
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; }
      .arrow-active { fill: none; stroke: #f59e0b; stroke-width: 4; stroke-linecap: round; }
      
      .offset-label { font: 800 36px 'Outfit', 'Inter', Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .offset-sub { font: 600 14px 'Inter', Arial, sans-serif; fill: #cbd5e1; text-anchor: middle; text-transform: uppercase; }
      
      .badge { font: 700 13px 'Inter', Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="720" fill="url(#bg)"/>
  
  <!-- Title & Subtitle -->
  <text x="60" y="80" class="main-title">UK &amp; US Clocks Change 2026: Timezone Shift</text>
  <text x="60" y="115" class="subtitle">How the London to New York time difference shifts during the autumn transition period</text>

  <!-- ================= CARD 1: BEFORE OCT 25 ================= -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="170" width="1080" height="135" class="card-bg card-normal"/>
    
    <!-- Left Column: Dates -->
    <text x="90" y="215" class="period-tag">Before October 25, 2026</text>
    <text x="90" y="255" class="date-label">Summer Offset</text>
    
    <!-- Middle Column: Zones -->
    <!-- London BST -->
    <g transform="translate(420, 195)">
      <text x="0" y="20" class="zone-title">London (BST)</text>
      <text x="0" y="55" class="zone-time">UTC +1</text>
    </g>
    
    <!-- Separation/Arrow -->
    <path d="M590,230 L670,230" class="arrow"/>
    <polygon points="670,225 680,230 670,235" fill="#64748b"/>
    
    <!-- New York EDT -->
    <g transform="translate(710, 195)">
      <text x="0" y="20" class="zone-title">New York (EDT)</text>
      <text x="0" y="55" class="zone-time">UTC -4</text>
    </g>
    
    <!-- Right Column: Time Difference -->
    <rect x="940" y="195" width="160" height="85" rx="10" fill="#334155"/>
    <text x="1020" y="238" class="offset-label">5 hrs</text>
    <text x="1020" y="262" class="offset-sub">London Ahead</text>
  </g>

  <!-- ================= CARD 2: THE GAP WEEK (ACTIVE) ================= -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="325" width="1080" height="155" class="card-bg card-active"/>
    
    <!-- Glowing Accent border for active card -->
    <rect x="60" y="325" width="1080" height="155" rx="20" fill="none" stroke="url(#highlightGrad)" stroke-width="3" opacity="0.8"/>
    
    <!-- Left Column: Dates -->
    <text x="90" y="375" class="period-tag-active">October 25 – November 1, 2026</text>
    <text x="90" y="415" class="date-label-active">The Gap Week</text>
    <rect x="90" y="432" width="170" height="26" rx="13" fill="#ef4444"/>
    <text x="175" y="449" class="badge">TEMPORARY SHIFT</text>
    
    <!-- Middle Column: Zones -->
    <!-- London GMT (Clocks went back) -->
    <g transform="translate(420, 360)">
      <text x="0" y="20" class="zone-title" fill="#a5b4fc">London (GMT)</text>
      <text x="0" y="55" class="zone-time" fill="#ffffff">UTC +0</text>
      <rect x="0" y="68" width="150" height="22" rx="4" fill="#ef4444" fill-opacity="0.2"/>
      <text x="8" y="84" font="700 12px 'Inter', Arial, sans-serif" fill="#f87171">Clocks went back Oct 25</text>
    </g>
    
    <!-- Separation/Arrow -->
    <path d="M590,395 L670,395" class="arrow-active"/>
    <polygon points="670,390 680,395 670,400" fill="#f59e0b"/>
    
    <!-- New York EDT (Still on daylight saving) -->
    <g transform="translate(710, 360)">
      <text x="0" y="20" class="zone-title" fill="#cbd5e1">New York (EDT)</text>
      <text x="0" y="55" class="zone-time" fill="#ffffff">UTC -4</text>
      <rect x="0" y="68" width="150" height="22" rx="4" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="8" y="84" font="700 12px 'Inter', Arial, sans-serif" fill="#fbbf24">Standard DST remains</text>
    </g>
    
    <!-- Right Column: Time Difference -->
    <rect x="940" y="360" width="160" height="85" rx="10" fill="#4c1d95" stroke="#ef4444" stroke-width="2"/>
    <text x="1020" y="403" class="offset-label" fill="#fbbf24">4 hrs</text>
    <text x="1020" y="427" class="offset-sub" fill="#e0e7ff">1 hour less</text>
  </g>

  <!-- ================= CARD 3: AFTER NOV 1 ================= -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="500" width="1080" height="135" class="card-bg card-normal"/>
    
    <!-- Left Column: Dates -->
    <text x="90" y="545" class="period-tag">After November 1, 2026</text>
    <text x="90" y="585" class="date-label">Winter Offset</text>
    
    <!-- Middle Column: Zones -->
    <!-- London GMT -->
    <g transform="translate(420, 525)">
      <text x="0" y="20" class="zone-title">London (GMT)</text>
      <text x="0" y="55" class="zone-time">UTC +0</text>
    </g>
    
    <!-- Separation/Arrow -->
    <path d="M590,560 L670,560" class="arrow"/>
    <polygon points="670,555 680,560 670,565" fill="#64748b"/>
    
    <!-- New York EST (Clocks went back) -->
    <g transform="translate(710, 525)">
      <text x="0" y="20" class="zone-title">New York (EST)</text>
      <text x="0" y="55" class="zone-time">UTC -5</text>
      <rect x="0" y="68" width="150" height="22" rx="4" fill="#f87171" fill-opacity="0.15"/>
      <text x="8" y="84" font="700 12px 'Inter', Arial, sans-serif" fill="#f87171">Clocks went back Nov 1</text>
    </g>
    
    <!-- Right Column: Time Difference -->
    <rect x="940" y="525" width="160" height="85" rx="10" fill="#334155"/>
    <text x="1020" y="568" class="offset-label">5 hrs</text>
    <text x="1020" y="592" class="offset-sub">Standard Winter Offset</text>
  </g>
  
  <!-- Footer Note -->
  <text x="60" y="675" font="600 14px 'Inter', Arial, sans-serif" fill="#64748b">Note: Standard summer/winter difference is 5 hours. The offset drops to 4 hours only during the 7-day transition gap.</text>
</svg>
