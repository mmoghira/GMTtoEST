<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041018" />
      <stop offset="50%" stop-color="#0c354a" />
      <stop offset="100%" stop-color="#12455d" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16516d" />
      <stop offset="100%" stop-color="#0d3a50" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36c7b5" />
      <stop offset="100%" stop-color="#8fd7ff" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bgGrad)" />

  <!-- Background decorative grid / calendar lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="540" />
    <line x1="240" y1="0" x2="240" y2="540" />
    <line x1="360" y1="0" x2="360" y2="540" />
    <line x1="480" y1="0" x2="480" y2="540" />
    <line x1="600" y1="0" x2="600" y2="540" />
    <line x1="720" y1="0" x2="720" y2="540" />
    <line x1="840" y1="0" x2="840" y2="540" />
    <line x1="0" y1="100" x2="960" y2="100" />
    <line x1="0" y1="200" x2="960" y2="200" />
    <line x1="0" y1="300" x2="960" y2="300" />
    <line x1="0" y1="400" x2="960" y2="400" />
  </g>

  <!-- Title / Badge -->
  <g transform="translate(480, 50)" text-anchor="middle">
    <rect x="-140" y="0" width="280" height="32" rx="16" fill="rgba(54, 199, 181, 0.15)" stroke="#36c7b5" stroke-width="1.5" />
    <text x="0" y="21" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#36c7b5" letter-spacing="1.5">DATE INTERVAL CALCULATOR</text>
    <text x="0" y="65" font-family="'Space Grotesk', system-ui, sans-serif" font-size="32" font-weight="800" fill="#f4fbff">Count Days Between Any Two Dates</text>
  </g>

  <!-- Main Comparison Diagram (Interactive Example) -->
  <g transform="translate(60, 160)">
    <!-- Start Date Card -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="240" height="230" rx="16" fill="url(#cardGrad)" stroke="#2f6278" stroke-width="2" />
      <rect x="0" y="0" width="240" height="48" rx="16" fill="#1b5f80" />
      <rect x="0" y="32" width="240" height="16" fill="#1b5f80" />
      <text x="120" y="31" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="700" fill="#8fd7ff" text-anchor="middle">START DATE</text>
      
      <text x="120" y="105" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">SEP 22</text>
      <text x="120" y="136" font-family="'Manrope', system-ui, sans-serif" font-size="16" font-weight="600" fill="#36c7b5" text-anchor="middle">Tuesday, 2026</text>
      
      <line x1="24" y1="158" x2="216" y2="158" stroke="#256e91" stroke-width="1" />
      <text x="120" y="192" font-family="'Manrope', system-ui, sans-serif" font-size="13" fill="#bdd2dc" text-anchor="middle">Baseline (Day 0)</text>
    </g>

    <!-- Center Calculation Connector & Metric Cards -->
    <g transform="translate(260, 20)" text-anchor="middle">
      <!-- Horizontal span line -->
      <path d="M 0 50 L 320 50" stroke="url(#tealGrad)" stroke-width="5" stroke-linecap="round" />
      <!-- Arrowheads -->
      <polygon points="315,44 328,50 315,56" fill="#8fd7ff" />
      
      <!-- Center Result Pill -->
      <g transform="translate(160, 50)">
        <rect x="-110" y="-36" width="220" height="72" rx="36" fill="#071b26" stroke="#36c7b5" stroke-width="2.5" filter="url(#shadow)" />
        <text x="0" y="-4" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="800" fill="#36c7b5">66 DAYS</text>
        <text x="0" y="20" font-family="'Manrope', system-ui, sans-serif" font-size="13" font-weight="600" fill="#8fd7ff">9 WEEKS + 3 DAYS</text>
      </g>

      <!-- Sub breakdown boxes -->
      <g transform="translate(60, 140)">
        <rect x="-50" y="0" width="100" height="54" rx="10" fill="#0c354a" stroke="#2f6278" stroke-width="1.5" />
        <text x="0" y="24" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="800" fill="#f4fbff">48</text>
        <text x="0" y="42" font-family="'Manrope', system-ui, sans-serif" font-size="11" font-weight="700" fill="#bdd2dc">WEEKDAYS</text>
      </g>
      <g transform="translate(160, 140)">
        <rect x="-40" y="0" width="80" height="54" rx="10" fill="#0c354a" stroke="#2f6278" stroke-width="1.5" />
        <text x="0" y="24" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="800" fill="#fbbf24">+1</text>
        <text x="0" y="42" font-family="'Manrope', system-ui, sans-serif" font-size="11" font-weight="700" fill="#bdd2dc">IF INCL. END</text>
      </g>
      <g transform="translate(260, 140)">
        <rect x="-50" y="0" width="100" height="54" rx="10" fill="#0c354a" stroke="#2f6278" stroke-width="1.5" />
        <text x="0" y="24" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="800" fill="#f4fbff">18</text>
        <text x="0" y="42" font-family="'Manrope', system-ui, sans-serif" font-size="11" font-weight="700" fill="#bdd2dc">WEEKENDS</text>
      </g>
    </g>

    <!-- End Date Card -->
    <g transform="translate(600, 0)" filter="url(#shadow)">
      <rect width="240" height="230" rx="16" fill="url(#cardGrad)" stroke="#36c7b5" stroke-width="2" />
      <rect x="0" y="0" width="240" height="48" rx="16" fill="#1b5f80" />
      <rect x="0" y="32" width="240" height="16" fill="#1b5f80" />
      <text x="120" y="31" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="700" fill="#36c7b5" text-anchor="middle">END DATE</text>
      
      <text x="120" y="105" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">NOV 27</text>
      <text x="120" y="136" font-family="'Manrope', system-ui, sans-serif" font-size="16" font-weight="600" fill="#8fd7ff" text-anchor="middle">Friday, 2026</text>
      
      <line x1="24" y1="158" x2="216" y2="158" stroke="#256e91" stroke-width="1" />
      <text x="120" y="192" font-family="'Manrope', system-ui, sans-serif" font-size="13" fill="#bdd2dc" text-anchor="middle">67 Days Inclusive</text>
    </g>
  </g>

  <!-- Bottom feature pills -->
  <g transform="translate(480, 475)" text-anchor="middle">
    <text font-family="'Manrope', system-ui, sans-serif" font-size="14" fill="#bdd2dc">
      Includes Calendar Days  •  Weeks &amp; Remaining Days  •  Weekdays (Mon–Fri)  •  Weekend Days (Sat–Sun)  •  Leap Year Aware
    </text>
  </g>
</svg>