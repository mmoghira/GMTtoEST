
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="45" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">New York Annual Time Cycle</text>
  
  <g transform="translate(80, 160)">
    <line x1="0" y1="50" x2="640" y2="50" stroke="#334155" stroke-width="4"/>
    
    <!-- Jan-March (EST) -->
    <rect x="0" y="20" width="120" height="20" fill="#38bdf8" opacity="0.3"/>
    <text x="60" y="12" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Jan - Mar (EST)</text>
    
    <!-- DST Starts (2nd Sun March) -->
    <g transform="translate(120, 50)">
      <circle cx="0" cy="0" r="8" fill="#f59e0b" filter="drop-shadow(0 0 6px #f59e0b)"/>
      <line x1="0" y1="0" x2="0" y2="-40" stroke="#f59e0b" stroke-width="2"/>
      <text x="0" y="-45" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="bold">DST Starts (+1h)</text>
      <text x="0" y="70" font-family="'Manrope', sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">March</text>
    </g>

    <!-- March-November (EDT) -->
    <rect x="120" y="20" width="400" height="20" fill="#f59e0b" opacity="0.3"/>
    <text x="320" y="12" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">Mar - Nov (EDT)</text>

    <!-- DST Ends (1st Sun Nov) -->
    <g transform="translate(520, 50)">
      <circle cx="0" cy="0" r="8" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)"/>
      <line x1="0" y1="0" x2="0" y2="-40" stroke="#38bdf8" stroke-width="2"/>
      <text x="0" y="-45" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="bold">DST Ends (-1h)</text>
      <text x="0" y="70" font-family="'Manrope', sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">November</text>
    </g>

    <!-- Nov-Dec (EST) -->
    <rect x="520" y="20" width="120" height="20" fill="#38bdf8" opacity="0.3"/>
    <text x="580" y="12" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Nov - Dec (EST)</text>
  </g>
</svg>
