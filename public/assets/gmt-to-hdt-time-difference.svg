<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26" />
      <stop offset="100%" stop-color="#0f3c52" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0c354a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36c7b5" />
      <stop offset="100%" stop-color="#8fd7ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Header Text -->
  <g transform="translate(0, 80)" text-anchor="middle">
    <text x="600" y="40" font-family="'Space Grotesk', system-ui, sans-serif" font-size="42" font-weight="bold" fill="#f4fbff">GMT to HDT Time Difference</text>
    <text x="600" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="22" fill="#bdd2dc">Greenwich Mean Time (UTC+0) to Hawaii-Aleutian Daylight Time (UTC−9)</text>
  </g>

  <!-- Flow Visual -->
  <g transform="translate(300, 240)">
    <!-- Top Box: GMT -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="600" height="130" rx="16" fill="url(#cardGrad)" stroke="#256e91" stroke-width="2" />
      <circle cx="60" cy="65" r="30" fill="#1b536e" />
      <circle cx="60" cy="65" r="18" fill="none" stroke="#36c7b5" stroke-width="3" />
      <path d="M60 53 L60 65 L70 65" stroke="#36c7b5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="110" y="55" font-family="'Space Grotesk', system-ui, sans-serif" font-size="32" font-weight="bold" fill="#f4fbff">GMT (Greenwich Mean Time)</text>
      <text x="110" y="92" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="600" fill="#36c7b5">UTC+0 — Prime Meridian Standard</text>
    </g>

    <!-- Arrow down -->
    <g transform="translate(300, 155)" text-anchor="middle">
      <path d="M0 0 L0 55" stroke="url(#accentGrad)" stroke-width="6" stroke-dasharray="8 6" />
      <polygon points="-12,50 0,70 12,50" fill="#36c7b5" />
      <rect x="-80" y="15" width="160" height="34" rx="17" fill="#1b536e" stroke="#36c7b5" stroke-width="1.5" />
      <text x="0" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-size="18" font-weight="bold" fill="#f4fbff">−9 Hours</text>
    </g>

    <!-- Bottom Box: HDT -->
    <g transform="translate(0, 250)" filter="url(#shadow)">
      <rect width="600" height="130" rx="16" fill="url(#cardGrad)" stroke="#36c7b5" stroke-width="3" />
      <circle cx="60" cy="65" r="30" fill="#1b536e" />
      <circle cx="60" cy="65" r="18" fill="none" stroke="#8fd7ff" stroke-width="3" />
      <path d="M60 53 L60 65 L45 75" stroke="#8fd7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="110" y="55" font-family="'Space Grotesk', system-ui, sans-serif" font-size="32" font-weight="bold" fill="#f4fbff">HDT (Hawaii-Aleutian Daylight)</text>
      <text x="110" y="92" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="600" fill="#8fd7ff">UTC−9 — Aleutian Islands DST Offset</text>
    </g>
  </g>

  <!-- Summary Banner -->
  <g transform="translate(200, 680)">
    <rect width="800" height="60" rx="12" fill="#12455d" stroke="#2f6278" stroke-width="1.5" />
    <text x="400" y="38" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f4fbff" text-anchor="middle">
      Formula: <tspan fill="#36c7b5">HDT = GMT − 9 Hours</tspan> (HDT is 9 hours behind GMT)
    </text>
  </g>
</svg>
