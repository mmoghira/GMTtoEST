
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="45" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">New York vs Major World Time Zones</text>
  
  <g transform="translate(50, 100)">
    <!-- Column Headers -->
    <rect width="700" height="40" fill="#1e293b" rx="4"/>
    <text x="50" y="25" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">City / Region</text>
    <text x="250" y="25" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">Standard Time Zone</text>
    <text x="450" y="25" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">Winter Offset</text>
    <text x="600" y="25" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">Summer Offset</text>
    
    <!-- Row 1: New York -->
    <g transform="translate(0, 50)">
      <text x="50" y="20" font-family="'Manrope', sans-serif" font-size="12" fill="#f59e0b" font-weight="bold">New York (USA)</text>
      <text x="250" y="20" font-family="'Manrope', sans-serif" font-size="12" fill="#e2e8f0">Eastern Time (ET)</text>
      <text x="450" y="20" font-family="'Manrope', sans-serif" font-size="12" fill="#38bdf8" font-weight="bold">UTC-5 (EST)</text>
      <text x="600" y="20" font-family="'Manrope', sans-serif" font-size="12" fill="#f59e0b" font-weight="bold">UTC-4 (EDT)</text>
      <line x1="0" y1="35" x2="700" y2="35" stroke="#334155" stroke-width="1"/>
    </g>
    
    <!-- Row 2: London -->
    <g transform="translate(0, 100)">
      <text x="50" y="20" font-family="'Manrope', sans-serif" font-size="12" fill="#38bdf8" font-weight="bold">London (UK)</text>
      <text x="250" y="20" font-family="'Manrope', sans-serif" font-size="12" fill="#e2e8f0">GMT / BST</text>
      <text x="450" y="20" font-family="'Manrope', sans-serif" font-size="12" fill="#e2e8f0">UTC+0 (London is 5h ahead)</text>
      <text x="600" y="20" font-family="'Manrope', sans-serif" font-size="12" fill="#e2e8f0">UTC+1 (London is 5h ahead)</text>
      <line x1="0" y1="35" x2="700" y2="35" stroke="#334155" stroke-width="1"/>
    </g>

    <!-- Row 3: Los Angeles -->
    <g transform="translate(0, 150)">
      <text x="50" y="20" font-family="'Manrope', sans-serif" font-size="12" fill="#38bdf8" font-weight="bold">Los Angeles (USA)</text>
      <text x="250" y="20" font-family="'Manrope', sans-serif" font-size="12" fill="#e2e8f0">Pacific Time (PT)</text>
      <text x="450" y="20" font-family="'Manrope', sans-serif" font-size="12" fill="#e2e8f0">UTC-8 (LA is 3h behind)</text>
      <text x="600" y="20" font-family="'Manrope', sans-serif" font-size="12" fill="#e2e8f0">UTC-7 (LA is 3h behind)</text>
      <line x1="0" y1="35" x2="700" y2="35" stroke="#334155" stroke-width="1"/>
    </g>

    <!-- Row 4: Tokyo -->
    <g transform="translate(0, 200)">
      <text x="50" y="20" font-family="'Manrope', sans-serif" font-size="12" fill="#38bdf8" font-weight="bold">Tokyo (Japan)</text>
      <text x="250" y="20" font-family="'Manrope', sans-serif" font-size="12" fill="#e2e8f0">JST</text>
      <text x="450" y="20" font-family="'Manrope', sans-serif" font-size="12" fill="#e2e8f0">UTC+9 (Tokyo is 14h ahead)</text>
      <text x="600" y="20" font-family="'Manrope', sans-serif" font-size="12" fill="#e2e8f0">UTC+9 (Tokyo is 13h ahead)</text>
      <line x1="0" y1="35" x2="700" y2="35" stroke="#334155" stroke-width="1"/>
    </g>
  </g>
</svg>
