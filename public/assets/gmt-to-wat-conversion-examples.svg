<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26" />
      <stop offset="100%" stop-color="#0f3c52" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0c354a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <g transform="translate(0, 70)" text-anchor="middle">
    <text x="600" y="40" font-family="'Space Grotesk', system-ui, sans-serif" font-size="40" font-weight="bold" fill="#f4fbff">GMT to WAT 24-Hour Conversion Highlights</text>
    <text x="600" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="22" fill="#bdd2dc">Key Time Milestones Showing the 1-Hour Forward Clock Shift</text>
  </g>

  <!-- Grid of Examples -->
  <g transform="translate(100, 190)">
    <!-- Row 1 Left -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="460" height="120" rx="14" fill="url(#cardGrad)" stroke="#256e91" stroke-width="2" />
      <text x="30" y="45" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="bold" fill="#f4fbff">00:00 GMT</text>
      <text x="30" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#36c7b5">→ 01:00 WAT (1:00 AM WAT)</text>
    </g>

    <!-- Row 1 Right -->
    <g transform="translate(540, 0)" filter="url(#shadow)">
      <rect width="460" height="120" rx="14" fill="url(#cardGrad)" stroke="#256e91" stroke-width="2" />
      <text x="30" y="45" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="bold" fill="#f4fbff">06:00 GMT</text>
      <text x="30" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#36c7b5">→ 07:00 WAT (7:00 AM WAT)</text>
    </g>

    <!-- Row 2 Left -->
    <g transform="translate(0, 160)" filter="url(#shadow)">
      <rect width="460" height="120" rx="14" fill="url(#cardGrad)" stroke="#256e91" stroke-width="2" />
      <text x="30" y="45" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="bold" fill="#f4fbff">12:00 GMT (Noon)</text>
      <text x="30" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#36c7b5">→ 13:00 WAT (1:00 PM WAT)</text>
    </g>

    <!-- Row 2 Right -->
    <g transform="translate(540, 160)" filter="url(#shadow)">
      <rect width="460" height="120" rx="14" fill="url(#cardGrad)" stroke="#256e91" stroke-width="2" />
      <text x="30" y="45" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="bold" fill="#f4fbff">18:00 GMT</text>
      <text x="30" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#36c7b5">→ 19:00 WAT (7:00 PM WAT)</text>
    </g>

    <!-- Row 3 Special Midnight Rollover -->
    <g transform="translate(0, 320)" filter="url(#shadow)">
      <rect width="1000" height="120" rx="14" fill="url(#cardGrad)" stroke="#36c7b5" stroke-width="3" />
      <rect x="30" y="25" width="160" height="30" rx="15" fill="#fbbf24" />
      <text x="110" y="45" font-family="'Manrope', system-ui, sans-serif" font-size="13" font-weight="bold" fill="#071b26" text-anchor="middle">MIDNIGHT ROLLOVER</text>
      <text x="210" y="48" font-family="'Space Grotesk', system-ui, sans-serif" font-size="26" font-weight="bold" fill="#f4fbff">23:00 GMT</text>
      <text x="30" y="92" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="bold" fill="#36c7b5">→ 00:00 WAT (12:00 AM Midnight NEXT DAY in West Africa)</text>
    </g>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(200, 680)">
    <rect width="800" height="55" rx="12" fill="#12455d" stroke="#2f6278" stroke-width="1.5" />
    <text x="400" y="35" font-family="'Manrope', system-ui, sans-serif" font-size="18" font-weight="bold" fill="#f4fbff" text-anchor="middle">
      WAT is consistently 1 hour ahead of GMT (UTC+1 vs UTC+0).
    </text>
  </g>
</svg>
