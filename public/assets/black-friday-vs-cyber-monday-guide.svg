
  <svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="vsBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0a1926"/>
        <stop offset="100%" stop-color="#0f2b3e"/>
      </linearGradient>
      <linearGradient id="bfCard" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1e293b"/>
        <stop offset="100%" stop-color="#0f172a"/>
      </linearGradient>
      <linearGradient id="cmCard" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#3b0764"/>
        <stop offset="100%" stop-color="#1e1b4b"/>
      </linearGradient>
    </defs>

    <rect width="800" height="450" fill="url(#vsBg)"/>

    <text x="40" y="44" fill="#36c7b5" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">SHOPPING STRATEGY</text>
    <text x="40" y="74" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800">Black Friday vs. Cyber Monday: Key Differences</text>

    <!-- Side 1: Black Friday -->
    <rect x="40" y="105" width="345" height="305" rx="12" fill="url(#bfCard)" stroke="#fbbf24" stroke-width="2"/>
    <rect x="56" y="125" width="110" height="26" rx="6" fill="#fbbf24"/>
    <text x="68" y="142" fill="#0c354a" font-family="system-ui, sans-serif" font-size="12" font-weight="900">BLACK FRIDAY</text>
    <text x="56" y="185" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800">Friday, Nov 27, 2026</text>
    <text x="56" y="210" fill="#fde68a" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Retail &amp; Hybrid Shopping</text>
    <line x1="56" y1="225" x2="365" y2="225" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

    <text x="56" y="252" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Best For:</text>
    <text x="56" y="274" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• Major home appliances &amp; TVs</text>
    <text x="56" y="296" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• In-store doorbusters &amp; department stores</text>
    <text x="56" y="318" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• Apparel, footwear &amp; holiday gifts</text>

    <text x="56" y="355" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Environment:</text>
    <text x="56" y="377" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Physical mall lines + early website launches</text>

    <!-- Side 2: Cyber Monday -->
    <rect x="415" y="105" width="345" height="305" rx="12" fill="url(#cmCard)" stroke="#c084fc" stroke-width="2"/>
    <rect x="431" y="125" width="115" height="26" rx="6" fill="#c084fc"/>
    <text x="443" y="142" fill="#1e1b4b" font-family="system-ui, sans-serif" font-size="12" font-weight="900">CYBER MONDAY</text>
    <text x="431" y="185" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800">Monday, Nov 30, 2026</text>
    <text x="431" y="210" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">100% Digital / E-Commerce</text>
    <line x1="431" y1="225" x2="740" y2="225" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

    <text x="431" y="252" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Best For:</text>
    <text x="431" y="274" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Tech gadgets, laptops &amp; PC components</text>
    <text x="431" y="296" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Digital subscriptions, software &amp; gaming</text>
    <text x="431" y="318" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Site-wide online coupon codes &amp; free shipping</text>

    <text x="431" y="355" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Environment:</text>
    <text x="431" y="377" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Desktop &amp; mobile web, instant checkout</text>
  </svg>
  