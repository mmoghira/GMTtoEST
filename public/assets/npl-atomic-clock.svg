
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="45" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">CSIR-NPL New Delhi Atomic Clock Synchronizer</text>
  
  <!-- Central Atomic Clock Unit -->
  <g transform="translate(250, 120)">
    <rect width="300" height="180" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="3" filter="drop-shadow(0 0 10px #38bdf8)"/>
    <text x="150" y="35" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">Cs / H-Maser Clock Arrays</text>
    <line x1="20" y1="60" x2="280" y2="60" stroke="#334155" stroke-width="2"/>
    
    <!-- Oscilloscope graphic -->
    <path d="M 30,120 L 70,120 L 90,90 L 110,150 L 130,120 L 170,120 L 190,80 L 210,160 L 230,120 L 270,120" fill="none" stroke="#10b981" stroke-width="3" filter="drop-shadow(0 0 4px #10b981)"/>
    
    <text x="150" y="165" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="middle">Precision Accuracy: &lt; 20 Nanoseconds</text>
  </g>
  
  <!-- Outputs -->
  <g transform="translate(100, 340)">
    <rect width="180" height="60" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="90" y="25" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">National Telecom Network</text>
    <text x="90" y="45" font-family="'Manrope', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Standard Time Signals</text>
  </g>

  <g transform="translate(520, 340)">
    <rect width="180" height="60" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="90" y="25" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#f59e0b" text-anchor="middle">GPS &amp; Satellites</text>
    <text x="90" y="45" font-family="'Manrope', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">BIPM Paris Synchronization</text>
  </g>

  <!-- Connectors -->
  <line x1="280" y1="300" x2="190" y2="340" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="520" y1="300" x2="610" y2="340" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
</svg>
