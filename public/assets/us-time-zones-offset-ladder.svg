<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="eastGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="centralGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="pacificGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="alaskaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="hawaiiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Title & Header -->
  <text x="500" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">THE 6 MAJOR U.S. TIME ZONES: OFFSET &amp; TIME PROGRESSION</text>
  <text x="500" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">East to West Sequential 1-Hour Time Ladder across the United States</text>

  <!-- Card 1: Eastern -->
  <g transform="translate(60, 95)" filter="url(#cardShadow)">
    <rect width="880" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="8" height="70" rx="4" fill="url(#eastGrad)"/>
    <text x="28" y="32" font-family="sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Eastern Time (ET)</text>
    <text x="28" y="52" font-family="sans-serif" font-size="13" fill="#94a3b8">Standard: <tspan fill="#38bdf8" font-weight="600">EST (UTC−5)</tspan> • Daylight: <tspan fill="#38bdf8" font-weight="600">EDT (UTC−4)</tspan></text>
    <rect x="540" y="16" width="160" height="38" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="620" y="40" font-family="sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle">Baseline (e.g. 12:00 PM)</text>
    <rect x="720" y="16" width="140" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="790" y="40" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">New York, Miami</text>
  </g>

  <!-- Down Arrow 1 -->
  <path d="M 500 168 L 500 178 M 495 174 L 500 179 L 505 174" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <text x="525" y="177" font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">−1 Hour</text>

  <!-- Card 2: Central -->
  <g transform="translate(60, 182)" filter="url(#cardShadow)">
    <rect width="880" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="8" height="70" rx="4" fill="url(#centralGrad)"/>
    <text x="28" y="32" font-family="sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Central Time (CT)</text>
    <text x="28" y="52" font-family="sans-serif" font-size="13" fill="#94a3b8">Standard: <tspan fill="#2dd4bf" font-weight="600">CST (UTC−6)</tspan> • Daylight: <tspan fill="#2dd4bf" font-weight="600">CDT (UTC−5)</tspan></text>
    <rect x="540" y="16" width="160" height="38" rx="6" fill="#0f172a" stroke="#0d9488" stroke-width="1"/>
    <text x="620" y="40" font-family="sans-serif" font-size="14" font-weight="600" fill="#2dd4bf" text-anchor="middle">11:00 AM (−1 hr)</text>
    <rect x="720" y="16" width="140" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="790" y="40" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Chicago, Dallas</text>
  </g>

  <!-- Down Arrow 2 -->
  <path d="M 500 255 L 500 265 M 495 261 L 500 266 L 505 261" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <text x="525" y="264" font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">−1 Hour</text>

  <!-- Card 3: Mountain -->
  <g transform="translate(60, 269)" filter="url(#cardShadow)">
    <rect width="880" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="8" height="70" rx="4" fill="url(#mountainGrad)"/>
    <text x="28" y="32" font-family="sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Mountain Time (MT)</text>
    <text x="28" y="52" font-family="sans-serif" font-size="13" fill="#94a3b8">Standard: <tspan fill="#fbbf24" font-weight="600">MST (UTC−7)</tspan> • Daylight: <tspan fill="#fbbf24" font-weight="600">MDT (UTC−6)</tspan> <tspan fill="#f59e0b" font-weight="600">(AZ no DST)</tspan></text>
    <rect x="540" y="16" width="160" height="38" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
    <text x="620" y="40" font-family="sans-serif" font-size="14" font-weight="600" fill="#fbbf24" text-anchor="middle">10:00 AM (−2 hrs)</text>
    <rect x="720" y="16" width="140" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="790" y="40" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Denver, Phoenix</text>
  </g>

  <!-- Down Arrow 3 -->
  <path d="M 500 342 L 500 352 M 495 348 L 500 353 L 505 348" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <text x="525" y="351" font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">−1 Hour</text>

  <!-- Card 4: Pacific -->
  <g transform="translate(60, 356)" filter="url(#cardShadow)">
    <rect width="880" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="8" height="70" rx="4" fill="url(#pacificGrad)"/>
    <text x="28" y="32" font-family="sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Pacific Time (PT)</text>
    <text x="28" y="52" font-family="sans-serif" font-size="13" fill="#94a3b8">Standard: <tspan fill="#fb923c" font-weight="600">PST (UTC−8)</tspan> • Daylight: <tspan fill="#fb923c" font-weight="600">PDT (UTC−7)</tspan></text>
    <rect x="540" y="16" width="160" height="38" rx="6" fill="#0f172a" stroke="#ea580c" stroke-width="1"/>
    <text x="620" y="40" font-family="sans-serif" font-size="14" font-weight="600" fill="#fb923c" text-anchor="middle">9:00 AM (−3 hrs)</text>
    <rect x="720" y="16" width="140" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="790" y="40" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Los Angeles, Seattle</text>
  </g>

  <!-- Down Arrow 4 -->
  <path d="M 500 429 L 500 439 M 495 435 L 500 440 L 505 435" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <text x="525" y="438" font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">−1 Hour</text>

  <!-- Card 5: Alaska -->
  <g transform="translate(60, 443)" filter="url(#cardShadow)">
    <rect width="880" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="8" height="70" rx="4" fill="url(#alaskaGrad)"/>
    <text x="28" y="32" font-family="sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Alaska Time (AKT)</text>
    <text x="28" y="52" font-family="sans-serif" font-size="13" fill="#94a3b8">Standard: <tspan fill="#a5b4fc" font-weight="600">AKST (UTC−9)</tspan> • Daylight: <tspan fill="#a5b4fc" font-weight="600">AKDT (UTC−8)</tspan></text>
    <rect x="540" y="16" width="160" height="38" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
    <text x="620" y="40" font-family="sans-serif" font-size="14" font-weight="600" fill="#a5b4fc" text-anchor="middle">8:00 AM (−4 hrs)</text>
    <rect x="720" y="16" width="140" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="790" y="40" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Anchorage, Juneau</text>
  </g>

  <!-- Down Arrow 5 -->
  <path d="M 500 516 L 500 526 M 495 522 L 500 527 L 505 522" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <text x="525" y="525" font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">−1 Hour (winter) / −2 Hours (summer)</text>

  <!-- Card 6: Hawaii -->
  <g transform="translate(60, 530)" filter="url(#cardShadow)">
    <rect width="880" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="8" height="70" rx="4" fill="url(#hawaiiGrad)"/>
    <text x="28" y="32" font-family="sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Hawaii-Aleutian Time (HAT)</text>
    <text x="28" y="52" font-family="sans-serif" font-size="13" fill="#94a3b8">Standard: <tspan fill="#f472b6" font-weight="600">HST (UTC−10)</tspan> • <tspan fill="#fb7185" font-weight="600">Hawaii does NOT observe DST</tspan></text>
    <rect x="540" y="16" width="160" height="38" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
    <text x="620" y="40" font-family="sans-serif" font-size="14" font-weight="600" fill="#f472b6" text-anchor="middle">7:00 AM (or 6:00 AM)</text>
    <rect x="720" y="16" width="140" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="790" y="40" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Honolulu, Hilo</text>
  </g>
</svg>
