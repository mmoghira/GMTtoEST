<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Remote team board for KST and Eastern Time collaboration</title>
  <desc id="desc">A custom office collaboration illustration with video tiles, calendars, sprint cards, and digital clocks for Seoul and New York.</desc>
  <defs>
    <linearGradient id="wall" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#09243a"/>
      <stop offset="1" stop-color="#123f49"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" x2="1">
      <stop offset="0" stop-color="#1c5366"/>
      <stop offset="1" stop-color="#0b2736"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#wall)"/>
  <rect x="60" y="72" width="1080" height="500" rx="16" fill="#07131f" opacity="0.52" stroke="#2f7584"/>
  <g transform="translate(100 112)">
    <rect width="434" height="254" rx="12" fill="#10364f" stroke="#36c7b5"/>
    <text x="26" y="42" fill="#8ff5e6" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800">Seoul product room</text>
    <rect x="26" y="68" width="178" height="132" rx="8" fill="#164f61"/>
    <circle cx="85" cy="124" r="28" fill="#f4c65f"/>
    <path d="M43 184 C67 150 105 150 128 184 Z" fill="#36c7b5"/>
    <rect x="230" y="68" width="178" height="132" rx="8" fill="#0d2b40"/>
    <circle cx="292" cy="124" r="28" fill="#8fd7ff"/>
    <path d="M249 184 C274 152 310 151 335 184 Z" fill="#f49a6a"/>
    <rect x="26" y="218" width="382" height="12" rx="6" fill="#36c7b5" opacity="0.68"/>
  </g>
  <g transform="translate(666 112)">
    <rect width="434" height="254" rx="12" fill="#10364f" stroke="#f3b34f"/>
    <text x="26" y="42" fill="#ffd996" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800">New York operations</text>
    <rect x="26" y="68" width="178" height="132" rx="8" fill="#11324a"/>
    <circle cx="85" cy="124" r="28" fill="#f3b34f"/>
    <path d="M43 184 C67 150 105 150 128 184 Z" fill="#8fd7ff"/>
    <rect x="230" y="68" width="178" height="132" rx="8" fill="#164f61"/>
    <circle cx="292" cy="124" r="28" fill="#36c7b5"/>
    <path d="M249 184 C274 152 310 151 335 184 Z" fill="#f4c65f"/>
    <rect x="26" y="218" width="382" height="12" rx="6" fill="#f3b34f" opacity="0.7"/>
  </g>
  <path d="M535 238 H664" stroke="#dff8ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 14" opacity="0.64"/>
  <g transform="translate(114 414)">
    <rect width="260" height="112" rx="8" fill="#0b2b3e" stroke="#2f7584"/>
    <text x="18" y="34" fill="#ffffff" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800">Launch gate</text>
    <text x="18" y="66" fill="#8fd7ff" font-family="Space Grotesk, Arial, sans-serif" font-size="26" font-weight="700">10:00 KST</text>
    <text x="18" y="92" fill="#bdd2dc" font-family="Manrope, Arial, sans-serif" font-size="16">QA signoff in Seoul</text>
  </g>
  <g transform="translate(470 414)">
    <rect width="260" height="112" rx="8" fill="#0b2b3e" stroke="#2f7584"/>
    <text x="18" y="34" fill="#ffffff" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800">Support note</text>
    <text x="18" y="66" fill="#f3b34f" font-family="Space Grotesk, Arial, sans-serif" font-size="26" font-weight="700">9 PM ET</text>
    <text x="18" y="92" fill="#bdd2dc" font-family="Manrope, Arial, sans-serif" font-size="16">Previous evening window</text>
  </g>
  <g transform="translate(826 414)">
    <rect width="260" height="112" rx="8" fill="#0b2b3e" stroke="#2f7584"/>
    <text x="18" y="34" fill="#ffffff" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800">Sprint handoff</text>
    <text x="18" y="66" fill="#36c7b5" font-family="Space Grotesk, Arial, sans-serif" font-size="26" font-weight="700">Copied</text>
    <text x="18" y="92" fill="#bdd2dc" font-family="Manrope, Arial, sans-serif" font-size="16">Plain text for Slack</text>
  </g>
  <rect x="0" y="610" width="1200" height="110" fill="url(#desk)"/>
  <g transform="translate(410 592)">
    <rect width="380" height="72" rx="10" fill="#061721" stroke="#3dd8c5"/>
    <text x="28" y="44" fill="#ffffff" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="800">One invite, two readable local times</text>
