
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="45" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="middle">India Time Zone Map &amp; Standard Meridian</text>
  
  <!-- Stylized Outline of India Map -->
  <path d="M 350,150 L 370,120 L 390,130 L 410,100 L 430,120 L 430,150 L 450,160 L 480,180 L 520,180 L 530,220 L 570,230 L 570,250 L 540,260 L 510,260 L 490,280 L 520,300 L 550,300 L 550,320 L 510,330 L 490,360 L 470,390 L 450,440 L 430,480 L 420,520 L 410,540 L 400,520 L 380,470 L 370,440 L 360,400 L 350,360 L 330,340 L 310,340 L 290,320 L 250,320 L 240,300 L 260,280 L 280,280 L 300,260 L 320,260 L 310,230 L 330,200 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- 82.5° E Standard Meridian Line -->
  <line x1="410" y1="100" x2="410" y2="540" stroke="#f59e0b" stroke-dasharray="8,5" stroke-width="3" filter="drop-shadow(0 0 6px #f59e0b)"/>
  <text x="420" y="280" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">82.5° E Meridian (Mirzapur)</text>
  
  <!-- West and East Points -->
  <circle cx="245" cy="300" r="6" fill="#ef4444" filter="drop-shadow(0 0 6px #ef4444)"/>
  <text x="235" y="325" font-family="'Manrope', sans-serif" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="bold">West: Guhar Moti (Gujarat)</text>
  <text x="235" y="340" font-family="'Manrope', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Solar Time: ~UTC+4:35</text>
  
  <circle cx="565" cy="240" r="6" fill="#10b981" filter="drop-shadow(0 0 6px #10b981)"/>
  <text x="565" y="195" font-family="'Manrope', sans-serif" font-size="11" fill="#10b981" text-anchor="middle" font-weight="bold">East: Kibithu (Arunachal)</text>
  <text x="565" y="210" font-family="'Manrope', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Solar Time: ~UTC+6:30</text>
  
  <!-- Unified Clock Indicator -->
  <rect x="280" y="470" width="240" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="400" y="500" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0" text-anchor="middle">
    Single Time Zone: <tspan fill="#38bdf8">IST (UTC+5:30)</tspan>
  </text>
</svg>
