<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="geBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081e2b" />
      <stop offset="100%" stop-color="#0d3448" />
    </linearGradient>
    <linearGradient id="geCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0f3c52" />
    </linearGradient>
    <filter id="geShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#geBg)" />

  <!-- Header -->
  <g transform="translate(400, 42)" text-anchor="middle">
    <text x="0" y="0" font-family="'Space Grotesk', system-ui, sans-serif" font-size="23" font-weight="800" fill="#f4fbff">Comparing Local Time, GMT &amp; Eastern Time</text>
    <text x="0" y="24" font-family="'Manrope', system-ui, sans-serif" font-size="13" fill="#bdd2dc">Understanding the Reference Baseline and Seasonal Offsets</text>
  </g>

  <!-- 3 Zone Comparison Columns -->
  <g transform="translate(50, 95)">
    <!-- Column 1: Local Device Time -->
    <g transform="translate(0, 0)" filter="url(#geShadow)">
      <rect width="215" height="280" rx="12" fill="url(#geCardGrad)" stroke="#2f6278" stroke-width="1.5" />
      <rect x="0" y="0" width="215" height="40" rx="12" fill="#1b5f80" />
      <rect x="0" y="28" width="215" height="12" fill="#1b5f80" />
      <text x="107" y="25" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="700" fill="#8fd7ff" text-anchor="middle">LOCAL DEVICE TIME</text>

      <text x="107" y="90" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">YOUR ZONE</text>
      <text x="107" y="116" font-family="'Manrope', system-ui, sans-serif" font-size="12" font-weight="600" fill="#36c7b5" text-anchor="middle">Browser / OS Time</text>

      <line x1="18" y1="135" x2="197" y2="135" stroke="#256e91" stroke-width="1" />

      <text x="18" y="162" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#f4fbff">• Directly reads your system clock</text>
      <text x="18" y="190" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#f4fbff">• Updates live every second</text>
      <text x="18" y="218" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#f4fbff">• 12h or 24h toggleable</text>
      <text x="18" y="246" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#f4fbff">• Optional seconds display</text>
    </g>

    <!-- Column 2: GMT / UTC Baseline -->
    <g transform="translate(242, 0)" filter="url(#geShadow)">
      <rect width="215" height="280" rx="12" fill="url(#geCardGrad)" stroke="#2f6278" stroke-width="1.5" />
      <rect x="0" y="0" width="215" height="40" rx="12" fill="#1b5f80" />
      <rect x="0" y="28" width="215" height="12" fill="#1b5f80" />
      <text x="107" y="25" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="700" fill="#8fd7ff" text-anchor="middle">GMT / UTC</text>

      <text x="107" y="90" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">UTC±0</text>
      <text x="107" y="116" font-family="'Manrope', system-ui, sans-serif" font-size="12" font-weight="600" fill="#8fd7ff" text-anchor="middle">Global Civil Baseline</text>

      <line x1="18" y1="135" x2="197" y2="135" stroke="#256e91" stroke-width="1" />

      <text x="18" y="162" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#f4fbff">• Zero clock shifts year-round</text>
      <text x="18" y="190" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#f4fbff">• Never enters Daylight Saving</text>
      <text x="18" y="218" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#f4fbff">• Used by aviation &amp; servers</text>
      <text x="18" y="246" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#f4fbff">• Planetary time reference</text>
    </g>

    <!-- Column 3: Eastern Time (EST / EDT) -->
    <g transform="translate(485, 0)" filter="url(#geShadow)">
      <rect width="215" height="280" rx="12" fill="url(#geCardGrad)" stroke="#36c7b5" stroke-width="2" />
      <rect x="0" y="0" width="215" height="40" rx="12" fill="#156073" />
      <rect x="0" y="28" width="215" height="12" fill="#156073" />
      <text x="107" y="25" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="700" fill="#36c7b5" text-anchor="middle">EASTERN TIME (ET)</text>

      <text x="107" y="90" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="800" fill="#36c7b5" text-anchor="middle">EST / EDT</text>
      <text x="107" y="116" font-family="'Manrope', system-ui, sans-serif" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle">Dynamic Seasonal Offset</text>

      <line x1="18" y1="135" x2="197" y2="135" stroke="#256e91" stroke-width="1" />

      <text x="18" y="162" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#f4fbff">• Winter: <strong fill="#8fd7ff">EST (UTC−5)</strong></text>
      <text x="18" y="190" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#f4fbff">• Summer: <strong fill="#36c7b5">EDT (UTC−4)</strong></text>
      <text x="18" y="218" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#f4fbff">• Auto-detected by date</text>
      <text x="18" y="246" font-family="'Manrope', system-ui, sans-serif" font-size="12" fill="#f4fbff">• US &amp; Canadian East Coast</text>
    </g>
  </g>

  <!-- Bottom explanation note -->
  <g transform="translate(400, 412)" text-anchor="middle">
    <text font-family="'Manrope', system-ui, sans-serif" font-size="12" font-style="italic" fill="#8fd7ff">
      Eastern Time shifts between UTC−5 (EST) and UTC−4 (EDT), while GMT (UTC) remains fixed at UTC+0.
    </text>
  </g>
</svg>