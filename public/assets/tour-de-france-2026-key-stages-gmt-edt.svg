<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Tour de France 2026 key stages in GMT and EDT</title>
  <desc id="desc">Six must-watch Tour de France 2026 stages with converted start times for GMT and Eastern Daylight Time viewers.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#fff7ed"/></linearGradient>
    <style>
      .title{font:800 45px Arial, Helvetica, sans-serif; fill:#0f172a}
      .subtitle{font:500 23px Arial, Helvetica, sans-serif; fill:#475569}
      .num{font:900 30px Arial, Helvetica, sans-serif; fill:#0f172a}
      .cardTitle{font:800 21px Arial, Helvetica, sans-serif; fill:#0f172a}
      .date{font:700 20px Arial, Helvetica, sans-serif; fill:#64748b}
      .time{font:900 25px Arial, Helvetica, sans-serif; fill:#1d4ed8}
      .muted{fill:#475569}
      .note{font:600 18px Arial, Helvetica, sans-serif; fill:#64748b}
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#sky)"/>
  <path d="M0 574 C180 510 280 620 438 552 C592 486 740 606 898 526 C1040 454 1125 496 1200 452 L1200 720 L0 720 Z" fill="#dcfce7"/>
  <path d="M56 590 C210 520 338 632 516 552 C692 474 846 610 1146 486" fill="none" stroke="#111827" stroke-width="10" stroke-linecap="round" opacity=".18"/>
  <text x="58" y="94" class="title">Six Tour de France 2026 Stages to Prioritize</text>
  <text x="60" y="136" class="subtitle">Converted start times for GMT and US Eastern viewers.</text>
  <g>
