
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="40" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">IST Offset from Coordinated Universal Time (UTC)</text>
  
  <!-- UTC Clock -->
  <g transform="translate(180, 180)">
    <circle cx="0" cy="0" r="60" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="-45" stroke="#e2e8f0" stroke-width="3"/> <!-- Hour hand at 12 -->
    <line x1="0" y1="0" x2="0" y2="-55" stroke="#38bdf8" stroke-width="1.5"/> <!-- Minute hand at 12 -->
    <text x="0" y="85" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#64748b" text-anchor="middle">UTC / GMT</text>
    <text x="0" y="105" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0" text-anchor="middle">12:00 PM</text>
  </g>
  
  <!-- Offset Bridge -->
  <g transform="translate(320, 180)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#f59e0b" stroke-width="4" stroke-dasharray="6,4"/>
    <polygon points="150,-6 165,0 150,6" fill="#f59e0b"/>
    <rect x="35" y="-20" width="90" height="30" rx="4" fill="#f59e0b"/>
    <text x="80" y="0" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">+5:30 Hours</text>
  </g>
  
  <!-- IST Clock -->
  <g transform="translate(620, 180)">
    <circle cx="0" cy="0" r="60" fill="#1e293b" stroke="#f59e0b" stroke-width="3" filter="drop-shadow(0 0 8px #f59e0b)"/>
    <line x1="0" y1="0" x2="32" y2="28" stroke="#e2e8f0" stroke-width="3"/> <!-- Hour hand at 5:30 -->
    <line x1="0" y1="0" x2="0" y2="50" stroke="#f59e0b" stroke-width="2"/> <!-- Minute hand at 30 -->
    <text x="0" y="85" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">Indian Standard Time</text>
    <text x="0" y="105" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold" fill="#f59e0b" text-anchor="middle">05:30 PM</text>
  </g>
</svg>
