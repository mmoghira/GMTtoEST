
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="40" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#10b981" text-anchor="middle">New York Meeting Planner Overlap Matrix</text>
  
  <g transform="translate(80, 80)">
    <!-- Time Slot Bars -->
    <!-- NYC (EDT) -->
    <text x="20" y="35" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#f59e0b" font-weight="bold">New York (EDT, UTC-4)</text>
    <rect x="200" y="15" width="400" height="30" fill="#1e293b" rx="4" stroke="#f59e0b"/>
    <text x="220" y="35" font-family="monospace" font-size="10" fill="#f59e0b" font-weight="bold">09:00 AM</text>
    <text x="360" y="35" font-family="monospace" font-size="10" fill="#e2e8f0">12:00 PM</text>
    <text x="500" y="35" font-family="monospace" font-size="10" fill="#e2e8f0">03:00 PM</text>
    
    <!-- Dotted alignment corridors -->
    <path d="M 230,45 L 230,195" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <path d="M 530,45 L 530,195" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- London (BST) -->
    <text x="20" y="115" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#38bdf8" font-weight="bold">London (BST, UTC+1)</text>
    <rect x="200" y="95" width="400" height="30" fill="#1e293b" rx="4"/>
    <text x="220" y="115" font-family="monospace" font-size="10" fill="#38bdf8" font-weight="bold">02:00 PM</text>
    <text x="360" y="115" font-family="monospace" font-size="10" fill="#e2e8f0">05:00 PM</text>
    <text x="500" y="115" font-family="monospace" font-size="10" fill="#e2e8f0">08:00 PM</text>

    <!-- San Francisco (PDT) -->
    <text x="20" y="195" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#10b981" font-weight="bold">San Francisco (PDT, UTC-7)</text>
    <rect x="200" y="175" width="400" height="30" fill="#1e293b" rx="4"/>
    <text x="220" y="195" font-family="monospace" font-size="10" fill="#10b981" font-weight="bold">06:00 AM</text>
    <text x="360" y="195" font-family="monospace" font-size="10" fill="#e2e8f0">09:00 AM</text>
    <text x="500" y="195" font-family="monospace" font-size="10" fill="#e2e8f0">12:00 PM</text>
  </g>
  
  <rect x="150" y="300" width="500" height="70" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="400" y="325" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold" fill="#10b981" text-anchor="middle">Optimal Corporate Synergy Window</text>
  <text x="400" y="350" font-family="'Manrope', sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">
    Schedule calls during NYC <tspan fill="#f59e0b">09:00 AM - 12:00 PM</tspan> to sync with London afternoon and US West Coast morning.
  </text>
</svg>
