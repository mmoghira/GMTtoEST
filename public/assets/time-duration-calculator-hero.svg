<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="tdHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041018" />
      <stop offset="50%" stop-color="#0c354a" />
      <stop offset="100%" stop-color="#12455d" />
    </linearGradient>
    <linearGradient id="tdCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16516d" />
      <stop offset="100%" stop-color="#0d3a50" />
    </linearGradient>
    <linearGradient id="tdTealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36c7b5" />
      <stop offset="100%" stop-color="#8fd7ff" />
    </linearGradient>
    <filter id="tdShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#tdHeroBg)" />

  <!-- Background decorative clock/time grid lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <circle cx="480" cy="270" r="140" fill="none" />
    <circle cx="480" cy="270" r="240" fill="none" />
    <line x1="0" y1="270" x2="960" y2="270" />
    <line x1="480" y1="0" x2="480" y2="540" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(480, 50)" text-anchor="middle">
    <rect x="-150" y="0" width="300" height="32" rx="16" fill="rgba(54, 199, 181, 0.15)" stroke="#36c7b5" stroke-width="1.5" />
    <text x="0" y="21" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#36c7b5" letter-spacing="1.5">ELAPSED TIME &amp; DURATION</text>
    <text x="0" y="65" font-family="'Space Grotesk', system-ui, sans-serif" font-size="32" font-weight="800" fill="#f4fbff">Calculate Duration Between Dates &amp; Times</text>
  </g>

  <!-- Main Visual Flow -->
  <g transform="translate(60, 160)">
    <!-- Start Date/Time Card -->
    <g transform="translate(0, 0)" filter="url(#tdShadow)">
      <rect width="240" height="230" rx="16" fill="url(#tdCardGrad)" stroke="#2f6278" stroke-width="2" />
      <rect x="0" y="0" width="240" height="48" rx="16" fill="#1b5f80" />
      <rect x="0" y="32" width="240" height="16" fill="#1b5f80" />
      <text x="120" y="31" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="700" fill="#8fd7ff" text-anchor="middle">START DATE &amp; TIME</text>
      
      <text x="120" y="105" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">09:00</text>
      <text x="120" y="136" font-family="'Manrope', system-ui, sans-serif" font-size="16" font-weight="600" fill="#36c7b5" text-anchor="middle">25 October 2026</text>
      
      <line x1="24" y1="158" x2="216" y2="158" stroke="#256e91" stroke-width="1" />
      <text x="120" y="192" font-family="'Manrope', system-ui, sans-serif" font-size="13" fill="#bdd2dc" text-anchor="middle">540 Minutes From 00:00</text>
    </g>

    <!-- Center Duration Connector & Metric Cards -->
    <g transform="translate(260, 20)" text-anchor="middle">
      <path d="M 0 50 L 320 50" stroke="url(#tdTealGrad)" stroke-width="5" stroke-linecap="round" />
      <polygon points="315,44 328,50 315,56" fill="#8fd7ff" />
      
      <!-- Center Result Pill -->
      <g transform="translate(160, 50)">
        <rect x="-120" y="-36" width="240" height="72" rx="36" fill="#071b26" stroke="#36c7b5" stroke-width="2.5" filter="url(#tdShadow)" />
        <text x="0" y="-4" font-family="'Space Grotesk', system-ui, sans-serif" font-size="25" font-weight="800" fill="#36c7b5">8h 30m 00s</text>
        <text x="0" y="20" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="700" fill="#8fd7ff">8.50 DECIMAL HOURS</text>
      </g>

      <!-- Sub breakdown boxes -->
      <g transform="translate(50, 140)">
        <rect x="-45" y="0" width="90" height="54" rx="10" fill="#0c354a" stroke="#2f6278" stroke-width="1.5" />
        <text x="0" y="24" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="800" fill="#f4fbff">0</text>
        <text x="0" y="42" font-family="'Manrope', system-ui, sans-serif" font-size="11" font-weight="700" fill="#bdd2dc">DAYS</text>
      </g>
      <g transform="translate(140, 140)">
        <rect x="-40" y="0" width="80" height="54" rx="10" fill="#0c354a" stroke="#2f6278" stroke-width="1.5" />
        <text x="0" y="24" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="800" fill="#f4fbff">8</text>
        <text x="0" y="42" font-family="'Manrope', system-ui, sans-serif" font-size="11" font-weight="700" fill="#bdd2dc">HOURS</text>
      </g>
      <g transform="translate(225, 140)">
        <rect x="-40" y="0" width="80" height="54" rx="10" fill="#0c354a" stroke="#2f6278" stroke-width="1.5" />
        <text x="0" y="24" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="800" fill="#f4fbff">30</text>
        <text x="0" y="42" font-family="'Manrope', system-ui, sans-serif" font-size="11" font-weight="700" fill="#bdd2dc">MINUTES</text>
      </g>
      <g transform="translate(305, 140)">
        <rect x="-35" y="0" width="70" height="54" rx="10" fill="#0c354a" stroke="#2f6278" stroke-width="1.5" />
        <text x="0" y="24" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="800" fill="#fbbf24">0</text>
        <text x="0" y="42" font-family="'Manrope', system-ui, sans-serif" font-size="11" font-weight="700" fill="#bdd2dc">SEC</text>
      </g>
    </g>

    <!-- End Date/Time Card -->
    <g transform="translate(600, 0)" filter="url(#tdShadow)">
      <rect width="240" height="230" rx="16" fill="url(#tdCardGrad)" stroke="#36c7b5" stroke-width="2" />
      <rect x="0" y="0" width="240" height="48" rx="16" fill="#1b5f80" />
      <rect x="0" y="32" width="240" height="16" fill="#1b5f80" />
      <text x="120" y="31" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="700" fill="#36c7b5" text-anchor="middle">END DATE &amp; TIME</text>
      
      <text x="120" y="105" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">17:30</text>
      <text x="120" y="136" font-family="'Manrope', system-ui, sans-serif" font-size="16" font-weight="600" fill="#8fd7ff" text-anchor="middle">25 October 2026</text>
      
      <line x1="24" y1="158" x2="216" y2="158" stroke="#256e91" stroke-width="1" />
      <text x="120" y="192" font-family="'Manrope', system-ui, sans-serif" font-size="13" fill="#bdd2dc" text-anchor="middle">1,050 Minutes From 00:00</text>
    </g>
  </g>

  <!-- Bottom feature pills -->
  <g transform="translate(480, 475)" text-anchor="middle">
    <text font-family="'Manrope', system-ui, sans-serif" font-size="14" fill="#bdd2dc">
      Full Timeline Conversion  •  Total Days, Hours, Minutes, Seconds  •  Decimal Hours (2 Decimals)  •  Overnight Shift Aware
    </text>
  </g>
</svg>