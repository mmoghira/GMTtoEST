<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MST to EST time difference illustration</title>
  <desc id="desc">A clean time zone comparison showing Mountain Standard Time at UTC minus seven and Eastern Standard Time at UTC minus five with a two hour difference.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#082f49"/>
      <stop offset="0.52" stop-color="#0f3d56"/>
      <stop offset="1" stop-color="#12392f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <path d="M118 430 C258 330 342 320 472 382 C610 448 720 440 858 336 C954 264 1025 250 1085 282" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"/>
  <g filter="url(#soft)">
    <rect x="105" y="135" width="410" height="390" rx="24" fill="#123f55" stroke="#4b7890"/>
    <rect x="685" y="135" width="410" height="390" rx="24" fill="#123f55" stroke="#4b7890"/>
  </g>
  <text x="150" y="205" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="24" font-weight="700">Mountain Standard Time</text>
  <text x="150" y="260" fill="#ffffff" font-family="Arial, sans-serif" font-size="82" font-weight="800">MST</text>
  <text x="150" y="318" fill="#fbbf24" font-family="Arial, sans-serif" font-size="38" font-weight="800">UTC-7</text>
  <text x="150" y="382" fill="#d7eef8" font-family="Arial, sans-serif" font-size="24">Denver, Phoenix, Calgary</text>
  <circle cx="392" cy="396" r="62" fill="#0b2536" stroke="#f59e0b" stroke-width="8"/>
  <line x1="392" y1="396" x2="392" y2="356" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
  <line x1="392" y1="396" x2="424" y2="414" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round"/>
  <text x="730" y="205" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="24" font-weight="700">Eastern Standard Time</text>
  <text x="730" y="260" fill="#ffffff" font-family="Arial, sans-serif" font-size="82" font-weight="800">EST</text>
  <text x="730" y="318" fill="#2dd4bf" font-family="Arial, sans-serif" font-size="38" font-weight="800">UTC-5</text>
  <text x="730" y="382" fill="#d7eef8" font-family="Arial, sans-serif" font-size="24">New York, Toronto, Miami</text>
  <circle cx="972" cy="396" r="62" fill="#0b2536" stroke="#2dd4bf" stroke-width="8"/>
  <line x1="972" y1="396" x2="972" y2="348" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
  <line x1="972" y1="396" x2="1010" y2="396" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <rect x="454" y="560" width="292" height="86" rx="43" fill="#062334" stroke="url(#line)" stroke-width="3"/>
  <text x="600" y="595" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="19" font-weight="700">Eastern is ahead by</text>
  <text x="600" y="631" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="900">+2 HOURS</text>
  <path d="M520 330 H680" stroke="url(#line)" stroke-width="10" stroke-linecap="round"/>
  <path d="M666 304 L704 330 L666 356" fill="none" stroke="#2dd4bf" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
