
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="40" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">New York Offset from Coordinated Universal Time (UTC)</text>
  
  <!-- Left Side: UTC Reference -->
  <g transform="translate(150, 180)">
    <circle cx="0" cy="0" r="50" fill="#1e293b" stroke="#334155" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="-35" stroke="#e2e8f0" stroke-width="3"/>
    <text x="0" y="70" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#e2e8f0" font-weight="bold" text-anchor="middle">UTC Baseline (0)</text>
  </g>

  <!-- Connection Bridge -->
  <g transform="translate(200, 180)">
    <line x1="0" y1="0" x2="250" y2="0" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="10,-6 0,0 10,6" fill="#f59e0b"/>
  </g>
  
  <!-- Right Side: Standard (EST) -->
  <g transform="translate(480, 130)">
    <rect x="-80" y="-30" width="160" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="-5" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">EST (Standard Time)</text>
    <text x="0" y="20" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#38bdf8" font-weight="bold" text-anchor="middle">UTC-5 Hours</text>
  </g>

  <!-- Right Side: Daylight (EDT) -->
  <g transform="translate(480, 230)">
    <rect x="-80" y="-30" width="160" height="60" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="drop-shadow(0 0 6px #f59e0b)"/>
    <text x="0" y="-5" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">EDT (Daylight Saving)</text>
    <text x="0" y="20" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#f59e0b" font-weight="bold" text-anchor="middle">UTC-4 Hours</text>
  </g>
</svg>
