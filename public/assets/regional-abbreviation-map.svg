
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="45" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">North American Time Zone Abbreviations</text>
  
  <g transform="translate(80, 100)">
    <!-- Pacific -->
    <rect x="20" y="40" width="120" height="180" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="80" y="80" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#ef4444" text-anchor="middle">Pacific</text>
    <text x="80" y="110" font-family="'Manrope', sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">PST (UTC-8)</text>
    <text x="80" y="130" font-family="'Manrope', sans-serif" font-size="12" fill="#ef4444" text-anchor="middle">PDT (UTC-7)</text>
    
    <!-- Mountain -->
    <rect x="170" y="40" width="120" height="180" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="230" y="80" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">Mountain</text>
    <text x="230" y="110" font-family="'Manrope', sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">MST (UTC-7)</text>
    <text x="230" y="130" font-family="'Manrope', sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle">MDT (UTC-6)</text>

    <!-- Central -->
    <rect x="320" y="40" width="120" height="180" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="380" y="80" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#10b981" text-anchor="middle">Central</text>
    <text x="380" y="110" font-family="'Manrope', sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">CST (UTC-6)</text>
    <text x="380" y="130" font-family="'Manrope', sans-serif" font-size="12" fill="#10b981" text-anchor="middle">CDT (UTC-5)</text>

    <!-- Eastern -->
    <rect x="470" y="40" width="120" height="180" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="530" y="80" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">Eastern</text>
    <text x="530" y="110" font-family="'Manrope', sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">EST (UTC-5)</text>
    <text x="530" y="130" font-family="'Manrope', sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">EDT (UTC-4)</text>
  </g>
</svg>
