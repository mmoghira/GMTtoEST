<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">2026 NBA Finals Eastern Time to GMT schedule</title>
  <desc id="desc">A clean schedule graphic showing each 2026 NBA Finals game at 8:30 PM Eastern Time and 00:30 GMT the following day.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e9f5f3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="58" y="46" width="1084" height="628" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
  <rect x="90" y="84" width="1020" height="92" rx="8" fill="url(#accent)"/>
  <text x="122" y="122" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">2026 NBA FINALS TIME CONVERSION</text>
  <text x="122" y="156" fill="#e6fffb" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Every scheduled Finals game: 8:30 PM ET becomes 00:30 GMT the next day</text>

  <g font-family="Inter, Arial, sans-serif" font-size="19">
    <text x="124" y="230" fill="#5d6978" font-weight="900">GAME</text>
    <text x="292" y="230" fill="#5d6978" font-weight="900">US DATE</text>
    <text x="515" y="230" fill="#5d6978" font-weight="900">ET TIP-OFF</text>
    <text x="740" y="230" fill="#5d6978" font-weight="900">GMT TIP-OFF</text>
    <text x="948" y="230" fill="#5d6978" font-weight="900">GMT DATE</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">
    <g transform="translate(98 258)">
      <rect width="1004" height="54" rx="8" fill="#f8fafc" stroke="#d9e2ec"/>
      <text x="26" y="36" fill="#12202f">Game 1</text><text x="194" y="36" fill="#12202f">Wed, Jun 3</text><text x="417" y="36" fill="#0f766e">8:30 PM EDT</text><text x="642" y="36" fill="#1d4ed8">00:30 GMT</text><text x="850" y="36" fill="#12202f">Thu, Jun 4</text>
    </g>
    <g transform="translate(98 326)">
      <rect width="1004" height="54" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
      <text x="26" y="36" fill="#12202f">Game 2</text><text x="194" y="36" fill="#12202f">Fri, Jun 5</text><text x="417" y="36" fill="#0f766e">8:30 PM EDT</text><text x="642" y="36" fill="#1d4ed8">00:30 GMT</text><text x="850" y="36" fill="#12202f">Sat, Jun 6</text>
    </g>
    <g transform="translate(98 394)">
      <rect width="1004" height="54" rx="8" fill="#f8fafc" stroke="#d9e2ec"/>
      <text x="26" y="36" fill="#12202f">Game 3</text><text x="194" y="36" fill="#12202f">Mon, Jun 8</text><text x="417" y="36" fill="#0f766e">8:30 PM EDT</text><text x="642" y="36" fill="#1d4ed8">00:30 GMT</text><text x="850" y="36" fill="#12202f">Tue, Jun 9</text>
    </g>
    <g transform="translate(98 462)">
      <rect width="1004" height="54" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
      <text x="26" y="36" fill="#12202f">Game 4</text><text x="194" y="36" fill="#12202f">Wed, Jun 10</text><text x="417" y="36" fill="#0f766e">8:30 PM EDT</text><text x="642" y="36" fill="#1d4ed8">00:30 GMT</text><text x="850" y="36" fill="#12202f">Thu, Jun 11</text>
    </g>
    <g transform="translate(98 530)">
      <rect width="1004" height="54" rx="8" fill="#f8fafc" stroke="#d9e2ec"/>
      <text x="26" y="36" fill="#12202f">Game 5-7*</text><text x="194" y="36" fill="#12202f">Jun 13, 16, 19</text><text x="417" y="36" fill="#0f766e">8:30 PM EDT</text><text x="642" y="36" fill="#1d4ed8">00:30 GMT</text><text x="850" y="36" fill="#12202f">Next day</text>
    </g>
  </g>

  <text x="122" y="632" fill="#5d6978" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">*Games 5, 6 and 7 are played only if needed. Check NBA.com for final broadcast updates.</text>
</svg>
