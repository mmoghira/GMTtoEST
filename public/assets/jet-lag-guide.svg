<svg viewBox="0 0 800 320" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" style="max-width: 760px; font-family: sans-serif;">
        <rect width="800" height="320" fill="var(--panel)" rx="8"/>
        <!-- Background Grid Lines -->
        <line x1="50" y1="260" x2="750" y2="260" stroke="var(--line)" stroke-width="2"/>
        <line x1="50" y1="60" x2="50" y2="260" stroke="var(--line)" stroke-width="1.5"/>
        
        <!-- Home Time Wave (Blue) -->
        <path d="M 50 160 Q 137.5 40 225 160 T 400 160 T 575 160 T 750 160" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="4"/>
        <text x="70" y="80" fill="#3b82f6" font-size="13" font-weight="bold">Home Time Rhythm (Original SCN Phase)</text>

        <!-- Westward Phase Delay Wave (Green) -->
        <path d="M 110 160 Q 197.5 40 285 160 T 460 160 T 635 160 T 810 160" fill="none" stroke="#10b981" stroke-width="3.5"/>
        <text x="320" y="80" fill="#10b981" font-size="13" font-weight="bold">Westward Travel (Phase Delay: Lengthened Day - Easier)</text>

        <!-- Eastward Phase Advance Wave (Red/Orange) -->
        <path d="M 10 160 Q 80 40 150 160 T 290 160 T 430 160 T 570 160" fill="none" stroke="#ef4444" stroke-width="3.5"/>
        <text x="140" y="240" fill="#ef4444" font-size="13" font-weight="bold">Eastward Travel (Phase Advance: Compressed Day - Harder)</text>

        <!-- Axis Labels -->
        <text x="400" y="295" fill="var(--text)" font-size="14" text-anchor="middle">24-Hour Circadian Axis (Biological vs Destination Time)</text>
        <text x="30" y="160" fill="var(--text)" font-size="12" text-anchor="end">Alertness</text>
      </svg>