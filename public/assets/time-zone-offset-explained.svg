
  <svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="diagBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06151f"/>
        <stop offset="100%" stop-color="#0c354a"/>
      </linearGradient>
    </defs>

    <rect width="800" height="450" fill="url(#diagBg)"/>

    <!-- Header -->
    <text x="40" y="44" fill="#36c7b5" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">TIME ARCHITECTURE</text>
    <text x="40" y="74" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800">Time Zone, UTC Offset &amp; Daylight Saving Explained</text>

    <!-- 3 Core Concepts as Connected Pillars -->
    <!-- Pillar 1: Time Zone (The Rulebook) -->
    <g transform="translate(40, 110)">
      <rect x="0" y="0" width="225" height="235" rx="12" fill="#12455d" stroke="#1e5f80" stroke-width="2"/>
      <rect x="16" y="16" width="32" height="32" rx="8" fill="#3b82f6"/>
      <text x="27" y="37" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="900">1</text>
      <text x="58" y="38" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">THE RULEBOOK</text>
      
      <text x="16" y="80" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800">Time Zone</text>
      <text x="16" y="104" fill="#38bdf8" font-family="monospace" font-size="13">America/New_York</text>
      
      <line x1="16" y1="120" x2="209" y2="120" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="16" y="145" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">A permanent geographic</text>
      <text x="16" y="165" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">region sharing identical</text>
      <text x="16" y="185" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">civil time laws &amp; history.</text>
      <text x="16" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Changes rarely (laws only)</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M 275,225 L 295,225" stroke="#36c7b5" stroke-width="3" stroke-linecap="round"/>
    <polygon points="295,225 287,220 287,230" fill="#36c7b5"/>

    <!-- Pillar 2: UTC Offset (The Difference) -->
    <g transform="translate(305, 110)">
      <rect x="0" y="0" width="225" height="235" rx="12" fill="#12455d" stroke="#fbbf24" stroke-width="2"/>
      <rect x="16" y="16" width="32" height="32" rx="8" fill="#fbbf24"/>
      <text x="26" y="37" fill="#0c354a" font-family="system-ui, sans-serif" font-size="16" font-weight="900">2</text>
      <text x="58" y="38" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">THE DIFFERENCE</text>
      
      <text x="16" y="80" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800">UTC Offset</text>
      <text x="16" y="104" fill="#fbbf24" font-family="monospace" font-size="13">UTC−05:00 / UTC−04:00</text>
      
      <line x1="16" y1="120" x2="209" y2="120" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="16" y="145" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">The exact difference</text>
      <text x="16" y="165" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">in hours &amp; minutes from</text>
      <text x="16" y="185" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">universal atomic time.</text>
      <text x="16" y="215" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11">Shifts twice a year</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <path d="M 540,225 L 560,225" stroke="#36c7b5" stroke-width="3" stroke-linecap="round"/>
    <polygon points="560,225 552,220 552,230" fill="#36c7b5"/>

    <!-- Pillar 3: Daylight Saving Time (The Shift) -->
    <g transform="translate(570, 110)">
      <rect x="0" y="0" width="190" height="235" rx="12" fill="#12455d" stroke="#36c7b5" stroke-width="2"/>
      <rect x="16" y="16" width="32" height="32" rx="8" fill="#36c7b5"/>
      <text x="26" y="37" fill="#0c354a" font-family="system-ui, sans-serif" font-size="16" font-weight="900">3</text>
      <text x="58" y="38" fill="#8fd7ff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">THE SHIFT</text>
      
      <text x="16" y="80" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800">Daylight Saving</text>
      <text x="16" y="104" fill="#8fd7ff" font-family="monospace" font-size="13">Standard vs. DST</text>
      
      <line x1="16" y1="120" x2="174" y2="120" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="16" y="145" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Seasonal clock shift</text>
      <text x="16" y="165" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">advancing clocks 1 hr</text>
      <text x="16" y="185" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">during summer months.</text>
      <text x="16" y="215" fill="#36c7b5" font-family="system-ui, sans-serif" font-size="11">Active or Inactive</text>
    </g>

    <!-- Bottom Summary Box -->
    <rect x="40" y="365" width="720" height="60" rx="8" fill="#082030" stroke="#1e5f80" stroke-width="1.5"/>
    <text x="60" y="390" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Key Takeaway:</text>
    <text x="165" y="390" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="13">A time zone never changes, but its UTC offset changes when daylight saving starts or ends.</text>
    <text x="60" y="412" fill="#36c7b5" font-family="system-ui, sans-serif" font-size="12">Never treat a UTC offset (like UTC−5 or UTC+1) as a permanent property of a time zone.</text>
  </svg>
  