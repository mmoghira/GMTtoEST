<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26" />
      <stop offset="100%" stop-color="#0f3c52" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0c354a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36c7b5" />
      <stop offset="100%" stop-color="#8fd7ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <g transform="translate(0, 80)" text-anchor="middle">
    <text x="600" y="40" font-family="'Space Grotesk', system-ui, sans-serif" font-size="40" font-weight="bold" fill="#f4fbff">Pakistan Standard Time (PKT) — UTC+5</text>
    <text x="600" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="22" fill="#bdd2dc">Official Time Zone for Islamabad, Karachi, Lahore, and All Regions of Pakistan</text>
  </g>

  <!-- Infographic Grid -->
  <g transform="translate(150, 220)">
    <!-- Main Card -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="900" height="380" rx="16" fill="url(#cardGrad)" stroke="#36c7b5" stroke-width="3" />
      
      <!-- Key Stats Columns -->
      <g transform="translate(50, 50)">
        <!-- Stat 1 -->
        <g transform="translate(0, 0)">
          <rect width="240" height="130" rx="12" fill="#1b536e" />
          <text x="120" y="45" font-family="'Space Grotesk', system-ui, sans-serif" font-size="32" font-weight="bold" fill="#36c7b5" text-anchor="middle">UTC+5</text>
          <text x="120" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="16" font-weight="600" fill="#f4fbff" text-anchor="middle">Standard UTC Offset</text>
        </g>
        <!-- Stat 2 -->
        <g transform="translate(280, 0)">
          <rect width="240" height="130" rx="12" fill="#1b536e" />
          <text x="120" y="45" font-family="'Space Grotesk', system-ui, sans-serif" font-size="32" font-weight="bold" fill="#8fd7ff" text-anchor="middle">NO DST</text>
          <text x="120" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="16" font-weight="600" fill="#f4fbff" text-anchor="middle">Year-Round Standard</text>
        </g>
        <!-- Stat 3 -->
        <g transform="translate(560, 0)">
          <rect width="240" height="130" rx="12" fill="#1b536e" />
          <text x="120" y="45" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="bold" fill="#fbbf24" text-anchor="middle">Asia/Karachi</text>
          <text x="120" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="16" font-weight="600" fill="#f4fbff" text-anchor="middle">IANA Database Key</text>
        </g>
      </g>

      <!-- Details List -->
      <g transform="translate(50, 220)">
        <text x="0" y="30" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f4fbff">• Coverage: Applies nationwide across Pakistan's 4 provinces and territories.</text>
        <text x="0" y="70" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f4fbff">• Key Metropolitan Centers: Karachi, Lahore, Islamabad, Rawalpindi, Faisalabad, Peshawar.</text>
        <text x="0" y="110" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f4fbff">• Stability: Zero seasonal clock shifts—remains static at UTC+5 all 365 days of the year.</text>
      </g>
    </g>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(200, 660)" text-anchor="middle">
    <rect width="800" height="60" rx="12" fill="#12455d" stroke="#2f6278" stroke-width="1.5" />
    <text x="400" y="38" font-family="'Manrope', system-ui, sans-serif" font-size="19" font-weight="600" fill="#f4fbff">
      Pakistan Standard Time has maintained a permanent UTC+5 offset without DST changes since 2009.
    </text>
  </g>
</svg>
