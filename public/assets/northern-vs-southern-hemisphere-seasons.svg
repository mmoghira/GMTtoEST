
  <svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="hemBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0a1926"/>
        <stop offset="100%" stop-color="#0f2b3e"/>
      </linearGradient>
      <linearGradient id="northGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#9a3412"/>
        <stop offset="100%" stop-color="#451a03"/>
      </linearGradient>
      <linearGradient id="southGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#047857"/>
        <stop offset="100%" stop-color="#064e3b"/>
      </linearGradient>
    </defs>

    <rect width="800" height="450" fill="url(#hemBg)"/>

    <!-- Header -->
    <text x="40" y="44" fill="#36c7b5" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">GLOBAL PERSPECTIVE</text>
    <text x="40" y="74" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800">September Equinox: Opposite Seasons Across Hemispheres</text>

    <!-- Column 1: Northern Hemisphere -->
    <rect x="40" y="105" width="345" height="305" rx="12" fill="url(#northGrad)" stroke="#ea580c" stroke-width="2"/>
    <rect x="56" y="125" width="130" height="26" rx="6" fill="#ea580c"/>
    <text x="68" y="142" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">NORTHERN HEMISPHERE</text>
    <text x="56" y="185" fill="#fde047" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800">First Day of Fall</text>
    <text x="56" y="210" fill="#fdba74" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Autumnal Equinox (Sep 22–23)</text>
    <path d="M 56,225 L 365,225" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    
    <text x="56" y="250" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Solar Trend:</text>
    <text x="56" y="270" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="13">• Sun moves south across celestial equator</text>
    <text x="56" y="292" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="13">• Days grow shorter until winter solstice</text>
    <text x="56" y="314" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="13">• Average daily temperatures drop</text>
    
    <text x="56" y="350" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Regions Affected:</text>
    <text x="56" y="372" fill="#ffedd5" font-family="system-ui, sans-serif" font-size="12">USA, Canada, Europe, China, Japan, India</text>

    <!-- Column 2: Southern Hemisphere -->
    <rect x="415" y="105" width="345" height="305" rx="12" fill="url(#southGrad)" stroke="#10b981" stroke-width="2"/>
    <rect x="431" y="125" width="130" height="26" rx="6" fill="#10b981"/>
    <text x="443" y="142" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">SOUTHERN HEMISPHERE</text>
    <text x="431" y="185" fill="#a7f3d0" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800">First Day of Spring</text>
    <text x="431" y="210" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Vernal Equinox (Sep 22–23)</text>
    <path d="M 431,225 L 740,225" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

    <text x="431" y="250" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Solar Trend:</text>
    <text x="431" y="270" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="13">• Sun begins illuminating south pole</text>
    <text x="431" y="292" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="13">• Days grow progressively longer</text>
    <text x="431" y="314" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="13">• Warming temperatures toward summer</text>

    <text x="431" y="350" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Regions Affected:</text>
    <text x="431" y="372" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="12">Australia, New Zealand, South Africa, Brazil</text>
  </svg>
  