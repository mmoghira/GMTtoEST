<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Live MST and EST clock illustration</title>
  <desc id="desc">Two live clock panels for Mountain and Eastern time with seconds, date, UTC offset, and daylight saving status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0c354a"/>
      <stop offset="1" stop-color="#11263a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <circle cx="224" cy="180" r="100" fill="#123f55" stroke="#4b7890" stroke-width="4"/>
  <circle cx="976" cy="180" r="100" fill="#123f55" stroke="#4b7890" stroke-width="4"/>
  <line x1="224" y1="180" x2="224" y2="118" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <line x1="224" y1="180" x2="270" y2="205" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
  <line x1="976" y1="180" x2="976" y2="106" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <line x1="976" y1="180" x2="1028" y2="180" stroke="#2dd4bf" stroke-width="10" stroke-linecap="round"/>
  <rect x="110" y="340" width="430" height="240" rx="24" fill="#123f55" stroke="#4b7890"/>
  <rect x="660" y="340" width="430" height="240" rx="24" fill="#123f55" stroke="#4b7890"/>
  <text x="150" y="402" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="24" font-weight="800">Current Mountain Time</text>
  <text x="150" y="470" fill="#ffffff" font-family="Arial, sans-serif" font-size="58" font-weight="900">10:30:45</text>
  <text x="150" y="526" fill="#fbbf24" font-family="Arial, sans-serif" font-size="25" font-weight="800">MST or MDT by date</text>
  <text x="700" y="402" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="24" font-weight="800">Current Eastern Time</text>
  <text x="700" y="470" fill="#ffffff" font-family="Arial, sans-serif" font-size="58" font-weight="900">12:30:45</text>
  <text x="700" y="526" fill="#2dd4bf" font-family="Arial, sans-serif" font-size="25" font-weight="800">EST or EDT by date</text>
  <path d="M540 460 H660" stroke="#2dd4bf" stroke-width="10" stroke-linecap="round"/>
  <path d="M642 438 L676 460 L642 482" fill="none" stroke="#2dd4bf" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="642" fill="#d7eef8" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700">Seconds update continuously in the converter</text>
</svg>
