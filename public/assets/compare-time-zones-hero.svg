
  <svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06151f"/>
        <stop offset="50%" stop-color="#0c354a"/>
        <stop offset="100%" stop-color="#12455d"/>
      </linearGradient>
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="rgba(18, 69, 93, 0.95)"/>
        <stop offset="100%" stop-color="rgba(12, 53, 74, 0.95)"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#36c7b5" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#06151f" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect width="960" height="540" fill="url(#heroBg)"/>
    <circle cx="480" cy="270" r="380" fill="url(#sunGlow)"/>

    <!-- Subtle Longitude Arcs -->
    <g stroke="rgba(255,255,255,0.06)" stroke-width="1.5" fill="none">
      <ellipse cx="480" cy="270" rx="420" ry="210"/>
      <ellipse cx="480" cy="270" rx="280" ry="210"/>
      <ellipse cx="480" cy="270" rx="140" ry="210"/>
      <line x1="60" y1="270" x2="900" y2="270"/>
    </g>

    <!-- Header info in hero -->
    <g transform="translate(64, 48)">
      <rect x="0" y="0" width="220" height="30" rx="15" fill="rgba(54, 199, 181, 0.15)" stroke="#36c7b5" stroke-width="1.5"/>
      <text x="16" y="20" fill="#36c7b5" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">SIMULTANEOUS INSTANT</text>
      
      <text x="0" y="74" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="36" font-weight="800">Compare Time Zones</text>
      <text x="0" y="104" fill="#fbbf24" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="18" font-weight="700">One Global Moment Across Two or Three World Cities</text>
    </g>

    <!-- Three Side-by-Side Clocks / Cards -->
    <g transform="translate(64, 180)">
      
      <!-- Card 1: New York (EDT: UTC-4, e.g. 10:30 AM) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="260" height="310" rx="16" fill="url(#cardGrad)" stroke="#1e5f80" stroke-width="2"/>
        <rect x="20" y="20" width="60" height="22" rx="4" fill="#3b82f6"/>
        <text x="28" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">ZONE 1</text>
        
        <text x="20" y="75" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800">New York</text>
        <text x="20" y="96" fill="#93c5fd" font-family="monospace" font-size="12">America/New_York</text>

        <!-- Analog Clock Face -->
        <g transform="translate(130, 165)">
          <circle cx="0" cy="0" r="50" fill="#082030" stroke="#3b82f6" stroke-width="3"/>
          <line x1="0" y1="-44" x2="0" y2="-36" stroke="#93c5fd" stroke-width="2"/>
          <line x1="44" y1="0" x2="36" y2="0" stroke="#93c5fd" stroke-width="2"/>
          <line x1="0" y1="44" x2="0" y2="36" stroke="#93c5fd" stroke-width="2"/>
          <line x1="-44" y1="0" x2="-36" y2="0" stroke="#93c5fd" stroke-width="2"/>
          <!-- 10:30 hands -->
          <line x1="0" y1="0" x2="-22" y2="-20" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="0" y2="32" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="4" fill="#fbbf24"/>
        </g>

        <!-- Digital Readout -->
        <text x="20" y="248" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="22" font-weight="800">10:30 AM</text>
        <text x="20" y="272" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="13">Mon, Oct 26, 2026</text>
        <text x="20" y="294" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">UTC−04:00 (EDT)</text>
      </g>

      <!-- Card 2: London (GMT: UTC+0, e.g. 2:30 PM - 4 hrs ahead) -->
      <g transform="translate(285, 0)">
        <rect x="0" y="0" width="260" height="310" rx="16" fill="url(#cardGrad)" stroke="#36c7b5" stroke-width="2.5"/>
        <rect x="20" y="20" width="60" height="22" rx="4" fill="#36c7b5"/>
        <text x="28" y="35" fill="#0c354a" font-family="system-ui, sans-serif" font-size="11" font-weight="900">ZONE 2</text>
        
        <text x="20" y="75" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800">London</text>
        <text x="20" y="96" fill="#8fd7ff" font-family="monospace" font-size="12">Europe/London</text>

        <!-- Analog Clock Face -->
        <g transform="translate(130, 165)">
          <circle cx="0" cy="0" r="50" fill="#082030" stroke="#36c7b5" stroke-width="3"/>
          <line x1="0" y1="-44" x2="0" y2="-36" stroke="#8fd7ff" stroke-width="2"/>
          <line x1="44" y1="0" x2="36" y2="0" stroke="#8fd7ff" stroke-width="2"/>
          <line x1="0" y1="44" x2="0" y2="36" stroke="#8fd7ff" stroke-width="2"/>
          <line x1="-44" y1="0" x2="-36" y2="0" stroke="#8fd7ff" stroke-width="2"/>
          <!-- 2:30 hands -->
          <line x1="0" y1="0" x2="22" y2="-16" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="0" y2="32" stroke="#36c7b5" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="4" fill="#fbbf24"/>
        </g>

        <!-- Digital Readout -->
        <text x="20" y="248" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="22" font-weight="800">2:30 PM</text>
        <text x="20" y="272" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="13">Mon, Oct 26, 2026</text>
        <text x="20" y="294" fill="#36c7b5" font-family="system-ui, sans-serif" font-size="12" font-weight="700">4 hrs ahead of New York</text>
      </g>

      <!-- Card 3: Tokyo (JST: UTC+9, e.g. 11:30 PM - 13 hrs ahead) -->
      <g transform="translate(570, 0)">
        <rect x="0" y="0" width="260" height="310" rx="16" fill="url(#cardGrad)" stroke="#1e5f80" stroke-width="2"/>
        <rect x="20" y="20" width="60" height="22" rx="4" fill="#a855f7"/>
        <text x="28" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">ZONE 3</text>
        
        <text x="20" y="75" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800">Tokyo</text>
        <text x="20" y="96" fill="#d8b4fe" font-family="monospace" font-size="12">Asia/Tokyo</text>

        <!-- Analog Clock Face -->
        <g transform="translate(130, 165)">
          <circle cx="0" cy="0" r="50" fill="#082030" stroke="#a855f7" stroke-width="3"/>
          <line x1="0" y1="-44" x2="0" y2="-36" stroke="#d8b4fe" stroke-width="2"/>
          <line x1="44" y1="0" x2="36" y2="0" stroke="#d8b4fe" stroke-width="2"/>
          <line x1="0" y1="44" x2="0" y2="36" stroke="#d8b4fe" stroke-width="2"/>
          <line x1="-44" y1="0" x2="-36" y2="0" stroke="#d8b4fe" stroke-width="2"/>
          <!-- 11:30 hands -->
          <line x1="0" y1="0" x2="-10" y2="-28" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="0" y2="32" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="4" fill="#fbbf24"/>
        </g>

        <!-- Digital Readout -->
        <text x="20" y="248" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="22" font-weight="800">11:30 PM</text>
        <text x="20" y="272" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="13">Mon, Oct 26, 2026</text>
        <text x="20" y="294" fill="#a855f7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">13 hrs ahead of New York</text>
      </g>

    </g>
  </svg>
  