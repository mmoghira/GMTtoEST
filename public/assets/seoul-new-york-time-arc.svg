<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Seoul and New York time arc for KST to EST planning</title>
  <desc id="desc">A custom illustration showing Seoul at night, Eastern North America at morning, and a time arc between Korea Standard Time and Eastern Time.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="0.48" stop-color="#123a52"/>
      <stop offset="1" stop-color="#174d57"/>
    </linearGradient>
    <linearGradient id="river" x1="0" x2="1">
      <stop offset="0" stop-color="#1ca7b9"/>
      <stop offset="0.52" stop-color="#41d6bd"/>
      <stop offset="1" stop-color="#f2b85b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#sky)"/>
  <path d="M45 515 C210 458 311 584 478 512 C628 448 742 424 907 493 C1018 540 1110 526 1172 480 L1172 720 L45 720 Z" fill="#0a2433" opacity="0.78"/>
  <path d="M0 590 C175 545 270 629 440 585 C610 540 724 526 896 590 C1015 634 1113 610 1200 560 L1200 720 L0 720 Z" fill="#071a27"/>
  <path d="M96 614 C279 578 415 637 594 604 C740 577 850 566 1025 613 C1106 634 1166 628 1200 608 L1200 720 L0 720 L0 635 C28 629 59 622 96 614 Z" fill="url(#river)" opacity="0.46"/>
  <circle cx="1015" cy="132" r="56" fill="#f6c86d"/>
  <circle cx="1015" cy="132" r="86" fill="#f6c86d" opacity="0.16" filter="url(#soft)"/>
  <path d="M173 220 C365 72 674 88 889 232" fill="none" stroke="#8fd7ff" stroke-width="6" stroke-linecap="round" opacity="0.72"/>
  <path d="M173 220 C365 72 674 88 889 232" fill="none" stroke="#f3b34f" stroke-width="2" stroke-dasharray="10 16" stroke-linecap="round"/>
  <circle cx="173" cy="220" r="16" fill="#36c7b5"/>
  <circle cx="889" cy="232" r="16" fill="#f3b34f"/>
  <g transform="translate(95 280)">
    <rect x="0" y="116" width="54" height="145" rx="4" fill="#123f59"/>
    <rect x="68" y="88" width="44" height="173" rx="4" fill="#1b5a70"/>
    <rect x="126" y="132" width="54" height="129" rx="4" fill="#13465e"/>
    <rect x="194" y="70" width="62" height="191" rx="4" fill="#1d6176"/>
    <path d="M298 250 L298 22 L318 22 L318 250 Z" fill="#1f6f7d"/>
    <path d="M282 68 L334 68 L308 24 Z" fill="#36c7b5"/>
    <circle cx="308" cy="18" r="10" fill="#f6c86d"/>
    <rect x="0" y="250" width="360" height="16" rx="8" fill="#082637"/>
    <g fill="#eafcff" opacity="0.74">
      <rect x="13" y="132" width="8" height="10" rx="2"/>
      <rect x="33" y="156" width="8" height="10" rx="2"/>
      <rect x="81" y="112" width="8" height="10" rx="2"/>
      <rect x="145" y="155" width="8" height="10" rx="2"/>
      <rect x="212" y="94" width="8" height="10" rx="2"/>
      <rect x="232" y="126" width="8" height="10" rx="2"/>
    </g>
    <text x="0" y="305" fill="#d7eef8" font-family="Manrope, Arial, sans-serif" font-size="34" font-weight="800">Seoul</text>
    <text x="0" y="337" fill="#8fd7ff" font-family="Manrope, Arial, sans-serif" font-size="22">KST UTC+9</text>
  </g>
  <g transform="translate(785 302)">
    <rect x="0" y="118" width="56" height="125" rx="4" fill="#173b54"/>
    <rect x="70" y="52" width="48" height="191" rx="4" fill="#214f67"/>
    <path d="M150 243 L176 40 L202 243 Z" fill="#276378"/>
    <rect x="226" y="90" width="66" height="153" rx="4" fill="#1a455f"/>
    <rect x="310" y="122" width="42" height="121" rx="4" fill="#244f60"/>
    <rect x="-18" y="243" width="392" height="15" rx="8" fill="#081f2e"/>
    <g fill="#eafcff" opacity="0.58">
      <rect x="14" y="137" width="8" height="9" rx="2"/>
      <rect x="88" y="78" width="8" height="9" rx="2"/>
      <rect x="244" y="114" width="8" height="9" rx="2"/>
      <rect x="264" y="150" width="8" height="9" rx="2"/>
      <rect x="322" y="140" width="8" height="9" rx="2"/>
    </g>
    <text x="4" y="304" fill="#d7eef8" font-family="Manrope, Arial, sans-serif" font-size="34" font-weight="800">New York</text>
    <text x="4" y="337" fill="#ffd38a" font-family="Manrope, Arial, sans-serif" font-size="22">EST UTC-5 or EDT UTC-4</text>
  </g>
  <g transform="translate(462 214)">
    <rect width="276" height="150" rx="8" fill="#07131f" opacity="0.86" stroke="#3dd8c5" stroke-width="2"/>
    <text x="28" y="43" fill="#8fd7ff" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800">KST to EST</text>
    <text x="28" y="88" fill="#ffffff" font-family="Space Grotesk, Arial, sans-serif" font-size="34" font-weight="700">+13 / +14 hrs</text>
    <text x="28" y="119" fill="#bdd2dc" font-family="Manrope, Arial, sans-serif" font-size="18">Difference changes only on Eastern DST</text>
  </g>
</svg>
