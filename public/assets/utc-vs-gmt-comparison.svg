<svg class="visual-svg" viewBox="0 0 800 340" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UTC vs GMT Architecture Comparison Diagram">
        <rect width="800" height="340" rx="12" fill="#0f172a" stroke="var(--line)" stroke-width="2"/>
        
        <!-- Left Side: UTC Atomic Standard -->
        <rect x="40" y="40" width="330" height="260" rx="10" fill="rgba(59, 130, 246, 0.1)" stroke="#3b82f6" stroke-width="2"/>
        <text x="205" y="75" fill="#60a5fa" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="20" text-anchor="middle">UTC (Time Standard)</text>
        <text x="205" y="105" fill="#94a3b8" font-size="13" text-anchor="middle">Coordinated Universal Time</text>
        
        <rect x="60" y="125" width="290" height="40" rx="6" fill="#1e293b" stroke="#3b82f6"/>
        <text x="205" y="150" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Basis: 400+ Atomic Clocks (BIPM)</text>
        
        <rect x="60" y="175" width="290" height="40" rx="6" fill="#1e293b" stroke="#3b82f6"/>
        <text x="205" y="200" fill="#cbd5e1" font-size="12" text-anchor="middle">Precision: ~1 Nanosecond Error</text>

        <rect x="60" y="225" width="290" height="50" rx="6" fill="#1e293b" stroke="#3b82f6"/>
        <text x="205" y="245" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">Usage: Software DBs, NTP, GPS, ISO 8601</text>
        <text x="205" y="262" fill="#94a3b8" font-size="11" text-anchor="middle">Never shifts for DST</text>

        <!-- Right Side: GMT Civil Zone -->
        <rect x="430" y="40" width="330" height="260" rx="10" fill="rgba(16, 185, 129, 0.1)" stroke="#10b981" stroke-width="2"/>
        <text x="595" y="75" fill="#34d399" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="20" text-anchor="middle">GMT (Civil Time Zone)</text>
        <text x="595" y="105" fill="#94a3b8" font-size="13" text-anchor="middle">Greenwich Mean Time</text>
        
        <rect x="450" y="125" width="290" height="40" rx="6" fill="#1e293b" stroke="#10b981"/>
        <text x="595" y="150" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">Basis: Earth Solar Rotation (0° Meridian)</text>
        
        <rect x="450" y="175" width="290" height="40" rx="6" fill="#1e293b" stroke="#10b981"/>
        <text x="595" y="200" fill="#cbd5e1" font-size="12" text-anchor="middle">Precision: Varies with Earth Spin</text>

        <rect x="450" y="225" width="290" height="50" rx="6" fill="#1e293b" stroke="#10b981"/>
        <text x="595" y="245" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">Usage: UK Winter Civil Clocks, West Africa</text>
        <text x="595" y="262" fill="#94a3b8" font-size="11" text-anchor="middle">UK switches to BST (UTC+1) in Summer</text>

      </svg>