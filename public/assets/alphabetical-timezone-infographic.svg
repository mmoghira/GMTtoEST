
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="40" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#10b981" text-anchor="middle">Key Time Zone Abbreviations (A to Z)</text>
  
  <g transform="translate(60, 80)">
    <!-- Column 1 -->
    <g transform="translate(20, 20)">
      <text x="0" y="20" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#38bdf8" font-weight="bold">AEST</text>
      <text x="60" y="20" font-family="'Manrope', sans-serif" font-size="12" fill="#94a3b8">Australian Eastern Standard (UTC+10)</text>
      
      <text x="0" y="55" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#38bdf8" font-weight="bold">BST</text>
      <text x="60" y="55" font-family="'Manrope', sans-serif" font-size="12" fill="#94a3b8">British Summer Time (UTC+1)</text>

      <text x="0" y="90" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#38bdf8" font-weight="bold">CET</text>
      <text x="60" y="90" font-family="'Manrope', sans-serif" font-size="12" fill="#94a3b8">Central European Time (UTC+1)</text>
      
      <text x="0" y="125" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#38bdf8" font-weight="bold">EST</text>
      <text x="60" y="125" font-family="'Manrope', sans-serif" font-size="12" fill="#94a3b8">Eastern Standard Time (UTC-5)</text>

      <text x="0" y="160" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#38bdf8" font-weight="bold">GMT</text>
      <text x="60" y="160" font-family="'Manrope', sans-serif" font-size="12" fill="#94a3b8">Greenwich Mean Time (UTC+0)</text>

      <text x="0" y="195" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#38bdf8" font-weight="bold">HKT</text>
      <text x="60" y="195" font-family="'Manrope', sans-serif" font-size="12" fill="#94a3b8">Hong Kong Time (UTC+8)</text>
    </g>

    <!-- Column 2 -->
    <g transform="translate(360, 20)">
      <text x="0" y="20" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#f59e0b" font-weight="bold">IST</text>
      <text x="60" y="20" font-family="'Manrope', sans-serif" font-size="12" fill="#94a3b8">Indian Standard Time (UTC+5:30)</text>
      
      <text x="0" y="55" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#f59e0b" font-weight="bold">JST</text>
      <text x="60" y="55" font-family="'Manrope', sans-serif" font-size="12" fill="#94a3b8">Japan Standard Time (UTC+9)</text>

      <text x="0" y="90" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#f59e0b" font-weight="bold">MSK</text>
      <text x="60" y="90" font-family="'Manrope', sans-serif" font-size="12" fill="#94a3b8">Moscow Standard Time (UTC+3)</text>
      
      <text x="0" y="125" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#f59e0b" font-weight="bold">NZST</text>
      <text x="60" y="125" font-family="'Manrope', sans-serif" font-size="12" fill="#94a3b8">New Zealand Standard Time (UTC+12)</text>

      <text x="0" y="160" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#f59e0b" font-weight="bold">PST</text>
      <text x="60" y="160" font-family="'Manrope', sans-serif" font-size="12" fill="#94a3b8">Pacific Standard Time (UTC-8)</text>

      <text x="0" y="195" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#f59e0b" font-weight="bold">UTC</text>
      <text x="60" y="195" font-family="'Manrope', sans-serif" font-size="12" fill="#94a3b8">Coordinated Universal Time (Offset 0)</text>
    </g>
  </g>
</svg>
