
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="400" y="40" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#10b981" text-anchor="middle">Database Storage to Client Rendering (IST)</text>
  
  <!-- Server Database (UTC) -->
  <g transform="translate(100, 150)">
    <rect width="160" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="30" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">Database Storage</text>
    <text x="80" y="55" font-family="'Manrope', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Always stored in UTC</text>
    <rect x="20" y="75" width="120" height="30" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="80" y="93" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle">2026-07-15T12:00:00Z</text>
  </g>
  
  <!-- Process Arrow -->
  <g transform="translate(290, 200)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="#10b981" stroke-width="3"/>
    <polygon points="170,-6 185,0 170,6" fill="#10b981"/>
    <text x="90" y="-15" font-family="'Manrope', sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Client API Parse (Asia/Kolkata)</text>
  </g>

  <!-- Client Browser (IST Translation) -->
  <g transform="translate(500, 150)">
    <rect width="200" height="120" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="drop-shadow(0 0 8px #f59e0b)"/>
    <text x="100" y="30" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">Client Browser (IST)</text>
    <text x="100" y="55" font-family="'Manrope', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Formatted for Local User</text>
    <rect x="15" y="75" width="170" height="30" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="100" y="93" font-family="monospace" font-size="10" fill="#f59e0b" text-anchor="middle">Jul 15, 2026, 5:30:00 PM</text>
  </g>
</svg>
