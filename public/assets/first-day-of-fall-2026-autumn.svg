
  <svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0a2538"/>
        <stop offset="45%" stop-color="#1b4965"/>
        <stop offset="80%" stop-color="#e07a5f"/>
        <stop offset="100%" stop-color="#f4a261"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffe8a1" stop-opacity="1"/>
        <stop offset="40%" stop-color="#f4a261" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#f4a261" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="hillGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#9a3412"/>
        <stop offset="100%" stop-color="#451a03"/>
      </linearGradient>
      <linearGradient id="hillGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#c2410c"/>
        <stop offset="100%" stop-color="#7c2d12"/>
      </linearGradient>
      <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="rgba(12, 53, 74, 0.95)"/>
        <stop offset="100%" stop-color="rgba(18, 69, 93, 0.85)"/>
      </linearGradient>
    </defs>

    <!-- Sky -->
    <rect width="960" height="540" fill="url(#skyGrad)"/>

    <!-- Sun on the horizon -->
    <circle cx="580" cy="300" r="160" fill="url(#sunGlow)"/>
    <circle cx="580" cy="300" r="50" fill="#fef3c7"/>

    <!-- Distant hills -->
    <path d="M 0,380 Q 240,320 480,360 T 960,330 L 960,540 L 0,540 Z" fill="url(#hillGrad1)" opacity="0.85"/>
    <path d="M 0,420 Q 280,360 620,400 T 960,390 L 960,540 L 0,540 Z" fill="url(#hillGrad2)"/>

    <!-- Stylized Autumn Trees -->
    <!-- Tree 1 -->
    <path d="M 160,440 L 160,340" stroke="#291307" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="160" cy="320" rx="45" ry="55" fill="#ea580c"/>
    <ellipse cx="140" cy="310" rx="35" ry="40" fill="#f97316"/>
    <ellipse cx="180" cy="315" rx="30" ry="38" fill="#fbbf24"/>

    <!-- Tree 2 -->
    <path d="M 240,460 L 240,370" stroke="#291307" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="240" cy="355" rx="35" ry="45" fill="#d97706"/>
    <ellipse cx="255" cy="350" rx="25" ry="32" fill="#f59e0b"/>

    <!-- Tree 3 (Right) -->
    <path d="M 780,450 L 780,350" stroke="#291307" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="780" cy="330" rx="55" ry="65" fill="#c2410c"/>
    <ellipse cx="760" cy="320" rx="42" ry="48" fill="#ea580c"/>
    <ellipse cx="805" cy="325" rx="38" ry="44" fill="#fde047"/>

    <!-- Tree 4 (Right small) -->
    <path d="M 860,470 L 860,390" stroke="#291307" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="860" cy="380" rx="32" ry="40" fill="#b45309"/>

    <!-- Gentle falling leaves -->
    <circle cx="320" cy="340" r="4" fill="#fbbf24" opacity="0.8"/>
    <circle cx="360" cy="380" r="5" fill="#f97316" opacity="0.9"/>
    <circle cx="700" cy="370" r="4" fill="#f59e0b" opacity="0.75"/>
    <circle cx="740" cy="410" r="5" fill="#ea580c" opacity="0.85"/>
    <circle cx="670" cy="420" r="4" fill="#fbbf24" opacity="0.8"/>

    <!-- Foreground Silhouette & Leaves -->
    <path d="M 0,480 Q 300,450 600,470 T 960,460 L 960,540 L 0,540 Z" fill="#1c1917"/>

    <!-- Editorial Overlay Glass Card -->
    <rect x="48" y="48" width="460" height="154" rx="14" fill="url(#bannerGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
    <text x="76" y="86" fill="#36c7b5" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="2">ASTRONOMICAL AUTUMN 2026</text>
    <text x="76" y="126" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="30" font-weight="800">First Day of Fall 2026</text>
    <text x="76" y="160" fill="#fbbf24" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="16" font-weight="700">Sep 22, 2026 at 8:05 PM EDT &#160;•&#160; 00:05 UTC (Sep 23)</text>
    <text x="76" y="184" fill="#bdd2dc" font-family="system-ui, sans-serif" font-size="13">Official September Equinox: Earth&#39;s Sun directly over Equator</text>
  </svg>
  