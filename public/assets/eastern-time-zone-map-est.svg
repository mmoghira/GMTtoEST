<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26" />
      <stop offset="100%" stop-color="#0f3c52" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144d68" />
      <stop offset="100%" stop-color="#0c354a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <g transform="translate(0, 70)" text-anchor="middle">
    <text x="600" y="40" font-family="'Space Grotesk', system-ui, sans-serif" font-size="40" font-weight="bold" fill="#f4fbff">Eastern Time Zone Regional Boundaries</text>
    <text x="600" y="85" font-family="'Manrope', system-ui, sans-serif" font-size="22" fill="#bdd2dc">Representative Eastern U.S. States, Canadian Provinces &amp; Caribbean Territories</text>
  </g>

  <!-- Big Card -->
  <g transform="translate(150, 190)" filter="url(#shadow)">
    <rect width="900" height="450" rx="20" fill="url(#cardGrad)" stroke="#36c7b5" stroke-width="3" />
    
    <g transform="translate(60, 45)">
      <text x="0" y="30" font-family="'Space Grotesk', system-ui, sans-serif" font-size="32" font-weight="bold" fill="#f4fbff">Eastern Standard Time (EST, UTC-5)</text>
      <text x="0" y="65" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="600" fill="#8fd7ff">Primary Geographical Regions (Winter EST / Summer EDT)</text>
    </g>

    <line x1="60" y1="130" x2="840" y2="130" stroke="#256e91" stroke-width="2" />

    <g transform="translate(60, 170)">
      <g transform="translate(0, 0)">
        <text x="0" y="0" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="bold" fill="#36c7b5">🇺🇸 United States (23 States)</text>
        <text x="0" y="35" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• New York, Florida, Pennsylvania, Ohio, Georgia</text>
        <text x="0" y="70" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• North Carolina, Virginia, Massachusetts, Michigan</text>
        <text x="0" y="105" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• Washington D.C. (Capital) &amp; Wall Street (NYSE/NASDAQ)</text>
      </g>

      <g transform="translate(450, 0)">
        <text x="0" y="0" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="bold" fill="#36c7b5">🇨🇦 Canada (Provinces)</text>
        <text x="0" y="35" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• Ontario (Toronto, Ottawa)</text>
        <text x="0" y="70" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• Quebec (Montreal, Quebec City)</text>
        <text x="0" y="105" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• Eastern Nunavut territory</text>
      </g>

      <g transform="translate(0, 160)">
        <text x="0" y="0" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="bold" fill="#36c7b5">🌴 Caribbean &amp; Latin America</text>
        <text x="0" y="35" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• Jamaica (UTC-5 year-round, no DST)</text>
        <text x="0" y="70" font-family="'Manrope', system-ui, sans-serif" font-size="18" fill="#f4fbff">• Bahamas, Haiti, Cayman Islands, Panama</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(150, 680)" text-anchor="middle">
    <rect x="0" y="0" width="900" height="60" rx="12" fill="#12455d" stroke="#2f6278" stroke-width="1.5" />
    <text x="450" y="38" font-family="'Manrope', system-ui, sans-serif" font-size="19" font-weight="bold" fill="#f4fbff">
      Eastern Time covers ~47% of the total U.S. population.
    </text>
  </g>
</svg>
