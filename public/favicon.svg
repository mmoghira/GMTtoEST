<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="64" height="64">
  <defs>
    <linearGradient id="globeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003d99;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Blue outer arrow -->
  <path d="M 400 50 Q 500 100 550 150 L 580 140 Q 520 80 400 50 Z" fill="#0052cc" opacity="0.8"/>
  <path d="M 400 50 Q 500 100 550 150 L 520 200 Q 450 140 400 100 Z" fill="#0066ff" opacity="0.9"/>
  
  <!-- Orange bottom arrow -->
  <path d="M 400 750 Q 300 700 250 650 L 220 660 Q 280 720 400 750 Z" fill="#ff8000" opacity="0.8"/>
  <path d="M 400 750 Q 300 700 250 650 L 280 600 Q 350 660 400 700 Z" fill="#ff9933" opacity="0.9"/>
  
  <!-- Globe circle background -->
  <circle cx="400" cy="400" r="250" fill="url(#globeGradient)" opacity="0.3"/>
  
  <!-- Globe representation -->
  <circle cx="320" cy="380" r="180" fill="url(#globeGradient)" stroke="#001a4d" stroke-width="8"/>
  
  <!-- Grid lines on globe -->
  <circle cx="320" cy="380" r="180" fill="none" stroke="#0099ff" stroke-width="3" opacity="0.4"/>
  <circle cx="320" cy="380" r="150" fill="none" stroke="#0099ff" stroke-width="2" opacity="0.3"/>
  <circle cx="320" cy="380" r="120" fill="none" stroke="#0099ff" stroke-width="2" opacity="0.3"/>
  
  <!-- Continents/landmass simplified -->
  <ellipse cx="300" cy="320" rx="70" ry="60" fill="#0099ff" opacity="0.6"/>
  <path d="M 320 360 Q 340 370 350 390 L 330 400 Q 320 380 320 360" fill="#0099ff" opacity="0.5"/>
  
  <!-- Clock circle -->
  <circle cx="500" cy="400" r="180" fill="white" stroke="#001a4d" stroke-width="8"/>
  
  <!-- Clock face detail -->
  <circle cx="500" cy="400" r="170" fill="white" stroke="#e6e6e6" stroke-width="2"/>
  
  <!-- Hour markers -->
  <line x1="500" y1="240" x2="500" y2="260" stroke="#001a4d" stroke-width="6" stroke-linecap="round"/>
  <line x1="620" y1="400" x2="600" y2="400" stroke="#001a4d" stroke-width="6" stroke-linecap="round"/>
  <line x1="500" y1="560" x2="500" y2="540" stroke="#001a4d" stroke-width="6" stroke-linecap="round"/>
  <line x1="380" y1="400" x2="400" y2="400" stroke="#001a4d" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Hour hand (short) -->
  <line x1="500" y1="400" x2="500" y2="330" stroke="#001a4d" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Minute hand (long) -->
  <line x1="500" y1="400" x2="560" y2="360" stroke="#001a4d" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="500" cy="400" r="16" fill="#001a4d"/>
  <circle cx="500" cy="400" r="8" fill="white"/>
</svg>