<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Animated GMT to Eastern Time flow</title>
  <desc id="desc">An original visual showing time flowing from Greenwich Mean Time to Eastern Time across a world arc.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e8f7ff"/>
      <stop offset=".52" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#e9fbf6"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" x2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" rx="24" fill="url(#sky)"/>
  <g opacity=".42" fill="none" stroke="#8fb3c9" stroke-width="1">
    <path d="M72 92h816M72 172h816M72 252h816M72 332h816"/>
    <path d="M140 52v316M260 52v316M380 52v316M500 52v316M620 52v316M740 52v316M860 52v316"/>
  </g>
  <path d="M112 238c84-96 188-137 312-122 104 13 183 70 251 146 42 47 92 72 151 75" fill="none" stroke="url(#arc)" stroke-width="16" stroke-linecap="round"/>
  <path d="M112 238c84-96 188-137 312-122 104 13 183 70 251 146 42 47 92 72 151 75" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="18 22">
    <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="4s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(150 238)">
    <circle r="64" fill="#fff" stroke="#1d4ed8" stroke-width="8"/>
    <path d="M0 0V-38M0 0H32" stroke="#12202f" stroke-width="8" stroke-linecap="round"/>
    <circle r="6" fill="#12202f"/>
    <text x="0" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1d4ed8">GMT</text>
  </g>
  <g transform="translate(802 336)">
    <circle r="64" fill="#fff" stroke="#0f766e" stroke-width="8"/>
    <path d="M0 0L-28-36M0 0H35" stroke="#12202f" stroke-width="8" stroke-linecap="round"/>
    <circle r="6" fill="#12202f"/>
    <text x="0" y="-86" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#0f766e">EST</text>
  </g>
  <circle cx="472" cy="140" r="18" fill="#f59e0b" opacity="0.9">
    <animate attributeName="cx" values="156;472;806;156" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="236;126;332;236" dur="9s" repeatCount="indefinite"/>
  </circle>
  <g font-family="Arial, sans-serif" font-weight="700">
    <text x="480" y="338" text-anchor="middle" font-size="22" fill="#12202f">Date-aware DST conversion</text>
    <text x="480" y="368" text-anchor="middle" font-size="16" fill="#5d6978">GMT to EST or EDT in one glance</text>
  </g>
</svg>
